      - 179
      - 179
      text: This version of the IP fetches the next 16 x 32-bit message into the internal message scheduling
        array only after completing the current block.
    weak_evidence: []
    status: verified
    verify_reason: No test checks the fetch-after-block-completion timing. It is only implied by the 65-cycle
      model.
    verify_evidence:
    - &id152
      path: hw/ip/hmac/dv/env/hmac_env_pkg.sv
      line_start: 37
      line_end: 39
      quote: // 48 cycles of hashing, 16 cycles to rd next 16 words, 1 cycle to update digest
      role: supports
      note: The DV model uses 65 and 81 cycles per block, not the 80 and 96 the spec states. No exact-latency
        check exists.
  - req_id: cr_aeb18e72aa7a
    statement: SHA-2 256 takes 80 cycles to complete a block.
    section: hw/ip/hmac/doc/theory_of_operation.md > Theory of Operation > Design Details > Performance
      in SHA-2 mode and HMAC mode
    spec:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      lines:
      - 180
      - 180
      text: As such, it takes 80 cycles to complete a block.
    weak_evidence: []
    status: verified
    verify_reason: The DV model uses 65 cycles per block and never checks 80. No direct latency check
      exists.
    verify_evidence:
    - *id152
  - req_id: cr_ba453872049c
    statement: SHA-2 384/512 takes 96 cycles to complete a 1024-bit block.
    section: hw/ip/hmac/doc/theory_of_operation.md > Theory of Operation > Design Details > Performance
      in SHA-2 mode and HMAC mode
    spec:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      lines:
      - 185
      - 185
      text: It takes 96 cycles to complete a 1024-bit block.
    weak_evidence: []
    status: verified
    verify_reason: The DV model uses 81 cycles for SHA-2 384/512, not 96. No check of 96 exists.
    verify_evidence:
    - *id152
  - req_id: cr_c8b49e8b7b1f
    statement: Once the FIFO is full, software cannot push more data until the current block is processed.
    section: hw/ip/hmac/doc/theory_of_operation.md > Theory of Operation > Design Details > Performance
      in SHA-2 mode and HMAC mode
    spec:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      lines:
      - 178
      - 178
      text: But, once the FIFO gets full, the software cannot push more data until the current block is
        processed.
    weak_evidence: []
    status: withdrawn
    verify_reason: The scoreboard predicts FIFO fullness, with drain after block processing, and compares
      it with the DUT's status and the FIFO-empty interrupt. A wrong fill/drain behaviour would fail the
