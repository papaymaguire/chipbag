    - path: hw/ip/hmac/doc/theory_of_operation.md
      lines:
      - 190
      - 190
      text: This adds an extra 240 cycles (80 for the inner key, 80 for the outer key, and 80 for the
        result of the first round) to complete a HMAC SHA-2 256 digest of a message.
    weak_evidence: []
    status: verified
    verify_reason: Only the key-padding wait is modelled. The 240-cycle total HMAC overhead is never measured
