- id: f_b7de457c4c27
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: Revocation of the key by the key manager takes effect immediately.
  subject:
    requirements:
    - cr_605b3802525f
  section: hw/ip/hmac/doc/theory_of_operation.md > Theory of Operation > Design Details > Key sideloading
  spec:
  - path: hw/ip/hmac/doc/theory_of_operation.md
    lines: &id061
    - 139
    - 139
    text: the key manager revoking the key takes effect immediately
  detail:
    text: Revocation of the key by the key manager takes effect immediately.
    note: '"Immediately" gives no bound on how many cycles it takes for revocation to affect the HMAC
      core.'
    impact: 'The key value path is clear: the key is muxed rather than latched, so a changed key reaches
      the core combinationally. What is not bounded is how quickly the reaction to valid deassertion becomes
      observable. That reaction includes the abort, ERR_CODE=SwInvalidConfig, the SHA-2 engine, packer
      and FIFO being cleared, and the FSM returning to idle. One engineer might write a bounded assertion
      (e.g. error and idle within 1–2 cycles of valid dropping). Another might only check that these eventually
      happen before the next status read. A third might, like the existing test, only check that the next
      start is blocked. Those are different pass criteria for the mid-operation revocation case.'
    question: When the key manager deasserts the sideload valid indication during an operation, within
      how many clock cycles must the HMAC core abort, set ERR_CODE to SwInvalidConfig, clear the SHA-2
      state, digest, packer and FIFO, and return to idle? Is any processing (e.g. a block compression
      in flight) allowed to continue with the old key after valid drops?
  origin: normalize+review
  severity: low
  status: verified
  verify:
    outcome: verified
    turns: 5
    cost_usd: 0.0410311
    submissions: 1
    rejections: []
    error: null
    summary: 'Other spec text lists what happens on revocation mid-operation: abort, SwInvalidConfig,
      SHA-2/digest/packer/FIFO cleared, return to idle, and no done interrupt. No spec text gives a cycle
      bound. None says whether an in-flight block compression may continue with the old key. The ambiguity
      stands.'
    resolution: Add a statement to theory_of_operation.md giving the maximum latency in cycles from valid
      deasserting to abort, ERR_CODE set and idle. State whether a compression already in flight is cancelled
      or discarded. The RTL was not examined here.
    evidence:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      line_start: 155
      line_end: 157
      quote: The key manager deasserting the valid indication while an operation is in progress aborts
        that operation and reports the same error.
      role: context
      note: Gives the outcome of revocation but no latency in cycles and nothing about in-flight compression.
    - path: hw/ip/hmac/doc/theory_of_operation.md
      line_start: 139
      line_end: 139
      quote: the key manager revoking the key takes effect immediately
      role: supports
      note: '''Immediately'' is the only timing statement and it is unbounded.'
    - path: hw/ip/hmac/doc/programmers_guide.md
      line_start: 111
      line_end: 111
      quote: If the key manager revokes the key while an operation is running, that operation is aborted,
        the digest is cleared, and the same error is reported.
      role: context
      note: Repeats the behaviour without any timing.
    searches:
    - what: revoke, sideload, key valid, SwInvalidConfig in hmac md docs
      where: hw/ip/hmac
      found: Behavioural description in theory_of_operation.md, programmers_guide.md and registers.md.
        No cycle bound and nothing on in-flight processing.
    - what: revoke, key_valid, SwInvalidConfig in hmac/data
      where: hw/ip/hmac/data
      found: No matches.
    near_misses:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      line_start: 152
      line_end: 157
      why_not: Lists the reaction steps but gives no timing and does not say whether a compression in
        flight may finish.
    new_sources: []
    reclassify: null
