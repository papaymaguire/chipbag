- id: f_026e7be916d9
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: HMAC.SECURE_WIPE wipes the internal state and secret key with a constant value provided by software.
  subject:
    requirements:
    - cr_e476910c3588
  section: hw/ip/hmac/data/hmac.hjson > hmac > features
  spec:
  - path: hw/ip/hmac/data/hmac.hjson
    lines:
    - 183
    - 183
    text: Wipe of internal state and secret key with constant value provided by software.
  detail:
    text: HMAC.SECURE_WIPE wipes the internal state and secret key with a constant value provided by software.
    note: The trigger for the wipe and the width of the constant value are not stated.
    impact: The trigger and width are clear from the WIPE_SECRET register (a 32-bit write). What is wiped,
      and what is observable afterwards, is not stated. The existing tests already diverge on this. One
      only checks that the next digest is 'corrupted'. The other expects every DIGEST word to read back
      exactly the wipe value. A third reading would check that the key registers are wiped while DIGEST
      is unaffected. These give different expected values and pass criteria.
    question: 'After a write to WIPE_SECRET, which state is overwritten: key, intermediate hash/digest
      registers, message length, FSM? Must each DIGEST register read back exactly the written 32-bit value,
      replicated across all words? Does the wipe abort or affect an in-progress operation?'
  origin: normalize+review
  severity: medium
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.030008499999999997
    submissions: 1
    rejections: []
    error: null
    summary: The README and the WIPE_SECRET register description say what is wiped and with what value.
      This answers most of the finding's question. The one gap is the effect on an in-progress operation.
    resolution: The spec already says the key, intermediate hash, digest and message schedule are overwritten
      with the 32-bit value, replicated for 64-bit modes. It could still add a sentence on whether the
      wipe aborts an in-progress operation.
    evidence:
    - path: hw/ip/hmac/README.md
      line_start: 59
      line_end: 63
      quote: The internal variables and secret key will be reset to the written value.
      role: refutes
      note: Lists what is wiped (secret key, intermediate hash results, digest, message scheduling array),
        says the message FIFO is not wiped, and gives the 32-bit value replicated to 64 bits for SHA-2
        384/512.
    - path: hw/ip/hmac/data/hmac.hjson
      line_start: 455
      line_end: 457
      quote: The clear secret operation overwrites the internal variables with the provided 32-bit value.
      role: refutes
      note: The register description repeats the same scope, the 32-bit width and the replication rule.
    searches:
    - what: wipe in hmac md/hjson docs
      where: hw/ip/hmac
      found: README.md lines 59-64, registers.md and the hmac.hjson WIPE_SECRET description
    near_misses:
    - path: hw/ip/hmac/data/hmac_testplan.hjson
      line_start: 81
      line_end: 97
      why_not: The test plan is not specification. It is context only.
    new_sources:
    - path: hw/ip/hmac/README.md
      reason: Describes the wipe scope and the replication of the 32-bit value.
    reclassify: null
- id: f_08abef58a364
  category: spec_ambiguity
  category_no: 1
  type: vague
  title: 'The module can wipe internal variables such as the secret key, intermediate hash results, digest
    and message scheduling '
  subject:
    requirements:
    - cr_03340331c331
  section: hw/ip/hmac/README.md > Overview > Description
  spec:
  - path: hw/ip/hmac/README.md
    lines: &id012
    - 59
    - 59
    text: is able to wipe internal variables such as the secret key, intermediate hash results, digest
      and the internal message scheduling array.
  detail:
    text: The module can wipe internal variables such as the secret key, intermediate hash results, digest
      and message scheduling array.
    note: The 'such as' list does not state exactly which internal variables are wiped.
    impact: 'The ''such as'' list leaves it open which state a WIPE_SECRET write overwrites, so expected
      values differ between reasonable implementations. The two existing tests already disagree: one only
      checks that the digest differs from expected, the other checks that every digest word equals the
      wipe value. Other checks that depend on the full list: whether the key registers become the wipe
      value, so a subsequent HMAC without key reprogramming should equal HMAC(key=replicated wipe value).
      Whether a mid-hash wipe corrupts the intermediate state, so the resumed digest is predictable from
      the wipe value. Whether the message length counter and the save/restore context are cleared. Without
      the list, a scoreboard cannot model post-wipe digests precisely and can only do a weak ''differs''
      check.'
    question: 'Which internal state exactly does a WIPE_SECRET write overwrite with the (replicated) written
      value? Specifically: key registers KEY_0-31, digest/intermediate hash registers H0-H7, the message
      schedule array W, the message length counter, and any partially accumulated block. For each, after
      a wipe, what value does SW observe (e.g. DIGEST_n == wipe value), and what digest results if hashing
      continues without reprogramming the key?'
  origin: normalize+review
  severity: medium
  status: verified
  verify:
    outcome: verified
    turns: 5
    cost_usd: 0.0429078
    submissions: 1
    rejections: []
    error: null
    summary: The README, the register description and the hjson all repeat the same "such as" list. They
      add that the internal variables are overwritten with the written value and that the message FIFO
      is not wiped. None of them say which state is wiped (key registers, H0-H7, W, length counter, partial
      block), what SW reads back, or what digest results if hashing continues without reprogramming the
      key.
    resolution: Add an explicit list to the README and the WIPE_SECRET description. It should say which
      of KEY_0-31, H0-H7/DIGEST, W, the message length counter and the partial block are overwritten.
      It should also say what DIGEST_n reads after a wipe and what digest results if hashing continues
      without reprogramming the key.
    evidence:
    - path: hw/ip/hmac/README.md
      line_start: 59
      line_end: 62
      quote: The internal variables and secret key will be reset to the written value.
      role: supports
      note: This is the most specific statement. It still gives no list of the wiped state and no readback
        or post-wipe digest behaviour.
    - path: hw/ip/hmac/data/hmac.hjson
      line_start: 454
      line_end: 456
      quote: the value is used to clear some internal variables such as the secret key, intermediate hash
        results, digest and internal message scheduling array.
      role: supports
      note: The register description uses the same non-exhaustive 'such as' wording.
    searches:
    - what: WIPE_SECRET descriptions in the HMAC docs, register docs and hjson
      where: hw/ip/hmac
      found: README.md, doc/registers.md and data/hmac.hjson all give the same vague wording. None gives
        an exhaustive list or says what SW reads back.
    near_misses:
    - path: hw/ip/hmac/README.md
      line_start: 60
      line_end: 60
      why_not: It says the message FIFO is not wiped, but it does not address the key registers, the digest,
        the length counter or the post-wipe results.
    new_sources: []
    reclassify: null
- id: f_099bc6608b8a
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: When a sideloaded key is used, CMD.hash_stop and CMD.hash_continue are rejected (saving and restoring
    the context is not
  subject:
    requirements:
    - cr_f3333982706d
  section: hw/ip/hmac/doc/theory_of_operation.md > Theory of Operation > Design Details > Key sideloading
    > Restrictions with a sideloaded key
  spec:
  - path: hw/ip/hmac/doc/programmers_guide.md
    lines: &id076
    - 102
    - 102
    text: Saving and restoring the context is not available
  - path: hw/ip/hmac/doc/programmers_guide.md
    lines: &id077
    - 102
    - 102
    text: CMD.hash_stop and CMD.hash_continue are rejected
  - path: hw/ip/hmac/doc/theory_of_operation.md
    lines: &id011
    - 164
    - 164
    text: 'saving and restoring the context is not available with a sideloaded key: `CMD.hash_stop` and
      `CMD.hash_continue` are rejected'
  - path: hw/ip/hmac/doc/theory_of_operation.md
    lines: *id011
    text: 'saving and restoring the context is not available with a sideloaded key: `CMD.hash_stop` and
      `CMD.hash_continue` are rejected'
  detail:
    text: When a sideloaded key is used, CMD.hash_stop and CMD.hash_continue are rejected (saving and
      restoring the context is not available).
    note: It is not stated what 'rejected' means for the command (ignored, state unchanged, etc.).
    impact: The existing test checks only the interrupt and ERR_CODE. The spec does not say what happens
      to the ongoing operation after the reject. One engineer would check that the operation continues
      and produces the correct final digest. Another might expect the engine to abort or go idle, or that
      hash_done never fires. Checks could also differ on whether a hash_continue issued without a prior
      stop changes any state or the message length counter, and on whether the hmac_done/hash_done interrupts
      fire.
    question: When CMD.hash_stop or CMD.hash_continue is rejected with a sideloaded key, does the in-progress
      operation continue unaffected and produce the correct final digest after hash_process? Or is it
      aborted, and if so what state do the FSM, DIGEST, MSG_LENGTH and the done interrupt end up in? Is
      the rejected command simply dropped with no other side effect besides ERR_CODE=SwInvalidConfig and
      the hmac_err interrupt?
  origin: normalize+review
  severity: medium
  status: verified
  verify:
    outcome: verified
    turns: 5
    cost_usd: 0.039951
    submissions: 1
    rejections: []
    error: null
    summary: No other spec text defines what "rejected" means for hash_stop/hash_continue with a sideloaded
      key. The docs only say the commands are rejected and ERR_CODE reports SwInvalidConfig. The key-invalid
      case is spelled out in detail, including the abort, the cleared state and no hmac_done. Nothing
      equivalent exists for rejected stop/continue.
    resolution: Spec should state that a rejected hash_stop/hash_continue is dropped with no side effect
      other than ERR_CODE=SwInvalidConfig and the hmac_err interrupt. It should also say whether the in-progress
      operation continues and still raises hmac_done after hash_process, or is aborted as in the invalid-key
      case.
    evidence:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      line_start: 164
      line_end: 164
      quote: 'saving and restoring the context is not available with a sideloaded key: `CMD.hash_stop`
        and `CMD.hash_continue` are rejected, and [`ERR_CODE`](registers.md#err_code) reports `SwInvalidConfig`.'
      role: supports
      note: Only says rejected plus ERR_CODE; no statement on the ongoing operation, FSM state, or interrupts.
    - path: hw/ip/hmac/doc/programmers_guide.md
      line_start: 103
      line_end: 103
      quote: A message hashed with a sideloaded key has to be run to completion in one go.
      role: context
      note: Suggests the operation is meant to run to completion, but does not say a rejected command
        leaves it unaffected.
    - path: hw/ip/hmac/doc/theory_of_operation.md
      line_start: 155
      line_end: 157
      quote: aborts that operation and reports the same error.
      role: context
      note: The abort semantics are explicit for the invalid-key case only, which highlights the gap for
        rejected stop/continue.
    searches:
    - what: hash_stop/hash_continue in hmac docs and hjson
      where: hw/ip/hmac (md, hjson)
      found: Only the theory_of_operation and programmers_guide lines (plus the generic hjson/registers.md
        CMD descriptions) mention these; none defines the reject behaviour.
    near_misses:
    - path: hw/ip/hmac/doc/theory_of_operation.md
      line_start: 152
      line_end: 157
      why_not: Describes blocked start/continue with an invalid key and the abort on key invalidation,
        not the rejection of stop/continue with a valid sideloaded key.
    new_sources: []
    reclassify: null
