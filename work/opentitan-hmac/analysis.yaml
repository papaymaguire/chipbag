  detail:
    text: When a sideloaded key is used, CMD.hash_stop and CMD.hash_continue are rejected (saving and
      restoring the context is not available).
    note: It is not stated what 'rejected' means for the command (ignored, state unchanged, etc.).
    impact: The existing test checks only the interrupt and ERR_CODE. The spec does not say what happens
      to the ongoing operation after the reject. One engineer would check that the operation continues
      and produces the correct final digest. Another might expect the engine to abort or go idle, or that
      hash_done never fires. Checks could also differ on whether a hash_continue issued without a prior
      stop changes any state or the message length counter, and on whether the hmac_done/hash_done interrupts
      fire.
    question: When CMD.hash_stop or CMD.hash_continue is rejected with a sideloaded key, does the in-progress
      operation continue unaffected and produce the correct final digest after hash_process? Or is it
      aborted, and if so what state do the FSM, DIGEST, MSG_LENGTH and the done interrupt end up in? Is
      the rejected command simply dropped with no other side effect besides ERR_CODE=SwInvalidConfig and
      the hmac_err interrupt?
  origin: normalize+review
  severity: medium
  status: candidate
