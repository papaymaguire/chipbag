      could therefore hold the remaining internal state words, zeros, or be undefined. A check reading
      all digest registers would compare against different expected values, or mask them, depending on
      the interpretation.
    question: 'In SHA-2 384 mode, what must DIGEST_12..15 contain after completion: the untruncated remaining
      SHA-512 state words, zero, or undefined? Must DV check them or exclude them from comparison?'
  origin: normalize+review
  severity: medium
  status: candidate
- id: f_fc00646d2273
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: Starting an operation while the sideloaded key is invalid is blocked.
  subject:
    requirements:
    - cr_447297d23029
  section: hw/ip/hmac/doc/programmers_guide.md > Programmer's Guide > Using a sideloaded key
  spec:
  - path: hw/ip/hmac/doc/programmers_guide.md
    lines:
    - 110
    - 110
    text: Starting while the key is invalid is blocked
  detail:
    text: Starting an operation while the sideloaded key is invalid is blocked.
    note: '''Blocked'' does not say how the start command is handled.'
    impact: 'The spec defines the error (SwInvalidConfig via hmac_err) but not what ''blocked'' does to
      the rest of the state. One engineer might check only the error and that hmac_done stays low, as
      the existing test does. Another might also check any of the following, and could reasonably expect
      different values:

      - the engine stays idle;

      - later MSG_FIFO writes are dropped, or accepted and counted in MSG_LENGTH;

      - a following CMD.hash_process is ignored;

      - the previous DIGEST contents are kept or cleared;

      - whether a later valid start needs a fresh hash_start.'
    question: 'When CMD.hash_start is written while the sideloaded key is invalid, is the command dropped
      with the engine left fully idle? Specifically:

      - Are subsequent MSG_FIFO writes discarded or accepted, and is MSG_LENGTH updated?

      - Is a following CMD.hash_process ignored, or does it also report an error?

      - Are DIGEST_0-15 left unchanged or cleared?

      - Is the only side effect ERR_CODE=SwInvalidConfig plus INTR_STATE.hmac_err?'
  origin: normalize+review
  severity: medium
  status: candidate
- id: f_b7de457c4c27
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: Revocation of the key by the key manager takes effect immediately.
  subject:
    requirements:
    - cr_605b3802525f
  section: hw/ip/hmac/doc/theory_of_operation.md > Theory of Operation > Design Details > Key sideloading
  spec:
  - path: hw/ip/hmac/doc/theory_of_operation.md
    lines: &id046
    - 139
    - 139
    text: the key manager revoking the key takes effect immediately
  detail:
    text: Revocation of the key by the key manager takes effect immediately.
    note: '"Immediately" gives no bound on how many cycles it takes for revocation to affect the HMAC
      core.'
    impact: 'The key value path is clear: the key is muxed rather than latched, so a changed key reaches
      the core combinationally. What is not bounded is how quickly the reaction to valid deassertion becomes
      observable. That reaction includes the abort, ERR_CODE=SwInvalidConfig, the SHA-2 engine, packer
      and FIFO being cleared, and the FSM returning to idle. One engineer might write a bounded assertion
      (e.g. error and idle within 1–2 cycles of valid dropping). Another might only check that these eventually
      happen before the next status read. A third might, like the existing test, only check that the next
      start is blocked. Those are different pass criteria for the mid-operation revocation case.'
    question: When the key manager deasserts the sideload valid indication during an operation, within
      how many clock cycles must the HMAC core abort, set ERR_CODE to SwInvalidConfig, clear the SHA-2
      state, digest, packer and FIFO, and return to idle? Is any processing (e.g. a block compression
      in flight) allowed to continue with the old key after valid drops?
  origin: normalize+review
  severity: low
  status: candidate
