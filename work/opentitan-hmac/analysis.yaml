    note: The conditions that define the HMAC as idle are not stated.
    impact: 'The cycle on which a hmac_idle check expects the bit to drop and rise again depends on its
      definition. It could be any of the following: 0 from hash_start until hmac_done; 0 whenever the
      FIFO is non-empty, even before start; 0 while the SHA engine is busy after hash_stop; 0 during the
