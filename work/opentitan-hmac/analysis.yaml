  detail:
    text: The module can wipe internal variables such as the secret key, intermediate hash results, digest
      and message scheduling array.
    note: The 'such as' list does not state exactly which internal variables are wiped.
    impact: 'The ''such as'' list leaves it open which state a WIPE_SECRET write overwrites, so expected
      values differ between reasonable implementations. The two existing tests already disagree: one only
      checks that the digest differs from expected, the other checks that every digest word equals the
      wipe value. Other checks that depend on the full list: whether the key registers become the wipe
      value, so a subsequent HMAC without key reprogramming should equal HMAC(key=replicated wipe value).
      Whether a mid-hash wipe corrupts the intermediate state, so the resumed digest is predictable from
      the wipe value. Whether the message length counter and the save/restore context are cleared. Without
      the list, a scoreboard cannot model post-wipe digests precisely and can only do a weak ''differs''
      check.'
    question: 'Which internal state exactly does a WIPE_SECRET write overwrite with the (replicated) written
      value? Specifically: key registers KEY_0-31, digest/intermediate hash registers H0-H7, the message
      schedule array W, the message length counter, and any partially accumulated block. For each, after
      a wipe, what value does SW observe (e.g. DIGEST_n == wipe value), and what digest results if hashing
      continues without reprogramming the key?'
