  detail:
    text: prim_packer compacts written data into word size and writes it to the MSG_FIFO when the write
      is not a full word write.
    note: The sentence is grammatically unclear about whether packing applies only to non-word writes
      and what happens to word writes.
    impact: 'Whether word writes bypass the packer is not observable. However, the rules for aggregating
      sub-word writes into message words are not stated. These rules decide the byte stream the reference
      model hashes, and so the expected digest. The undefined points are: byte order across successive
      partial writes, handling of non-contiguous byte strobes, and the position of the first byte of a
      write at a non-zero byte offset. Two engineers could build different models for narrow or unaligned
      writes. The existing smoke and burst tests check end to end, but only against whichever packing
      model they assume.'
    question: 'How does prim_packer assemble sub-word writes into MSG_FIFO words? Specifically: (1) Are
      only the bytes enabled by the strobe used, appended in arrival order starting from the LSB? (2)
      Is a write with non-contiguous byte strobes legal, and if so, how is it packed? (3) Do the address
      offset and byte lane within the window affect packing, or only the strobe? (4) How does the endian
      swap setting interact with packed partial words?'
