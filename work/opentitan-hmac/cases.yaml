  text: "import logging as log\nimport sys\n\nimport numpy as np\n\ninit_h = [\n    0x6a09e667, 0xbb67ae85,\
    \ 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c,\n    0x1f83d9ab, 0x5be0cd19\n]\n\nk = [\n    0x428a2f98,\
    \ 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1,\n    0x923f82a4, 0xab1c5ed5, 0xd807aa98,\
    \ 0x12835b01, 0x243185be, 0x550c7dc3,\n    0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1,\
    \ 0xefbe4786,\n    0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,\n    0x983e5152,\
    \ 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,\n    0x06ca6351, 0x14292967, 0x27b70a85,\
    \ 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,\n    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1,\
    \ 0xa81a664b,\n    0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,\n    0x19a4c116,\
    \ 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,\n    0x5b9cca4f, 0x682e6ff3, 0x748f82ee,\
    \ 0x78a5636f, 0x84c87814, 0x8cc70208,\n    0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2\n]\n\n\n\
    def rotr(v: np.uint32, amt: int) -> np.uint32:\n    return (v >> amt) | ((v << (32 - amt)) & 0xFFFFFFFF)\n\
    \n\ndef shiftr(v: np.uint32, amt: int) -> np.uint32:\n    return (v >> amt)\n\n\ndef sha256(msg: bin)\
    \ -> bin:\n    # Assume given message is always byte aligned\n    L = len(bytes(msg)) * 8\n    zero_padding_length\
    \ = (512 - ((L + 8 + 64) % 512))\n    log.info(\"0 padding: %d bits\" % (zero_padding_length))\n \
    \   # padding\n    new_msg = msg + b'\\x80' + (b'\\0' * (\n        (zero_padding_length // 8))) +\
    \ L.to_bytes(\n            8, byteorder='big')\n    new_L = len(new_msg)\n\n    log.info(\"Padded\
    \ message: %s\" % (binascii.b2a_hex(new_msg)))\n    # Convert byte to 32bit array\n    # w_array =\
    \ np.array(new_msg, dtype=np.uint32)\n    dt = np.dtype(np.uint32)\n    dt = dt.newbyteorder('>')\
    \  # bigendian\n    w_array = np.frombuffer(new_msg, dtype=dt)\n\n    # compress function\n    [h0,\
    \ h1, h2, h3, h4, h5, h6, h7] = init_h\n    for i in range(0, new_L // 4, 16):  # every 512 bit\n\
    \        # create w\n        # 16 entry x 32 bit word\n        w = w_array[i:i + 16]\n        # for\
    \ j in range(16):\n\n        [a, b, c, d, e, f, g, h] = [h0, h1, h2, h3, h4, h5, h6, h7]\n       \
    \ for i in range(64):\n            w_entry = w[0]\n            # Calculate 16th entry and push to\
    \ the end\n            #   s0 = (w[i-15] rotr 7) xor (w[i-15] rotr 18) xor (w[i-15] shiftr 3)\n  \
    \          #   s1 = (w[i-2] rotr 17) xor (w[i-2] rotr 19) xor (w[i-2] shiftr 10)\n            #  \
    \ w[i] = w[i-16] + s0 + w[i-7] + s1\n            sum_0 = rotr(w[1], 7) ^ rotr(w[1], 18) ^ shiftr(w[1],\
    \ 3)\n            sum_1 = rotr(w[14], 17) ^ rotr(w[14], 19) ^ shiftr(w[14], 10)\n            w = np.append(w[1:16],\
    \ 0xFFFFFFFF & (w[0] + sum_0 + w[9] + sum_1))\n\n            # Compress\n            S1 = rotr(e,\
    \ 6) ^ rotr(e, 11) ^ rotr(e, 25)\n            ch = (e & f) ^ ((~e) & g)\n            temp1 = (h +\
    \ S1 + ch + k[i] + w_entry) & 0xFFFFFFFF\n            S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)\n\
    \            maj = (a & b) ^ (a & c) ^ (b & c)\n            temp2 = (S0 + maj) & 0xFFFFFFFF\n\n  \
    \          h = g\n            g = f\n            f = e\n            e = (d + temp1) & 0xFFFFFFFF\n\
    \            d = c\n            c = b\n            b = a\n            a = (temp1 + temp2) & 0xFFFFFFFF\n\
    \n        h0 = (h0 + a) & 0xFFFFFFFF\n        h1 = (h1 + b) & 0xFFFFFFFF\n        h2 = (h2 + c) &\
    \ 0xFFFFFFFF\n        h3 = (h3 + d) & 0xFFFFFFFF\n        h4 = (h4 + e) & 0xFFFFFFFF\n        h5 =\
    \ (h5 + f) & 0xFFFFFFFF\n        h6 = (h6 + g) & 0xFFFFFFFF\n        h7 = (h7 + h) & 0xFFFFFFFF\n\n\
    \    # merge\n    digest = np.array([h0, h1, h2, h3, h4, h5, h6, h7], dtype=dt).tobytes()\n\n    return\
    \ digest\n\n\ndef _hmac(key: bin, src: bin, hashf) -> bin:\n    blocksize = 64  # SHA-256\n    if\
    \ len(key) > blocksize:\n        key = hashf(key)\n    key = key + b'\\00' * (blocksize - len(key))\n\
    \    log.info(\"Padded Key: %s\" % binascii.b2a_hex(key).decode('utf-8'))\n    ipad = bytes([x ^ 0x36\
    \ for x in key])\n    opad = bytes([x ^ 0x5c for x in key])\n    meta_v = hashf(ipad + src)\n    log.info(\"\
    Meta hash output: %s\" % binascii.b2a_hex(meta_v).decode('utf-8'))\n    sig = hashf(opad + meta_v)\n\
    \    return sig"
