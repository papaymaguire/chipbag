    \ *hash_mode = kOtcryptoHashModeSha256;\n      return OK_STATUS();\n    case kHmacTestOperationSha384:\n\
    \      *hash_mode = kOtcryptoHashModeSha384;\n      return OK_STATUS();\n    case kHmacTestOperationSha512:\n\
    \      *hash_mode = kOtcryptoHashModeSha512;\n      return OK_STATUS();\n    default:\n      return\
    \ INVALID_ARGUMENT();\n  }\n}\n\n/**\n * Instantiate `hash_ctx` context object with hash/mac mode\
    \ specified in\n * `current_test_vector`.\n *\n * @param hash_ctx Corresponding context for given\
    \ `current_test_vector`.\n * @param current_test_vector Pointer to the hardcoded test vector.\n */\n\
    static status_t ctx_init(otcrypto_hmac_context_t *ctx,\n                         hmac_test_vector_t\
    \ *current_test_vector) {\n  // Overwrite the security level of the test vector.\n  otcrypto_key_config_t\
