    \  end\n    begin\n      p = process::self();\n      // randomly pick the size of bytes to write\n\
    \      // unless msg size is smaller than randomized size\n      while (msg_q.size() > 0) begin\n\
    \        bit [7:0] word_unpack[4];\n        bit [TL_DW-1:0] word;\n        `DV_CHECK_FATAL(randomize(wr_addr,\
    \ wr_mask) with {$countones(wr_mask) <= msg_q.size();})\n\n        if (cfg.under_reset) break;   //\
    \ Skip if a reset is ongoing...\n        foreach (wr_mask[i]) begin\n          // wr_mask is a packed\
    \ array, word_unpacked is unpack, has different index\n          if (wr_mask[i]) begin\n         \
    \   word_unpack[3 - i] = msg_q.pop_front();\n          end else begin\n            word_unpack[3 -\
    \ i] = $urandom();\n          end\n        end\n        word = {>>byte{word_unpack}};\n        `uvm_info(`gfn,\
    \ $sformatf(\"wr_addr = %0h, wr_mask = %04b, words = 0x%0h\",\n                                  wr_addr,\
