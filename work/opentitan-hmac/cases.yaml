    \            end\n          end\n          // randomly change key, config regs during msg wr, should\
    \ trigger error or be discarded\n          write_discard_config_and_key(wr_config_during_hash, wr_key_during_hash);\n\
    \          // Randomly trigger error code read also when no error is supposed to happen\n        \
    \  if ($urandom_range(0, 1)) begin\n            check_error_code(0);\n          end\n        end else\
    \ begin\n          check_error_code(1);\n        end\n      end\n      // Keep it alive only if needed\n\
    \      if (!sar_ongoing) begin\n        disable sar_simple_thread;\n        sar_window.reset();\n\
    \      end\n    end\n  join\n  sar_window.reset();\n  if (cfg.under_reset) return;   // Skip if a\
    \ reset is ongoing..."
