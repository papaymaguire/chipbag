    \  end\n  hmac_process        = 0;\n  hmac_start          = 0;\n  hmac_continue       = 0;\n  hmac_process_last\
    \   = 0;\n  hmac_start_last     = 0;\n  hmac_stopped_last   = 0;\n  hmac_continue_last  = 0;\n  fifo_full_detected\
    \  = 0;\n  fifo_empty_intr     = 0;\n  void'(ral.intr_state.fifo_empty.predict(\n    .value(fifo_empty_intr\
    \ | last_intr_test_wr[HmacMsgFifoEmpty]), .kind(UVM_PREDICT_READ)));\nendfunction : flush"
- path: hw/ip/hmac/dv/env/hmac_scoreboard.sv
  chunk: hmac_scoreboard > hmac_process_fifo_status
  chunk_id: sec_cfa3b89b627f
  lines:
  - 648
  - 722
  chars:
  - 29590
  - 33191
  text: "// Spawn a thread as an event from the list above might occur during the time we wait\n    //\
    \ for the clock cycle (later in this thread).\n    fork begin\n      // Store hmac_process and hmac_start\
    \ to be able to detect when it goes up, as it could remain\n      // up for a while\n      bit hmac_fifo_full_posedge;\n\
    \      bit hmac_process_posedge  = hmac_process & ~hmac_process_last;\n      bit hmac_start_posedge\
    \    = hmac_start & ~hmac_start_last;\n      bit hmac_stopped_posedge  = hmac_stopped & ~hmac_stopped_last;\n\
    \      bit hmac_continue_posedge = hmac_continue & ~hmac_continue_last;\n\n      // Store last value\
    \ to be able to detect signal change\n      hmac_process_last   = hmac_process;\n      hmac_stopped_last\
    \   = hmac_stopped;\n      hmac_start_last     = hmac_start;\n      hmac_continue_last  = hmac_continue;\n\
    \      hmac_fifo_full_last = hmac_fifo_full;\n\n      // When hmac_wr_cnt and hmac_rd_cnt update at\
    \ the same time, wait for the clock rising edge\n      // to guarantee both get updated and at the\
    \ same time as the DUT\n      cfg.clk_rst_vif.wait_clks(1);\n\n      // Compute FIFO level flags\n\
    \      hmac_fifo_depth = hmac_wr_cnt - hmac_rd_cnt;\n      hmac_fifo_full  = hmac_fifo_depth == HMAC_MSG_FIFO_DEPTH_WR;\n\
    \      hmac_fifo_empty = hmac_fifo_depth == 0;\n\n      hmac_fifo_full_posedge = hmac_fifo_full &\
    \ ~hmac_fifo_full_last;\n\n      // Check whether FIFO full should be cleared (for another reason\
    \ than the emptiness)\n      if (hmac_process_posedge || hmac_start_posedge || hmac_stopped_posedge\
    \ ||\n          hmac_continue_posedge) begin\n        fifo_full_detected = 0;\n      end\n\n     \
    \ // The FIFO empty interrupt is raised only if the message FIFO is actually writable by\n      //\
    \ software, i.e., if all of the following conditions are met:\n      //   1- The HMAC block is not\
    \ running in HMAC mode and performing the second round of\n      //      computing the final hash\
    \ of the outer key as well as the result of the first round\n      //      using the inner key.\n\
    \      //   2- Software has not yet written the Process or Stop command to finish the hashing\n  \
    \    //      operation.\n      //   3- The message FIFO must also have been full previously. Otherwise,\
    \ the hardware empties\n      //      the FIFO faster than software can fill it and there is no point\
    \ in interrupting the\n      //      software to inform it about the message FIFO being empty.\n \
    \     if (fifo_full_detected && hmac_fifo_empty) begin\n        pre_fifo_empty_intr = 1;\n      end\
    \ else begin\n        pre_fifo_empty_intr = 0;\n      end\n\n      // Delay FIFO empty signal to be\
    \ aligned with the DUT behavior\n      fork\n        begin\n          cfg.clk_rst_vif.wait_clks(1);\n\
    \          fifo_empty_intr = pre_fifo_empty_intr;\n        end\n      join_none\n\n      // Ensures\
    \ that FIFO levels have been updated as a read and write may have race conditions\n      // and 2\
    \ processes are spawned in parallel. And wait on the second negative edge to be sure\n      // that\
    \ empty/full flags will be up to date.\n      cfg.clk_rst_vif.wait_n_clks(2);\n      // Reset full\
    \ flag when emptiness has been reached\n      if (hmac_fifo_empty) begin\n        fifo_full_detected\
    \ = 0;\n      // Check whether FIFO full has been detected for the ongoing message but the restrictions\
    \ cases\n      // have the priority in case full is set at the same moment. Use the posedge to be\
    \ sure that\n      // it is high because of the current message and check also that it's still high\
    \ at that time.\n      end else if (hmac_fifo_full_posedge && hmac_fifo_full) begin\n        fifo_full_detected\
    \ = 1;\n      end\n    end join_none\n  end\nendtask : hmac_process_fifo_status"
