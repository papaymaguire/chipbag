    \    = (hmac_rd_cnt * 32 + block_size - 1) / block_size;\n              msg_slice_length = mult *\
    \ block_size / 8;\n            end else begin\n              msg_slice_length = 0;\n            end\n\
    \n            // In case the remaining message is less than a block size, push only this remaining\n\
    \            // message into the queue.\n            if (msg_slice_length > msg_q.size()) begin\n\
    \              msg_slice_length = msg_q.size();\n            end\n\n            // Push partial message\
    \ into a new queue to be processed by the digest predictor\n            for (int i=0; i<msg_slice_length;\
    \ i++) begin\n              msg_part_q.push_back(msg_q[i]);\n            end\n            // Process\
