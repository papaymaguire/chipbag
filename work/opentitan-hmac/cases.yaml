  text: "bit key_processed = 0;\n  fork\n    begin : process_hmac_key_pad\n      forever begin\n     \
    \   cfg.clk_rst_vif.wait_clks(1);\n        // Key padding\n        wait(hmac_start && sha_en);\n \
    \       if (`gmv(ral.cfg.hmac_en) && hmac_rd_cnt == 0 && !invalid_cfg) begin\n          if (`gmv(ral.cfg.digest_size)\
    \ == SHA2_256) begin\n            key_process_cycles = HMAC_KEY_PROCESS_CYCLES_256;\n          end\
    \ else begin\n            key_process_cycles = HMAC_KEY_PROCESS_CYCLES_512;\n          end\n     \
    \     // key_process_cycles for hmac key padding + 1 cycle for hash_start reg to reset\n         \
    \ cfg.clk_rst_vif.wait_clks(key_process_cycles + 1);\n          @(negedge cfg.clk_rst_vif.clk);\n\
    \          key_processed = 1;\n        end\n        while (1) begin\n          // break if hmac is\
    \ done or if invalid config error is triggered or if SHA is\n          // being disabled as HMAC enable\
    \ configuration could be changed and thus\n          // key_process_cycles might need to be updated\n\
    \          if (`gmv(ral.intr_state.hmac_done) ||\n              (`gmv(ral.intr_state.hmac_err) &&\
    \ `gmv(ral.err_code) == SwInvalidConfig) ||\n              !sha_en) begin\n            break;\n  \
    \        end\n          cfg.clk_rst_vif.wait_clks(1);\n        end\n        key_processed = 0;\n \
    \     end\n    end\n\n    begin : process_internal_fifo_rd\n      forever begin\n        // Ensure\
    \ that current context has to be taken into account or skipped\n        if (cfg.sar_skip_ctxt) begin\n\
    \          wait(!cfg.sar_skip_ctxt);\n        end\n        wait((hmac_wr_cnt > hmac_rd_cnt) && (sha_en));\n\
    \        if (`gmv(ral.cfg.hmac_en) && hmac_rd_cnt == 0) begin\n          `uvm_info(`gfn, $sformatf(\"\
    waiting on key processing to complete\"), UVM_HIGH)\n          wait(key_processed);\n          `uvm_info(`gfn,\
    \ $sformatf(\"key processing has completed\"), UVM_HIGH)\n        end\n        #1ps; // delay 1 ps\
    \ to make sure did not sample right at negedge clk\n        cfg.clk_rst_vif.wait_n_clks(1);\n    \
    \    hmac_rd_cnt++;\n        `uvm_info(`gfn, $sformatf(\"increase rd cnt %0d\", hmac_rd_cnt), UVM_HIGH)\n\
    \        // select correct FIFO read depth and message processing cycles\n        if (`gmv(ral.cfg.digest_size)\
    \ == SHA2_256) begin\n          fifo_rd_depth        = HMAC_MSG_FIFO_DEPTH_RD_256;\n          block_process_cycles\
    \ = HMAC_MSG_PROCESS_CYCLES_256;\n        end else begin\n          fifo_rd_depth        = HMAC_MSG_FIFO_DEPTH_RD_512;\n\
    \          block_process_cycles = HMAC_MSG_PROCESS_CYCLES_512;\n        end\n        if (hmac_rd_cnt\
    \ % fifo_rd_depth == 0) begin\n          `uvm_info(`gfn, $sformatf(\"start waiting on message processing\
    \ now\"), UVM_HIGH)\n          cfg.clk_rst_vif.wait_n_clks(block_process_cycles);\n          `uvm_info(`gfn,\
    \ $sformatf(\"message processing has completed\"), UVM_HIGH)\n        end\n      end\n    end\n  join_none\n\
    endtask : hmac_process_fifo_rd"
