    - 317
    text: TRY_CHECK(hmac_err_reg == kErrorSwHashStartWhenActive,
    kind: check
    statement: Error code register equals kErrorSwHashStartWhenActive (0x04). TRY_CHECK returns an error status,
      but test_main discards the return value.
    fails_test: 'no'
  - path: sw/device/tests/hmac_error_conditions_test.c
    lines:
    - 157
    - 157
    text: TRY_CHECK(hmac_err_reg == kErrorSwPushMsgWhenDisallowed,
    kind: check
    statement: Error code register equals kErrorSwPushMsgWhenDisallowed (0x05). TRY_CHECK returns an error status,
      but test_main discards the return value of this function.
    fails_test: 'no'
  - path: sw/device/tests/hmac_error_conditions_test.c
    lines:
    - 244
    - 244
    text: TRY_CHECK(hmacerr_reg == kErrorSwInvalidConfig,
    kind: check
    statement: Error code register equals kErrorSwInvalidConfig (0x06). TRY_CHECK returns an error status, but test_main
      discards the return value.
    fails_test: 'no'
  - path: sw/device/tests/hmac_error_conditions_test.c
    lines:
    - 176
    - 176
    text: TRY_CHECK(hmac_err_reg == kErrorSwPushMsgWhenDisallowed,
    kind: check
    statement: Error code register equals kErrorSwPushMsgWhenDisallowed (0x05). TRY_CHECK returns an error status,
      but test_main discards the return value.
    fails_test: 'no'
  verify:
    summary: Every error-code comparison in the test uses TRY_CHECK, which only returns an INTERNAL status after
      logging an error. All seven run_test_* functions return status_t, and test_main calls them without checking
      the result and then returns true. A wrong error code therefore does not fail the test. Only the CHECK_STATUS_OK
      and CHECK_DIF_OK calls can fail it, and none of those verify an error code.
    resolution: Replace TRY_CHECK with CHECK in the run_test_* functions, or wrap the calls in test_main with CHECK_STATUS_OK
      so the error status is propagated.
