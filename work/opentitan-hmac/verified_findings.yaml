  what: It is not stated what 'rejected' means for the command (ignored, state unchanged, etc.).
  question_for_architect: When CMD.hash_stop or CMD.hash_continue is issued with a sideloaded key, is the command
    simply ignored (the ongoing operation continues unaffected, and further message input plus hash_process still
    produce the correct final digest)? Or does the rejection abort or alter the operation? Also, which status, interrupt
    and register fields (besides ERR_CODE=SwInvalidConfig and the error interrupt) change?
  test_impact: The existing test checks only the interrupt and ERR_CODE. A DV engineer still has to decide what
    the scoreboard predicts after the rejection, and two engineers could reasonably predict different things. One
    might expect the operation to carry on and the final digest to stay correct, so the test keeps feeding the message
    and compares the digest against the reference. Another might expect the hash to stop or abort, so the test checks
    the hmac_done/idle status and does not expect a digest. A further difference is whether hash_continue is rejected
    only while an operation is in progress, or also when issued with no operation running while key_sideload is
    set.
