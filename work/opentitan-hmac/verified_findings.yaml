- id: f_f7e6f870b119
  category: 2. spec_contradiction
  type: description_vs_definition
  severity: high
  title: A 384-bit digest is twelve 32-bit words (DIGEST_0-DIGEST_11), but the text gives DIGEST_0-DIGEST_12, which
    is thirteen r
  what: A 384-bit digest is twelve 32-bit words (DIGEST_0-DIGEST_11), but the text gives DIGEST_0-DIGEST_12, which
    is thirteen registers.
  question_for_architect: Is the SHA-2 384 digest read from DIGEST_0-DIGEST_11 or DIGEST_0-DIGEST_12?
  spec:
  - path: hw/ip/hmac/README.md
    lines:
    - 42
    - 42
    text: or from DIGEST_0-DIGEST_12 for SHA-2 384
  verify:
    summary: The README gives DIGEST_0-DIGEST_12 for SHA-2 384. A 384-bit digest is twelve 32-bit words, so the
      range should be DIGEST_0-DIGEST_11. The same sentence uses DIGEST_0-DIGEST_7 for 256 bits (8 words) and DIGEST_0-DIGEST_15
      for 512 bits (16 words), so the 384 case is the odd one out. I did not read the RTL or the generated register
      code. I did check the hjson, which defines a DIGEST register array and says nothing more specific about SHA-2
      384.
    resolution: The correct range is DIGEST_0-DIGEST_11 (12 words × 32 bits = 384 bits). Change "DIGEST_12" to "DIGEST_11"
      in hw/ip/hmac/README.md:42. I did not check what the RTL does, so this is based on the word-count arithmetic
      and the DIGEST_0-DIGEST_15 array in the hjson.
    evidence:
    - path: hw/ip/hmac/README.md
      lines:
      - 42
      - 42
      role: supports
      quote: or from [`DIGEST_0-DIGEST_12`](doc/registers.md#digest) for SHA-2 384
      note: Gives 13 registers for a 384-bit digest, which is inconsistent with 384/32 = 12 words.
    searches: 2
  reviewer:
    verdict: confirmed
    note: README.md:42 says DIGEST_0-DIGEST_12 for SHA-2 384; 384/32 = 12 words, so DIGEST_0-11. The scoreboard
      (hmac_scoreboard.sv:494, idx<12) is right. A real spec typo.
- id: f_7414e0033b45
  category: 3. test_inconsistency
  type: check_cannot_fail
