      - 332
      role: supports
      quote: '  run_test_pushmsg_when_shadisabled(&hmac, kData, sizeof(kData), NULL,'
      note: The returned status_t is discarded here. The same holds for every later run_test_* call, and test_main
        finishes with return true.
    - path: sw/device/tests/hmac_error_conditions_test.c
      lines:
      - 317
      - 318
      role: supports
      quote: '  TRY_CHECK(hmac_err_reg == kErrorSwHashStartWhenActive,'
      note: A representative error-code check that cannot fail the test.
    searches: 2
  reviewer:
    verdict: confirmed
    note: 'Read hmac_error_conditions_test.c: every error-code compare is TRY_CHECK inside status_t functions, and
      test_main (lines ~328-352) calls them and discards the results. A wrong ERR_CODE cannot fail the test.'
