    where: hw/ip/hmac/dv/env
    found: The scoreboard clears exp_digest on sha_en 1->0 and compares digest reads. msg_length is predicted
      from the byte count times 8.
  - what: sequences that read digest or msg_length
    where: hw/ip/hmac/dv/env/seq_lib
    found: The smoke and base sequences call rd_digest and rd_msg_length. The save-and-restore flow writes
