      reads are checked against the register mirror.
  - path: hw/ip/hmac/dv/env/seq_lib/hmac_smoke_vseq.sv
    line_start: 256
    line_end: 264
    quote: // if disable sha, digest should be cleared
    role: supports
    note: The smoke sequence disables sha, then reads msg_length and the digest, which the scoreboard
      checks. The comment is the only explicit statement of the clear check in the sequence.
  - path: hw/ip/hmac/dv/env/hmac_scoreboard.sv
    line_start: 340
    line_end: 340
    quote: do_predict = !sha_en;
    role: context
    note: Writes to the digest and msg_length registers are predicted only while the SHA core is disabled.
      This covers the software-write path (hwext/hwqe) indirectly.
  searches:
