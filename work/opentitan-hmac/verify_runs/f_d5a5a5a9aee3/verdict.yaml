  summary: The HMAC DV env drives CMD.hash_start, hash_process, hash_stop and hash_continue in its vseqs,
    and the scoreboard predicts and checks digest, done interrupt, idle status and error codes from those
    writes. hwext and hwqe are implementation attributes of the register. They are exercised implicitly,
