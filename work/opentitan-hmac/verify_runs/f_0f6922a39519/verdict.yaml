    role: supports
    note: Spec states range through DIGEST_12 (13 words) for 384-bit digest.
  - path: hw/ip/hmac/dv/env/hmac_scoreboard.sv
    line_start: 494
    line_end: 494
    quote: ((expected_digest_size == SHA2_384) && (digest_idx < 12)) ||
    role: supports
    note: Scoreboard checks only DIGEST_0-11 for 384; DIGEST_12 is never compared.
  - path: hw/ip/hmac/dv/env/hmac_scoreboard.sv
    line_start: 491
    line_end: 492
    quote: // only check till digest_idx = 7 for SHA-2 256 and till digest_idx = 11 for SHA-2 384
    role: context
    note: The comment says the remaining digest values are irrelevant for 384, matching 12 words = 384
      bits.
  searches:
  - what: DIGEST_12 / DIGEST_11 references in hw/ip/hmac
    where: hw/ip/hmac
    found: Only register package and reg_top definitions; no text restating the 384 range as 0-11 or an
      exception for DIGEST_12.
  - what: Scoreboard digest check
    where: hmac_scoreboard.sv:470-500
