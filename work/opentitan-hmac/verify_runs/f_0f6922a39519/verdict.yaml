  summary: The README says SHA-2 384 digest is read from DIGEST_0-DIGEST_12, which is 13 words. The scoreboard
    checks only idx<12 (DIGEST_0-11). A 384-bit digest is 12 words, so the README is almost certainly
    off by one, and the test is right. The mismatch is real, but the spec is the likely wrong side.
  evidence:
