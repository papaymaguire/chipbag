    line_start: 493
    line_end: 497
    why_not: The idx<12 limit is arithmetically correct for 384 bits (12 words), so it is not a test bug.
  items: []
  new_sources: []
  resolution: 'The README range is likely an off-by-one typo. 384 bits is 12 words, so the digest occupies
    DIGEST_0-DIGEST_11, and the scoreboard''s idx<12 is correct. Fix: change README.md line 42 to DIGEST_0-DIGEST_11
    for SHA-2 384. I did not read the RTL digest output logic, so I did not confirm what DIGEST_12 holds
    for 384.'
