verdict:
  outcome: verified
  summary: Four of five items stand. The HMAC DV has no check that the FIFO fills and applies back-pressure,
    no check of a mid-operation abort or key revocation, and no hash_continue check with an invalid key.
    Item cr_a65819a54cf2 is withdrawn. The scoreboard predicts SwInvalidConfig for SHA-2 256 with a 1024-bit
    key, and the smoke sequence reaches that configuration.
  evidence:
  - path: hw/ip/hmac/dv/env/hmac_scoreboard.sv
    line_start: 173
    line_end: 177
    role: refutes
    quote: "((`gmv(ral.cfg.digest_size) == SHA2_256) &\n                          (`gmv(ral.cfg.key_length)\
      \ == Key_1024) &\n                          `gmv(ral.cfg.hmac_en));"
    note: Scoreboard flags SHA-2 256 with a 1024-bit key as invalid and predicts SwInvalidConfig on hash
      start (lines 198-199). This covers the 'rejected with error' part of cr_a65819a54cf2.
  - path: hw/ip/hmac/dv/env/seq_lib/hmac_smoke_vseq.sv
    line_start: 178
    line_end: 180
    role: context
    note: Smoke sequence handles the invalid_cfg case, so it is reachable. I did not confirm that the
      smoke sequence randomizes into it.
    quote: "if (invalid_cfg) begin\n        rd_digest(); // capture the digest CSRs before moving on to\
      \ next transaction"
  - path: hw/ip/hmac/dv/env/seq_lib/hmac_base_vseq.sv
    line_start: 807
    line_end: 807
    role: context
    note: The directed-config randomization only produces valid configs, so invalid configs come from
      other paths.
    quote: (local::hmac_en && digest_size == SHA2_256) -> (key_length != Key_1024);
  searches:
  - what: FIFO-full / back-pressure checks
    where: hw/ip/hmac/dv
    found: The scoreboard only tracks fifo_full status and detection. I found no check that a TL response
      is delayed while the FIFO is full.
  - what: SwInvalidConfig and Key_1024 handling
    where: hw/ip/hmac/dv
    found: The scoreboard predicts SwInvalidConfig on hash start. The test-vector sequence skips invalid
      vectors.
  - what: SwInvalidConfig in the chip-level keymgr sideload vseq
    where: hw/top_earlgrey/dv/env/seq_lib/chip_sw_keymgr_dpe_sideload_hmac_vseq.sv
    found: No matches
