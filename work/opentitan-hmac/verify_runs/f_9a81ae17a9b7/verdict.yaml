    line_start: 545
    line_end: 546
    quote: "When `STATUS.hmac_idle` is 1, this register may be written by software.\n            Outside\
      \ of this window, writes can cause unpredictable behavior."
    role: supports
    note: Source text; it does not say whether the write is ignored, applied or illegal.
  - path: hw/ip/hmac/doc/registers.md
    line_start: 316
    line_end: 316
    quote: When IDLE, the `DIGEST` and the `MSG_LENGTH_LOWER`/`MSG_LENGTH_UPPER` can be written to from
      SW which enables restoring context (to support context switching).
    role: context
    note: Says when writing is allowed, but nothing about writes outside idle.
  searches:
  - what: MSG_LENGTH and unpredictable in the HMAC docs
    where: hw/ip/hmac/doc/*.md
    found: Only the same sentence repeated in registers.md, plus the STATUS idle description and the context-switch
      steps in the programmer's guide. None define non-idle write behavior.
  - what: idle in theory_of_operation.md
    where: hw/ip/hmac/doc/theory_of_operation.md
    found: Nothing about MSG_LENGTH writes while not idle.
  near_misses:
