  summary: The programmer's guide gives the missing condition. Software restores DIGEST with sha_en disabled,
    and enabling sha_en locks out software writes to DIGEST. So a write takes effect only when hmac_idle
    is 1 and sha_en is 0, and it is locked out once sha_en is 1. The guide does not say whether a locked-out
    write is dropped or held. It also does not spell out the digest_size=None case, which the CSR tag
    only notes as a write-check exclusion.
