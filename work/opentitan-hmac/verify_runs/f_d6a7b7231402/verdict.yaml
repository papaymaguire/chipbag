    quote: "          if (hmac_start) begin\n            if (cfg.en_cov) cov.wr_key_during_hash_cg.sample(1);\n\
      \            update_err_intr_code(SwUpdateSecretKeyInProcess);\n            return;\n          end"
    role: refutes
    note: The scoreboard models a key write during a hash as ignored, flags an error, and leaves the stored
      key unchanged. The final digest comparison catches any change to the key.
  - path: hw/ip/hmac/dv/env/seq_lib/hmac_base_vseq.sv
