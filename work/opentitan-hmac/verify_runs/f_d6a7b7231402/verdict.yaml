  - path: hw/ip/hmac/dv/env/hmac_scoreboard.sv
    line_start: 335
    line_end: 342
    quote: '          do_predict = !sha_en;'
    role: context
    note: The scoreboard predicts that a DIGEST write is ignored when sha_en=1. I found no sequence that
