      key access mid-process' condition. It is guarded by wr_key_during_hash, which hmac_smoke_vseq constrains
      to 0.
  - path: hw/ip/hmac/dv/env/seq_lib/hmac_base_vseq.sv
    line_start: 618
    line_end: 624
    quote: '  csr_wr(.ptr(ral.cfg.sha_en), .value(1''b0));'
