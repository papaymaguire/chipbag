  specific: cr_e03695a35196
  note: 'Spells out the consequence for SHA-2 256: 1024-bit keys are not supported because the block size
    is 512 bits.'
- general: cr_e5d424432a1f
  specific: cr_a65819a54cf2
  note: Adds the condition that the key length must not exceed the block size of the configured digest,
    so the maximum key for SHA-2 256 is 512 bits.
- general: cr_200aaccb3392
  specific: cr_d468d703ae52
  note: Adds the sideloaded-key case, where the sideloaded key length takes precedence over CFG.key_length.
- general: cr_c09c6cbb904e
  specific: cr_d8c0f0f46351
  note: Specifies that the resulting order is big-endian, that it applies to multi-byte values, and that
    this holds regardless of alignment.
- general: cr_1beece72f6cd
  specific: cr_74e678770b65
  note: Restricts the Key_None start block explicitly to HMAC mode (hmac_en == 1) and adds that an error
    is signalled to SW.
- general: cr_a63f2dca52f9
  specific: cr_02af9b25cabd
  note: Adds that the final hash can be obtained at any time for any message stream, without needing complete
    blocks.
- general: cr_90e7e1a0163c
  specific: cr_98ab14b5706d
  note: Specifies the DIGEST registers only and gives the condition as STATUS.hmac_idle being 1.
- general: cr_90e7e1a0163c
  specific: cr_4857ea51c46d
  note: Specifies MSG_LENGTH_LOWER only and gives the condition as STATUS.hmac_idle being 1.
- general: cr_90e7e1a0163c
  specific: cr_ce024c03a454
  note: Specifies MSG_LENGTH_UPPER only and gives the condition as STATUS.hmac_idle being 1.
- general: cr_115bea92ad95
  specific: cr_a578aba72de1
  note: Specifies that the sideloaded-key SwInvalidConfig error cases are all signalled through INTR_STATE.hmac_err.
- general: cr_99a093214ded
  specific: cr_75181956206e
  note: Names the specific commands (hash_start or hash_continue) that trigger SwInvalidConfig when the
    key is invalid.
- general: cr_eaf5e68cde41
  specific: cr_182814207869
  note: Specifies that when SW pushes while the SHA-2 engine is disabled, SwPushMsgWhenDisallowed is the
    error reported rather than SwPushMsgWhenShaDisabled.
- general: cr_03340331c331
  specific: cr_b8debfc7325d
  note: 'Adds the trigger mechanism: software writes a 32-bit random value to WIPE_SECRET.'
- general: cr_b8debfc7325d
  specific: cr_aab3a12796d4
  note: Adds that the internal variables and secret key are reset to the value written to WIPE_SECRET.
- general: cr_5d22ea4df79b
  specific: cr_d99a06be3348
  note: 'Specifies the condition under which the read-back applies: CFG written with both CFG.sideload
    and CFG.hmac_en set.'
- general: cr_76c33b7101c2
  specific: cr_b99a398deb96
  note: Adds the explicit all-zero value as a case mapped to SHA2_None, and gives the SHA2_None encoding
    as 4'b1000.
- general: cr_b267122ce78a
  specific: cr_e87702fa2d9f
  note: Adds the CFG.digest_size encoding (4'b0001) that selects SHA-2 256.
- general: cr_c401301ca315
  specific: cr_509c8e90eca6
  note: Adds the CFG.digest_size encoding (4'b0010) that selects SHA-2 384.
- general: cr_fa699a3cbbe9
  specific: cr_e72e1aa11464
  note: Adds the CFG.digest_size encoding (4'b0100) that selects SHA-2 512.
- general: cr_d16dbd9e0ca7
  specific: cr_b3cf3229b231
  note: Specifies that the interrupt fires when the FIFO runs empty again after the SHA-2 engine resumes
    popping data.
- general: cr_a1a298bba0a5
  specific: cr_67e76dbb8ac1
  note: Names the condition that the message FIFO must have been full previously.
- general: cr_a1a298bba0a5
  specific: cr_999bc3c78db5
  note: Names the condition that software has not yet written the Process or Stop command.
- general: cr_00446a3b2658
  specific: cr_a4761665adc9
  note: req_62688e41d6a9 adds that the discarded key update attempt is also reported as an error; req_9bc3822449a1
    only states that the update is discarded.
- general: cr_447297d23029
  specific: cr_59caa8cb74a9
  note: req_c83e1f542616 adds that the blocked start is reported with the same error as the earlier case,
    and applies when the key is still invalid. req_0c2f1ed6c82e only says the start is blocked.
- general: cr_557fad41af6d
  specific: cr_0c66e5baaa3b
  note: Specifies the save operation as reading DIGEST_0..15 and MSG_LENGTH_{LOWER,UPPER}. CFG is not
    read in this step.
- general: cr_557fad41af6d
  specific: cr_5931f8aa9002
  note: Specifies the restore operation as writing CFG, DIGEST_0..15 and MSG_LENGTH_{LOWER,UPPER}.
- general: cr_f7b524c018a2
  specific: cr_60711f6b1348
  note: Specifies SHA-2 256 and that the first 16 rounds are fed by 16 32-bit words.
- general: cr_f7b524c018a2
  specific: cr_8e0a59520884
  note: Specifies SHA-2 384/512 and that the first 16 rounds are fed by 32 32-bit words from the message
    FIFO.
