  text: "cfg_timer(.hart(hart), .timer(timer), .enable(1'b1));\n            end\n\n            // update\
    \ timer and compare reg\n            // bypass updating timer and compare reg if values are close\
    \ to\n            // zero or max and may get overflow or empty after random update\n            //\
    \ max_compare_val is calculated using max random value added to\n            // compare_val without\
    \ overflowing with below randomization which is\n            // ((1 << 64)-1) - (max_step_value*300)\
    \ = 'hFFFFFFFFFFFED52B\n            // min_timer_val is calculated using max random value subtracted\
    \ from\n            // timer_val with below randomization which is (max_step_value*300) = 'h12AD4\n\
    \            if ((compare_val[hart][timer] >= 64'hFFFFFFFFFFFED52B) |\n                (timer_val[hart]\
    \ <= 64'h12AD4)) begin\n              timer_at_min_max_val = 1'b1;\n              break;\n       \
    \     end\n            else begin\n              uint64 mtime_diff;\n              `uvm_info(`gfn,\
    \ \"Updating timer and compare reg\", UVM_LOW)\n              mtime_diff = compare_val[hart][timer]\
    \ - timer_val[hart];\n              if (upd_cfg_in_end | $urandom_range(0, 1)) begin\n           \
    \     compare_val[hart][timer] += step[hart] * $urandom_range(30, 300);\n              end\n     \
    \         else begin\n                compare_val[hart][timer] -= mtime_diff / ($urandom_range(4,\
    \ 20));\n              end"
