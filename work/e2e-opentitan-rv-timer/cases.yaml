  text: "if (!enable && !cfg.under_reset) begin\n      `DV_CHECK_EQ(cfg.intr_vif.sample_pin(.idx(intr_pin_idx)),\
    \ 1'b0)\n    end\n  endtask\n\n  // task to write 1 to clear and read the interrupt status register\n\
    \  virtual task clear_intr_state(int hart = 0, int timer = 0);\n    uvm_reg         intr_state_rg;\n\
    \    uvm_reg_field   is_fld;\n    bit [TL_DW-1:0] status;\n    bit [TL_DW-1:0] wr_value;\n    `DV_CHECK_LT_FATAL(hart,\
    \ NUM_HARTS)\n    `DV_CHECK_LT_FATAL(timer, NUM_TIMERS)\n    // randomly clear the intr by writing\
    \ intr_state or mtimecmp\n    intr_state_rg = ral.get_reg_by_name($sformatf(\"intr_state%0d\", hart));\n\
    \    `DV_CHECK_NE_FATAL(intr_state_rg, null)\n\n    if ($urandom_range(0, 1)) begin\n      wr_value\
    \ = 1 << timer;\n      csr_wr(.ptr(intr_state_rg), .value(wr_value));\n    end else begin\n      wr_value\
    \ = $urandom();\n      set_compare_val(hart, timer, wr_value);\n      // wait one clk cycle then check\
    \ intr, to ensure get the sticky interrupt value\n      cfg.clk_rst_vif.wait_clks_or_rst(1);\n   \
    \ end\n    csr_rd(.ptr(intr_state_rg), .value(status));\n  endtask\n\n  // Wait the given number of\
    \ nanoseconds, exiting early on reset.\n  task wait_ns_or_reset(int unsigned delay_ns);\n    if (!delay_ns)\
    \ return;\n    fork : isolation_fork begin\n      fork\n        #(delay_ns * 1ns);\n        wait(cfg.under_reset);\n\
    \      join_any\n      disable fork;\n    end join\n  endtask"
