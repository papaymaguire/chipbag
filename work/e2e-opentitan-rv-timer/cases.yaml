    \    );\n  `uvm_object_utils(rv_timer_base_vseq)\n\n  // random delay between consecutive transactions\n\
    \  rand uint delay;\n\n  constraint delay_c {\n    delay dist {\n      0                   :/ 1,\n\
    \      [1      :100]       :/ 1,\n      [101    :10_000]    :/ 8,\n      [10_001 :1_000_000] :/ 1\n\
    \    };\n  }\n\n  // hart specific parameters\n  // These need to be NUM_HARTS size arrays; but the\
    \ current assumption is these values will be the\n  // same for all harts.\n  bit [TL_DW-1:0] max_prescale;\n\
    \  bit [TL_DW-1:0] max_step;\n\n  `uvm_object_new\n\n  function void pre_randomize();\n    super.pre_randomize();\n\
    \    max_prescale = (1 << p_sequencer.cfg.ral.cfg0.prescale.get_n_bits()) - 1;\n    max_step = (1\
    \ << p_sequencer.cfg.ral.cfg0.step.get_n_bits()) - 1;\n  endfunction\n\n  task pre_start();\n    super.pre_start();\n\
    \  endtask"
