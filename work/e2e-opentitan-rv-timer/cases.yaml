  text: "//\n  // There is a gap of spinwait_delay_ns between each read and a timeout of timeout_ns.\n\
    \  virtual task intr_state_spinwait(input int  hart              = 0,\n                          \
    \         input uint exp_data          = 0,\n                                   input uint spinwait_delay_ns\
    \ = 0,\n                                   input uint timeout_ns        = 10_000_000); // 10ms\n \
    \   uvm_reg intr_state_rg = ral.get_reg_by_name($sformatf(\"intr_state%0d\", hart));\n    bit    \
    \ seen_exp_data = 0;\n\n    if (intr_state_rg == null)\n      `uvm_fatal(get_full_name(),\n      \
    \           $sformatf(\"Cannot find intr_state register for hart %0d\", hart))\n\n    fork : isolation_fork\
    \ begin\n      fork\n        while (!seen_exp_data && !cfg.under_reset) begin\n          bit [TL_DW-1:0]\
    \ read_data;\n\n          csr_rd(.ptr(intr_state_rg), .value(read_data));\n          seen_exp_data\
    \ = (read_data == exp_data);\n          if (!seen_exp_data) wait_ns_or_reset(spinwait_delay_ns);\n\
    \        end\n        `DV_WAIT_TIMEOUT(timeout_ns, \"intr_state_spinwait\",\n                    \
    \     $sformatf(\"timeout %0s (addr=0x%0h) == 0x%0h\",\n                                   intr_state_rg.get_full_name(),\n\
    \                                   intr_state_rg.get_address(),\n                               \
    \    exp_data))\n      join_any\n\n      // If we get here then the spinwait has seen a reset or the\
    \ value it expected or we have timed\n      // out. In the former case, we should just disable the\
    \ timeout thread. In the latter case, we\n      // can safely disable the spinwait thread. It doesn't\
    \ really matter if we mess up a TL driver:\n      // we've reported an error already.\n      disable\
    \ fork;\n    end join\n  endtask\n\n  // task to read interrupt status reg for given Hart\n  virtual\
    \ task read_intr_status_reg(input  int  hart = 0,\n                                    output uint\
    \ status_val);\n    uvm_reg intr_state_rg;\n    intr_state_rg = ral.get_reg_by_name($sformatf(\"intr_state%0d\"\
    , hart));\n    `DV_CHECK_NE_FATAL(intr_state_rg, null)\n    csr_rd(.ptr(intr_state_rg), .value(status_val));\n\
    \  endtask : read_intr_status_reg\n\n  // task to read timer value reg for given Hart\n  virtual task\
    \ read_timer_val_reg(input  int    hart = 0,\n                                  output uint64 mtime_val);\n\
    \    bit [TL_DW-1:0] read_data;\n    uvm_reg timer_val_l_rg;\n    uvm_reg timer_val_u_rg;\n    timer_val_l_rg\
    \ = ral.get_reg_by_name($sformatf(\"timer_v_lower%0d\", hart));\n    timer_val_u_rg = ral.get_reg_by_name($sformatf(\"\
    timer_v_upper%0d\", hart));\n    `DV_CHECK_NE_FATAL(timer_val_l_rg, null)\n    `DV_CHECK_NE_FATAL(timer_val_u_rg,\
    \ null)\n    csr_rd(.ptr(timer_val_u_rg), .value(read_data));\n    mtime_val[63:32] = read_data;\n\
    \    csr_rd(.ptr(timer_val_l_rg), .value(read_data));\n    mtime_val[31:0] = read_data;\n  endtask\
    \ : read_timer_val_reg"
