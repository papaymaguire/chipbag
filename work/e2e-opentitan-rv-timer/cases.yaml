  text: "constraint en_timers_c {\n    (|en_timers == 1'b1);\n  }\n\n  // Enable at least 1 hart.\n  constraint\
    \ en_harts_c {\n    (|en_harts == 1'b1);\n  }\n\n  // Prescaler must be less than max prescale for\
    \ the enabled hart.\n  constraint prescale_c {\n    solve en_harts before prescale;\n    foreach (prescale[i])\
    \ {\n      if (en_harts[i]) {\n        if (cfg.smoke_test) prescale[i] == 1;\n        else       \
    \         prescale[i] inside {[0:max_prescale]};\n      } else {\n        prescale[i] == 0;\n    \
    \  }\n    }\n  }\n\n  // Step value must be less than max step for the enabled hart.\n  constraint\
    \ step_c {\n    solve en_harts before step;\n    foreach (step[i]) {\n      if (en_harts[i]) {\n \
    \       if (cfg.smoke_test) step[i] == 1;\n        else                step[i] inside {[1:max_step]};\n\
    \      } else {\n        step[i] == 0;\n      }\n    }\n  }\n\n  //"
