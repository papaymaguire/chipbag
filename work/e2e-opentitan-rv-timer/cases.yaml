  text: "virtual task status_read_for_clks(int hart = 0, int clks);\n    bit stop_reading;\n    fork\n\
    \      begin\n        cfg.clk_rst_vif.wait_clks_or_rst(clks);\n        stop_reading = 1'b1;\n    \
    \  end\n      begin\n        forever begin\n          // read will trigger check in scoreboard\n \
    \         uint rd_data;\n          read_intr_status_reg(.hart(hart), .status_val(rd_data));\n    \
    \      if (cfg.under_reset) break;\n\n          fork\n            begin : isolation_fork\n       \
    \       fork\n                begin\n                  delay = $urandom_range(1, 10000);\n       \
    \           #(delay * 1ns);\n                end\n                wait(cfg.under_reset);\n       \
    \         wait(stop_reading == 1);\n              join_any\n              disable fork;\n        \
    \    end : isolation_fork\n          join\n          if (stop_reading == 1) break;\n        end\n\
    \      end\n    join\n  endtask : status_read_for_clks\n\nendclass : rv_timer_base_vseq"
