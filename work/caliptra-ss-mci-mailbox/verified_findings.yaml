- id: f_da3b0b9c60e6
  category: 4. spec_test_mismatch
  type: test_conflict
  severity: high
  title: 'smoke_test_mcu_mbox0_write_user_lock contradicts: Writing any terminal (non-BUSY) value to status returns
    SRAM ownership to the Requester.'
  spec:
  - path: src/mci/rtl/mcu_mbox_csr.rdl
    lines:
    - 130
    - 130
    text: Writing any terminal (non-BUSY) value returns SRAM ownership to the Requester.
  test_code:
  - path: src/integration/test_suites/smoke_test_mcu_mbox_write_user_lock/smoke_test_mcu_mbox_write_user_lock.c
    lines:
    - 156
    - 156
    text: mcu_mbox_write_cmd_status(mbox_num, MCU_MBOX_CMD_COMPLETE);
    kind: stimulus
    statement: Write CMD_STATUS as Root.
  - path: src/integration/test_suites/smoke_test_mcu_mbox_write_user_lock/smoke_test_mcu_mbox_write_user_lock.c
    lines:
    - 150
    - 150
    text: mcu_mbox_read_sram_owner(mbox_num) != MCU_MBOX_SRAM_OWNER_TARGET
    kind: check
    statement: SRAM owner becomes Target after the grant and stays Target after the CMD_STATUS write.
    fails_test: 'yes'
  verify:
    summary: 'The RDL says any terminal CMD_STATUS write returns SRAM ownership to the Requester, with no exception.
      The test writes CMD_COMPLETE as Root while TARGET_USER_VALID=1 and expects the owner to stay Target. The RTL
      agrees with the test: Target ownership has priority over a non-busy cmd_status. The spec text is therefore
      incomplete or wrong, not the test.'
    resolution: The RTL and test agree, so the spec text is likely what needs changing. Amend the CMD_STATUS description
      to say that a terminal write returns ownership to the Requester only when no Target grant is active (TARGET_USER_VALID=0).
      While the Target holds the SRAM, ownership stays with the Target.
    evidence:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      lines:
      - 130
      - 130
      role: supports
      quote: Writing any terminal (non-BUSY) value returns SRAM ownership to the Requester.
      note: Unconditional spec statement.
    - path: src/integration/test_suites/smoke_test_mcu_mbox_write_user_lock/smoke_test_mcu_mbox_write_user_lock.c
      lines:
      - 156
      - 163
      role: supports
      quote: mcu_mbox_write_cmd_status(mbox_num, MCU_MBOX_CMD_COMPLETE);
      note: Root writes a terminal status; the test then expects the owner to stay Target ("stole ownership from
        Target").
    - path: src/mci/rtl/mcu_mbox.sv
      lines:
      - 227
      - 233
      role: context
      quote: if (execute_set &  mbox_target_user_valid) begin
      note: RTL gives Target priority while target_user_valid is set. The Requester gets the SRAM only when !execute_set,
        or when the target is not valid and cmd_status is not busy.
    searches: 2
  reviewer:
    verdict: confirmed
    note: Read the RDL (mcu_mbox_csr.rdl:130), the spec flowchart and event table (CaliptraSSHardwareSpecification.md
      ~1370-1399) and the RTL (mcu_mbox.sv:227). The RTL and flowchart give the Target priority when TARGET_USER_VALID=1,
      as the test expects. The RDL sentence and the spec's own event table ('MCU writes non-BUSY CMD_STATUS -> Lock
      holder') are unconditional. Real; the spec is the side to fix, which makes it effectively a spec contradiction
      (category 2). Verify labelled it differently across 3 runs (verified, withdrawn, verified).
- id: f_0dbe800a9b3a
  category: 3. test_inconsistency
  type: check_cannot_fail
  severity: medium
  title: 'smoke_test_mcu_mbox_target_user: k24 is meant to verify that MBOX USER does not take the written value
    0xDEADBEEF. It compares agains'
  what: k24 is meant to verify that MBOX USER does not take the written value 0xDEADBEEF. It compares against 0xDEADBEEF
    masked with the CMD_STATUS STATUS mask, which cuts the value down to a few low bits. A MBOX USER that actually
    became 0xDEADBEEF would not equal the masked value, so the check would still pass. The check does not detect
    the corruption it claims to detect.
  test_code:
  - path: src/integration/test_suites/smoke_test_mcu_mbox_target_user/cptra_smoke_test_mcu_mbox_target_user.c
    lines:
    - 188
    - 188
    text: if (mbox_rd_data == (0xDEADBEEF & MCU_MBOX0_CSR_MBOX_CMD_STATUS_STATUS_MASK))
    kind: check
    statement: MBOX USER must not take the written value. The check uses the CMD_STATUS mask.
    fails_test: 'yes'
  verify:
    summary: The k24 check compares MBOX USER to 0xDEADBEEF & CMD_STATUS.STATUS mask, a few low bits. If USER became
      0xDEADBEEF, it would not equal the masked value, so the check would not fail. It can't detect the corruption
      it names.
    resolution: null
    evidence:
    - path: src/integration/test_suites/smoke_test_mcu_mbox_target_user/cptra_smoke_test_mcu_mbox_target_user.c
      lines:
      - 188
      - 188
      role: supports
      quote: if (mbox_rd_data == (0xDEADBEEF & MCU_MBOX0_CSR_MBOX_CMD_STATUS_STATUS_MASK)) {
      note: USER read-back compared to the masked value, not the full written value.
    searches: 2
  reviewer:
    verdict: confirmed
    note: Read cptra_smoke_test_mcu_mbox_target_user.c:188. MBOX USER is compared with 0xDEADBEEF & CMD_STATUS_STATUS_MASK
      (0xF), so the check cannot detect USER taking 0xDEADBEEF. Copy-paste bug.
- id: f_5b16f79c5107
  category: 3. test_inconsistency
  type: plan_vs_test
  severity: medium
  title: 'smoke_test_mcu_mbox_usr_lock_out_zero: Plan item p3 says the test checks that MBOX SRAM is cleared on
    lock release up to the max DLEN. The '
  what: Plan item p3 says the test checks that MBOX SRAM is cleared on lock release up to the max DLEN. The test
    writes DLEN=250000 and SRAM data, but never reads SRAM as the lock owner and never checks zeroization. Its SRAM
    reads (k9, k11) are made without the lock and return 0 regardless of whether SRAM was cleared, so they say nothing
    about clearing up to DLEN.
  test_prose:
  - path: docs/Caliptra_Gen2_SS_TestPlan.xlsx
    text: SRAM is cleared on each lock release up to the max DLEN set during lock.
    kind: plan
  - path: docs/Caliptra_Gen2_SS_TestPlan.xlsx
    rows:
    - 107
    - 107
    sheet: Subsystem Test Plan
    text: MBOX SRAM is cleared every time lock is released up to the MAX DLEN set durring lock
    kind: plan
    statement: MBOX SRAM is cleared up to the MAX DLEN set during lock
  test_code:
  - path: src/integration/test_suites/smoke_test_mcu_mbox_usr_lock_out_zero/smoke_test_mcu_mbox_usr_lock_out_zero.c
    lines:
    - 78
    - 78
    text: lsu_write_32(SOC_MCI_TOP_MCU_MBOX0_CSR_MBOX_DLEN + MCU_MBOX_NUM_STRIDE * mbox_num, 250000);
    kind: stimulus
    statement: In the helper, write a large DLEN of 250000.
  - path: src/integration/test_suites/smoke_test_mcu_mbox_usr_lock_out_zero/cptra_smoke_test_mcu_mbox_usr_lock_out.c
    lines:
    - 162
    - 162
    text: if (read_payload[0] != mcu_expected_data[ii]) {
    kind: check
    statement: SRAM data read must match the expected all-zero data.
    fails_test: 'yes'
  - path: src/integration/test_suites/smoke_test_mcu_mbox_usr_lock_out_zero/cptra_smoke_test_mcu_mbox_usr_lock_out.c
    lines:
    - 190
    - 190
    text: if (read_payload[0] != 0) {
    kind: check
    statement: After the attempted SRAM write, SRAM dword 5 must still read 0.
    fails_test: 'yes'
  verify:
    summary: The test does not check SRAM zeroization up to the max DLEN. MCU writes DLEN=250000 and 16 SRAM dwords,
      then Caliptra checks the lock-out. Caliptra's SRAM reads run without the lock and are expected to return 0
      whether or not SRAM was cleared. The first read loop never runs, because DLEN has just been read back as 0
      and the loop bound is data_length/4.
    resolution: null
    evidence:
    - path: src/integration/test_suites/smoke_test_mcu_mbox_usr_lock_out_zero/cptra_smoke_test_mcu_mbox_usr_lock_out.c
      lines:
      - 157
      - 162
      role: supports
      quote: for (uint8_t ii = 0; ii < data_length/4; ii++) {
      note: data_length was just checked to equal 0, so this loop executes zero iterations. The expected data is
        all zeros because the reader has no lock.
    - path: src/integration/test_suites/smoke_test_mcu_mbox_usr_lock_out_zero/cptra_smoke_test_mcu_mbox_usr_lock_out.c
      lines:
      - 188
      - 190
      role: supports
      quote: if (read_payload[0] != 0) {
      note: This reads SRAM without holding the lock, so a nonzero value is not possible whether or not SRAM was
        cleared. It does not test zeroization.
    - path: src/integration/test_suites/smoke_test_mcu_mbox_usr_lock_out_zero/smoke_test_mcu_mbox_usr_lock_out_zero.c
      lines:
      - 76
      - 78
      role: context
      quote: lsu_write_32(SOC_MCI_TOP_MCU_MBOX0_CSR_MBOX_DLEN + MCU_MBOX_NUM_STRIDE * mbox_num, 250000);
      note: The large DLEN is written only to make zeroization take a while. The MCU side never reads SRAM back
        after releasing the lock.
    searches: 1
  reviewer:
    verdict: plausible
    note: Confirmed the loop at cptra_smoke_test_mcu_mbox_usr_lock_out.c:157 runs to DLEN/4 after DLEN is checked
      against the expected value. I did not trace whether the expected DLEN is 0 (the agent's claim that the loop
      never runs).
- id: f_6f160b38b849
  category: 3. test_inconsistency
  type: check_cannot_fail
  severity: medium
  title: 'mci_error_non_fatal_warm_rst_check: The message calls this an ''SVA ERROR'' and says HW_ERROR_NON_FATAL
    is expected to remain unchanged on'
  what: The message calls this an 'SVA ERROR' and says HW_ERROR_NON_FATAL is expected to remain unchanged on warm
    reset. The assertion's failure action only prints that message, so a violation does not fail the test. The stability
    requirement is therefore reported but never enforced.
  test_prose:
  - path: src/integration/asserts/caliptra_ss_top_sva.sv
    lines:
    - 245
    - 245
    text: 'SVA ERROR: MCI HW ERROR NON FATAL is expected to remain unchanged on warm reset'
    kind: intent
  test_code:
  - path: src/integration/asserts/caliptra_ss_top_sva.sv
    lines:
    - 244
    - 244
    text: ((~`CPTRA_SS_TOP_PATH.cptra_ss_rst_b_i & `CPTRA_SS_TOP_PATH.cptra_ss_pwrgood_i) |-> ($stable(`MCI_REG_TOP_PATH.mci_reg_hwif_out.HW_ERROR_NON_FATAL)[*5]))
    kind: check
    statement: When cptra_ss_rst_b_i is low and power good is high, HW_ERROR_NON_FATAL is stable for 5 cycles. Disabled
      when power good is low. A violation only prints a message.
    fails_test: 'no'
  verify:
    summary: 'The assertion''s else branch is only `$display("SVA ERROR: ...")`. It does not call `$error` or `$fatal`,
      and it sets no failure flag. Nothing in the repository that I found scans logs for "SVA ERROR" to fail a test.
      A violation is therefore printed but does not fail the test. I did not check whether the simulator''s own
      assertion-failure count feeds into pass/fail.'
    resolution: Add `$error(...)` (or a testbench error-counter increment) to the else action. Alternatively, have
      the regression log scanner treat "SVA ERROR" as a failure.
    evidence:
    - path: src/integration/asserts/caliptra_ss_top_sva.sv
      lines:
      - 245
      - 245
      role: supports
      quote: '  ) else $display("SVA ERROR: MCI HW ERROR NON FATAL is expected to remain unchanged on warm reset");'
      note: The failure action only prints a message, so the check can't fail the test.
    searches: 2
  reviewer:
    verdict: confirmed
    note: 'Read in source: the assertion''s only failure action is $display. No script in the repo scans logs for
      ''SVA ERROR''. Caveat: the message contains ''ERROR'', and an external regression flow may fail on it; ask
      the team before filing.'
