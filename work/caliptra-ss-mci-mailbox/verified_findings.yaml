- id: f_1ab17f54aa12
  category: 1. spec_ambiguity
  type: missing_detail
  severity: medium
  title: On a double bit ECC error while reading the mailbox, invalid data is returned.
  what: The value or form of the 'invalid data' returned is not specified.
  question_for_architect: 'On a double-bit ECC error read of MCU mailbox SRAM, what is the read data: raw uncorrected
    SRAM contents, zero, or undefined/don''t-care? Is the AXI read response OKAY or an error (SLVERR)?'
  test_impact: On a DB ECC read, one engineer would compare the read data against the raw uncorrected SRAM word.
    Another would expect zero, or skip the data compare. The spec also does not say whether an AXI error response
    accompanies the read, so engineers would disagree on the expected bus response (OKAY vs SLVERR). Existing tests
    skip both checks.
