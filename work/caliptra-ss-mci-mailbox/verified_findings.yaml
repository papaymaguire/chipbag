- id: f_4a7ed506cf39
  category: 1. spec_ambiguity
  type: vague
  severity: high
  title: The associated MBOX0_VALID_AXI_USER register is valid only once locked by this bit.
  what: It is not stated what 'valid' means observably for the associated register before it is locked.
  question_for_architect: Before MBOX0_AXI_USER_LOCK[i] is set, is MBOX0_VALID_AXI_USER[i] ignored by the AXI_USER
    filter for mailbox access, so that requests matching only that entry are rejected? Once locked, is it used for
    matching? Is the change effective on the very next transaction after the lock write?
  test_impact: One engineer would expect mailbox requests from an AXI_USER that matches an unlocked VALID_AXI_USER
    entry to be rejected. Another would expect them to be accepted, with locking only freezing the value. This changes
    the expected accept/reject outcome in the filtering tests that run before the lock is set. It also leaves unclear
    whether an unlocked entry with its reset value of 0 matches AXI_USER 0.
  spec:
  - path: src/mci/rtl/mci_reg.rdl
    lines: &id003
    - 831
    - 831
    text: Associated MBOX0_VALID_AXI_USER register is only valid once locked by this bit.
  verify:
    summary: No other spec text says what an unlocked MBOX*_VALID_AXI_USER entry does to the AXI_USER filter. The
      other documents only say the registers must be programmed and locked before the mailbox is used. They don't
      say whether an unlocked entry is ignored or still matches, whether a reset value of 0 matches AXI_USER 0,
      or when a lock takes effect.
    resolution: Add to the RDL description and the hardware spec that an entry takes part in AXI_USER matching only
      when its LOCK bit is 1. State that an unlocked entry never matches, including a reset value of 0 matching
      AXI_USER 0. State that the lock takes effect on the next transaction after the lock write.
    evidence:
    - path: src/mci/rtl/mci_reg.rdl
      lines:
      - 831
      - 831
      role: supports
      quote: Associated MBOX0_VALID_AXI_USER register is only valid once locked by this bit.
      note: The only register-level statement. It doesn't define what 'valid' means observably.
    - path: docs/CaliptraSSHardwareSpecification.md
      lines:
      - 1297
      - 1297
      role: context
      quote: There are 5 trusted AXI Users determined at build time via parameters or via MCI lockable registers.
      note: The hardware spec describes trusted users generally. It says nothing about unlocked entries.
    - path: docs/CaliptraSSIntegrationSpecification.md
      lines:
      - 2293
      - 2293
      role: context
      quote: 'trusted users will need to configured with the following lockable MCI registers before MBOX can be
        used by SOC agents:'
      note: This gives a usage order (configure and lock first) but no accept/reject behaviour before the lock.
    searches: 2
  reviewer:
    verdict: plausible
    note: The question is real and test-relevant. I did not re-search the whole spec myself; the verify agent's
      search record says no other spec text answers it.
