- id: f_96ff60e51af1
  category: 3. test_inconsistency
  type: message_vs_condition
  severity: medium
  title: 'smoke_test_mcu_mbox_valid_user: k18 is meant to show that a write to the USER register is ignored, but
    it compares the read-back val'
  what: k18 is meant to show that a write to the USER register is ignored, but it compares the read-back value with
    (0xDEADBEEF & MCU_MBOX0_CSR_MBOX_CMD_STATUS_STATUS_MASK). That is the CMD_STATUS field mask, copied from the
    CMD_STATUS check. If the 32-bit USER register actually took 0xDEADBEEF, the value would not equal the masked
    constant, so the check would pass. The check therefore cannot detect the write it claims to detect.
  test_code:
  - path: src/integration/test_suites/smoke_test_mcu_mbox_valid_user/cptra_smoke_test_mcu_mbox_valid_user.c
    lines:
    - 359
    - 359
    text: if (read_payload[0] == (0xDEADBEEF & MCU_MBOX0_CSR_MBOX_CMD_STATUS_STATUS_MASK)) {
    kind: check
    statement: MBOX USER must not change to the written value.
    fails_test: 'yes'
  verify:
    summary: The USER check compares the read-back against 0xDEADBEEF masked with the CMD_STATUS STATUS mask, not
      the full 0xDEADBEEF. A 32-bit USER register that accepted the write would read 0xDEADBEEF, which differs from
      the masked constant, so the check would not fire. The CMD check at line 337 compares against the unmasked
      value. Line 359 looks copied from the CMD_STATUS check at line 348.
    resolution: Compare against 0xDEADBEEF unmasked at line 359. Better, read USER before the write and fail if
      the read-back changed.
    evidence:
    - path: src/integration/test_suites/smoke_test_mcu_mbox_valid_user/cptra_smoke_test_mcu_mbox_valid_user.c
      lines:
      - 359
      - 360
      role: supports
      quote: "    if (read_payload[0] == (0xDEADBEEF & MCU_MBOX0_CSR_MBOX_CMD_STATUS_STATUS_MASK)) {\n        VPRINTF(FATAL,\
        \ \"Mbox%x MBOX USER was changed\\n\", mbox_num);"
      note: USER check uses the CMD_STATUS mask rather than the full written value.
    searches: 1
  reviewer:
    verdict: confirmed
    note: 'Read cptra_smoke_test_mcu_mbox_valid_user.c:359. The same masked-compare copy-paste bug as in target_user:
      the USER check uses the CMD_STATUS mask.'
