  severity: medium
  title: Hardware resets TARGET_STATUS to BUSY on each Target handoff.
  what: The target handoff event is not defined, and BUSY is not an enum name (the enum uses CMD_BUSY).
  question_for_architect: Which event exactly triggers the hwclr of mbox_target_status? Is it Root writing TARGET_USER_VALID=1,
    Root writing TARGET_USER, or another event? Is the clear to CMD_BUSY (4'd0) visible on the cycle after that
    event?
  test_impact: Tests that check STATUS returns to CMD_BUSY need to know which event triggers the hardware clear.
    Candidates include Root writing TARGET_USER, Root setting TARGET_USER_VALID, or a new lock acquisition. Engineers
    could check for the 4'd0 value at different times or after different stimuli. A stale-terminal-value test could
    pass in one reading and fail in another. 'BUSY' clearly means CMD_BUSY (4'd0), since it is the only busy encoding.
  spec:
  - path: src/mci/rtl/mcu_mbox_csr.rdl
    lines: &id007
    - 106
    - 106
    text: Reset to BUSY by hardware on each target handoff.
  - path: docs/CaliptraSSHardwareSpecification.md
    lines: &id008
    - 1434
    - 1434
    text: Hardware resets `TARGET_STATUS` to BUSY on each Target handoff.
  verify:
    summary: No other spec text says which event hardware-clears TARGET_STATUS to BUSY. The spec describes the terminal-write
      clear only for TARGET_USER and TARGET_USER_VALID. The "Target handoff" wording for TARGET_STATUS appears only
      in the two quoted lines.
    resolution: 'Spec fix: state the exact trigger for the TARGET_STATUS clear (for example, the Root write of TARGET_USER_VALID=1)
      and when the clear takes effect. Use the enum name CMD_BUSY (or "BUSY (0)") consistently. I did not check
      the RTL for the actual behaviour.'
    evidence:
    - path: docs/CaliptraSSHardwareSpecification.md
      lines:
      - 1434
      - 1434
      role: supports
      quote: Hardware resets `TARGET_STATUS` to BUSY on each Target handoff.
      note: The only statement about the TARGET_STATUS reset. It does not say which event triggers it or when the
        clear becomes visible.
    - path: docs/CaliptraSSHardwareSpecification.md
      lines:
      - 1350
      - 1351
      role: context
      quote: 'publish a terminal `TARGET_STATUS` during normal operation. Hardware clears

        `TARGET_USER` and `TARGET_USER_VALID` on that write'
      note: Defines the terminal-write clear for the user registers only. TARGET_STATUS is not mentioned.
    - path: docs/CaliptraSSHardwareSpecification.md
      lines:
      - 1398
      - 1398
      role: context
      quote: '| Root writes `TARGET_USER_VALID=1` while `EXECUTE=1` | The agent named by `TARGET_USER` |'
