- id: f_46eb300913e4
  category: 1. spec_ambiguity
  type: unclear_referent
  severity: medium
  title: Each bit corresponds to locking the associated MBO0X_VALID_AXI_USER register.
  what: The register name MBO0X_VALID_AXI_USER appears to be a typo, and 'each bit' does not match the single-bit
    LOCK field.
  question_for_architect: Does MBOX1_AXI_USER_LOCK[i] lock (make read-only) and validate MBOX1_VALID_AXI_USER[i]
    for the same index i, with no effect on any MBOX0_VALID_AXI_USER register?
  test_impact: The text says 'MBO0X'/'MBOX0' inside the MBOX1 lock register, and 'each bit' does not fit a 1-bit
    field in a 5-entry array. A lock-enforcement test must pick which VALID_AXI_USER entry should become read-only,
    and be honored for filtering, after LOCK[i] is set. One engineer would check MBOX1_VALID_AXI_USER[i]. Another,
    following the text literally, would check MBOX0_VALID_AXI_USER[i]. They would also need to confirm that other
    indices stay writable. Expected write-ignore and valid-user filtering results differ.
  spec:
  - path: src/mci/rtl/mci_reg.rdl
    lines:
    - 847
    - 847
    text: Each bit corresponds to locking the associated MBO0X_VALID_AXI_USER register.
  verify:
    summary: No other spec text settles the question. The MBOX1 lock description is a copy of the MBOX0 one and
      still names MBOX0_VALID_AXI_USER. The integration spec only refers to `MBOX*_VALID_AXI_USER` and `MBOX*_AXI_USER_LOCK`
      generically. Nothing states that index i of one lock register maps to index i of the matching VALID_AXI_USER
      array.
    resolution: The register array structure (5 entries each) and the integration-spec wording suggest MBOX1_AXI_USER_LOCK[i]
      locks MBOX1_VALID_AXI_USER[i] only. To resolve, change the MBOX1 description to 'Each LOCK register locks
      the MBOX1_VALID_AXI_USER register with the same index' and fix the MBOX0 spelling. I did not check the RTL
      for what it actually does.
    evidence:
    - path: src/mci/rtl/mci_reg.rdl
      lines:
      - 847
      - 848
      role: supports
      quote: "[br]Each bit corresponds to locking the associated MBO0X_VALID_AXI_USER register.\n              \
        \   [br]Associated MBOX0_VALID_AXI_USER register is only valid once locked by this bit."
      note: The MBOX1 lock description names MBO0X/MBOX0 registers, which is a copy-paste error, and says 'each
        bit' for a 1-bit field.
    - path: src/mci/rtl/mci_reg.rdl
      lines:
      - 839
      - 840
      role: context
      quote: "Valid AXI USER attributes for requests from SoC AXI Interface. Only valid once LOCK is set.\n    \
        \             [br]Read-Only once locked by AXI_USER_LOCK."
      note: The MBOX1_VALID_AXI_USER description does not give the index mapping to the lock register.
    - path: docs/CaliptraSSIntegrationSpecification.md
      lines:
      - 2295
      - 2296
      role: context
      quote: "   - `MBOX*_VALID_AXI_USER`\n   - `MBOX*_AXI_USER_LOCK`"
      note: The only other mention uses a wildcard and does not give the per-index pairing.
    searches: 2
  reviewer:
    verdict: confirmed
    note: mci_reg.rdl:830 and :847 both say 'MBO0X_VALID_AXI_USER'. The MBOX1 lock description is a copy of MBOX0's,
      with a typo.
- id: f_4ed0758b1ae5
  category: 1. spec_ambiguity
  type: vague
  severity: medium
  title: CMD_STATUS is unused by MCU when MCU holds the lock.
  what: '''Unused'' does not say whether MCU writes are ignored, blocked, or whether reads return a defined value.'
  question_for_architect: When MCU holds the lock, are MCU writes to CMD_STATUS accepted (stored and readable back),
    ignored, or blocked? If accepted, does the value have any effect on mailbox behavior?
  test_impact: One engineer would write a test expecting an MCU write to CMD_STATUS to be blocked (or reads to be
    fixed) while MCU holds the lock. Another would treat 'Unused' as 'no protocol meaning' and expect the write
    to take effect. The existing smoke_test_mcu_mbox_strb_wr_csr checks that a CMD_STATUS write does take effect
    while MCU holds the lock. That shows the two readings already lead to different pass criteria.
  spec:
  - path: docs/CaliptraSSHardwareSpecification.md
    lines: &id005
    - 1534
    - 1534
    text: '`CMD_STATUS` | Unused'
  verify:
    summary: No other spec text says what an MCU write to CMD_STATUS does when MCU holds the lock. Line 1436 says
      CMD_STATUS is "not used" when MCU is the Requester, but it doesn't say whether writes are accepted, ignored
      or blocked, or what a read returns. The table at line 1534 gives only "Unused", where the other cells give
      RW or RO. I did not open the RTL or the smoke test.
    resolution: I did not check the RTL or the smoke test. The spec should say explicitly whether an MCU write to
      CMD_STATUS is accepted and readable, is ignored, or is blocked while MCU holds the lock. It should also say
      that the value has no effect on mailbox or SRAM-ownership behaviour in that case. The table cell should use
      an access type such as "RW, no functional effect" instead of "Unused".
    evidence:
    - path: docs/CaliptraSSHardwareSpecification.md
      lines:
      - 1534
      - 1534
      role: supports
      quote: '| `CMD_STATUS` | Unused | RW |'
      note: The cell reads "Unused", while the other cells give an access type (RW or RO).
    - path: docs/CaliptraSSHardwareSpecification.md
      lines:
      - 1436
      - 1437
      role: supports
      quote: '`CMD_STATUS` is not used when MCU is the Requester, because there is no'
      note: Restates that the register is not used, but gives no access behaviour for writes or reads.
    searches: 2
  reviewer:
    verdict: plausible
    note: The question is real and test-relevant. I did not re-search the whole spec myself; the verify agent's
      search record says no other spec text answers it.
