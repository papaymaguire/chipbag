  text: "void cptra_mcu_mbox_target_write_sram_and_csrs(uint32_t mbox_num, uint32_t mbox_dlen, uint32_t\
    \ *clptra_write_data, bool can_write) {\n    bool error;\n    uint32_t data_length;\n    const uint32_t\
    \ mbox_cmd = 0xFADECAFE;\n    const uint32_t mbox_user = cptra_axi_dword_read(SOC_MCI_TOP_MCI_REG_MCU_LSU_AXI_USER);\n\
    \    uint32_t mbox_wr_data;\n    uint32_t mbox_rd_data;\n    uint32_t expected_data;\n\n    // Attempting\
    \ SRAM and CSRs write\n    // Check to see that writes occurred (if writing allowed) or are silently\
    \ dropped and reads return 0\n    VPRINTF(LOW, \"CALIPTRA: Attempting Mbox%x SRAM writes\\n\", mbox_num);\n\
    \    for (uint8_t ii = 0; ii < mbox_dlen/4; ii++) {\n        if (can_write) {\n            mbox_wr_data\
    \ = clptra_write_data[ii];\n        } else {\n            mbox_wr_data = 0xDEADBEEF;\n        }\n\n\
    \        cptra_mcu_mbox_write_dword_sram(mbox_num, ii, mbox_wr_data);\n\n        mbox_rd_data = cptra_mcu_mbox_read_dword_sram(mbox_num,\
    \ ii);\n\n        error = (can_write) ? (mbox_rd_data != clptra_write_data[ii]) : (mbox_rd_data !=\
    \ 0);\n        expected_data = (can_write) ? clptra_write_data[ii] : 0;\n        if (error) {\n  \
    \          VPRINTF(FATAL, \"Mbox%x SRAM data from MCU is not expected value - dword: %x expected_data:\
    \ %x\\n\",mbox_num, ii, expected_data);\n            SEND_STDOUT_CTRL(0x1);\n            while(1);\n\
    \        }\n    }\n\n    // As SRAM owner the Target could clear EXECUTE, which would release the\
    \ mailbox, so only try it as a non-owner.\n    if (!can_write) {\n        VPRINTF(LOW, \"CALIPTRA:\
    \ Attempting MBOX%x Execute write\\n\", mbox_num);\n        mbox_wr_data = 0;\n        cptra_mcu_mbox_write_execute(mbox_num,\
