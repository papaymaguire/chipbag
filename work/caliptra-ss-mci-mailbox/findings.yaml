  detail:
    note: The description says the lock is set to root_user (MCU) on reset release, but the derived reset
      value property of the lock field is 0 (not locked).
    question: Is the lock field 0 or 1 after reset release? If it is set to the root_user, which register
      or signal records the owner, and does the reset value 0 hold only while reset is asserted?
  origin: normalize
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 6
    cost_usd: 0.06169070000000001
    submissions: 1
    rejections: []
    error: null
    summary: The two statements are consistent. The RDL reset value of 0 is the value during reset. After
      reset release, hardware sets the lock through hwset (rst_mbox_lock_req) and loads the root AXI user
      into mbox_user.
    resolution: 'The RTL matches both statements. The field resets to 0, then hardware sets it right after
      reset release and records root_user in MBOX_USER. The RDL description could say this explicitly,
      for example: "resets to 0; hardware sets it on reset release."'
    evidence:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      line_start: 52
      line_end: 53
      quote: On reset release lock is set to root_user (MCU) to allow SRAM clearing
      role: context
      note: The RDL field has reset value 0 and hwset=true, so hardware can set it after reset.
    - path: src/mci/rtl/mcu_mbox.sv
