- id: f_4ca1667d89be
  category: spec_contradiction
  category_no: 2
  type: reclassified
  title: Integration spec MCU-to-target flow orders EXECUTE and TARGET_USER_VALID opposite to the HW spec
  subject: *id215
  detail:
    explanation: The Integration Specification diagram writes TARGET_USER_VALID=1 and then EXECUTE=1.
      The Hardware Specification ownership table says EXECUTE=1 with TARGET_USER_VALID=0 leaves Root as
      owner. It also says Root writing TARGET_USER_VALID=1 while EXECUTE=1 hands ownership to the target.
      The test follows the Hardware Specification.
    resolution: The test is right. Fix the Integration Specification sequence diagram to put `Write EXECUTE=1`
      before `Write TARGET_USER_VALID=1`, or state that either order is allowed, so that it matches the
      Hardware Specification.
  evidence: &id219
  - *id216
