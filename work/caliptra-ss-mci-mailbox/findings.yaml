  category: spec_ambiguity
  category_no: 1
  type: unclear_referent
  title: Only valid once LOCK is set.
  subject:
    section: sec_2a31ea86da1e
    quote: 5437539636e4
  section: src/mci/rtl/mci_reg.rdl > mci_reg > MBOX1_VALID_AXI_USER
  spec:
