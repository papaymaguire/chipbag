- id: f_7dbfd12edb46
  category: spec_ambiguity
  category_no: 1
  type: reclassified
  title: 'Post-MCI-reset SRAM_OWNER encoding: Root (2) or lock holder (1)?'
  subject: *id209
  detail:
    explanation: The spec's event table says the owner after MCI reset is "Root, as the reset lock holder".
      The SRAM_OWNER encoding table separates 1 (Requester/lock holder) from 2 (Root). The test expects
      1. A spec change that states the exact SRAM_OWNER value after reset would resolve it.
    resolution: Check the RTL's reset value for SRAM_OWNER. Then change the spec to state the encoding
      after reset explicitly. If the RTL resets to 1, say "lock holder (encoding 1)". If it resets to
      2, fix the test.
  evidence: &id213
  - *id210
  - *id211
  - *id212
  origin: verify (reclassified from f_d5ac44d7056b)
  severity: high
  status: verified
