- id: f_d6a990a3dea8
  category: spec_contradiction
  category_no: 2
  type: within_section
  title: The description says AXI access is RW1-S (write-1-to-set), while the software access property
    is rw with a write-enable-
  subject:
    section: sec_700505a8ef8d
    quote: cefd4e61377d
  spec:
  - path: src/mci/rtl/mci_reg.rdl
    lines:
    - 832
    - 832
    text: 'AXI Access:      RW1-S'
  detail:
    note: The description says AXI access is RW1-S (write-1-to-set), while the software access property
      is rw with a write-enable-low (swwel) control.
    question: Is the LOCK field plain read/write controlled by swwel, or write-1-to-set as RW1-S implies?
  origin: normalize
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 4
    cost_usd: 0.0361468
    submissions: 1
    rejections: []
    error: null
    summary: The two statements are consistent. LOCK is a 1-bit field with sw=rw and swwel. The RTL wires
      swwel to the field's own value, so once LOCK is 1 it is read-only. While LOCK is 0, writing 0 changes
      nothing and writing 1 sets it. That is write-1-to-set behaviour, which is what "RW1-S" describes.
    resolution: No change is needed. The RDL 'sw=rw; swwel' with swwel tied to the field's own value is
      how this design implements RW1-S for a sticky lock bit. A comment in the RDL noting this would remove
      the apparent mismatch.
    evidence:
    - path: src/mci/rtl/mci_reg.rdl
      line_start: 832
      line_end: 834
      quote: '[br]AXI Access:      RW1-S'
      role: refutes
      note: The description says RW1-S and 'Read-Only once locked'. The field is sw=rw with swwel, which
        gives the same behaviour for a 1-bit lock.
    - path: src/mci/rtl/mci_reg_top.sv
      line_start: 648
      line_end: 648
      quote: mci_reg_hwif_in.MBOX0_AXI_USER_LOCK[i].LOCK.swwel = mci_reg_hwif_out.MBOX0_AXI_USER_LOCK[i].LOCK.value;
      role: context
      note: swwel is the field's own value, so writes are blocked once LOCK is set. The bit can only go
        0 to 1, which is write-1-to-set.
    searches:
    - what: swwel wiring for the AXI_USER_LOCK LOCK fields
      where: src/mci/rtl
      found: swwel is driven by the LOCK value itself in mci_reg_top.sv, and mci_reg.sv blocks software
        writes when swwel is high
    near_misses: []
    new_sources: []
    reclassify: null
- id: f_d891c4a7bb4a
  category: spec_contradiction
  category_no: 2
  type: within_section
  title: 'The 2MB maximum and configurability by integration team may conflict with the fixed mementries
    (524288 x 32 bits = 2MB) '
  subject:
    section: sec_0daef16f7de0
    quote: 3399d01b7466
  spec:
  - path: src/mci/rtl/mcu_mbox_csr.rdl
    lines:
    - 39
    - 39
    text: The maximum size is 2MB, but is configurable by the integration team.
  detail:
    note: The 2MB maximum and configurability by integration team may conflict with the fixed mementries
      (524288 x 32 bits = 2MB) property, which does not show a configurable size.
    question: Is the SRAM size fixed at 2MB by this definition, and if configurable, what parameter sets
      it and what is the allowed range?
  origin: normalize
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.051350599999999996
    submissions: 1
    rejections: []
    error: null
    summary: The two statements are consistent. mementries=524288 with memwidth=32 declares the maximum
      address-space window (2MB). The actual SRAM size is set by an integration parameter, so there is
      no contradiction.
    resolution: The RDL declares the maximum 2MB window. The RTL parameter MCU_MBOX_SRAM_SIZE_KB sets
      the actual size, and its default is 512KB. The description could say that mementries is the maximum
      and that the size is set by MCU_MBOX_SRAM_SIZE_KB. That change is optional.
    evidence:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      line_start: 39
      line_end: 39
      quote: The maximum size is 2MB, but is configurable by the integration team.
      role: refutes
      note: The RDL mem is declared at the maximum size (524288 x 32 bits = 2MB). The text says 2MB is
        the maximum, not the fixed size.
    - path: src/mci/rtl/mcu_mbox.sv
      line_start: 40
      line_end: 40
      quote: parameter  MCU_MBOX_SRAM_SIZE_KB = 512
      role: context
      note: The RTL has a configurable size parameter, defaulting to 512KB, which is below the 2MB maximum.
    - path: src/mci/rtl/mci_reg.rdl
      line_start: 159
      line_end: 159
      quote: field {desc = "MCU MBOX0 SRAM SIZE KB. If 0 there is no mailbox"; hw=w; sw=r;} MCU_MBOX0_SRAM_SIZE[12];
      role: context
      note: The configured size is reported through a read-only HW_CONFIG0 field, so the size is not fixed.
    searches:
    - what: mementries and SRAM size parameters in the MCI RTL
      where: src/mci/rtl
      found: mementries=524288 is the maximum window. MCU_MBOX_SRAM_SIZE_KB is a parameter and is exposed
        in HW_CONFIG0.
    near_misses:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      line_start: 42
      line_end: 43
      why_not: The fixed mementries value looks like a fixed size, but in SystemRDL it only declares the
        maximum address range.
    new_sources: []
    reclassify: null
