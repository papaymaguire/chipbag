- id: f_13ad3b9fb3f3
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: Writing 0 to the execute register releases the mailbox.
  subject:
    requirements:
    - cr_7c9b88cf4821
  section: src/mci/rtl/mcu_mbox_csr.rdl > mcu_mbox_csr > mbox_execute
  spec:
  - path: src/mci/rtl/mcu_mbox_csr.rdl
    lines:
    - 98
    - 98
    text: Writing 0 releases the mailbox.
  detail:
    text: Writing 0 to the execute register releases the mailbox.
    note: It is not stated what 'releases the mailbox' changes in terms of observable state or signals.
    impact: 'This section only says that writing 0 ''releases the mailbox''. It does not say which state
      changes or when. One engineer could check that the lock reads 0 right after the write. Another could
      expect the SRAM to be zeroized first, with the lock held at 1 until that finishes. Existing tests
      already assume this second behaviour: the lock stays 1 during zeroize, then SRAM reads 0 after re-acquire.
      Those tests also leave open how much is zeroized: all of SRAM or only the dlen-covered words. Different
      engineers would therefore write different timing and expected-value checks for the lock, the SRAM
      contents, the target user / status registers, and any interrupts.'
    question: 'When the SRAM owner writes 0 to mbox_execute, exactly what happens and in what order? Specifically:
      (1) Is SRAM zeroized, and over what range (whole mailbox or up to the max dlen written)? (2) Does
      the lock stay at 1 until zeroization completes, and is there a status bit or signal that shows completion?
      (3) Which other registers are reset on release (e.g. user, dlen, cmd, target_user, target_status,
      cmd_status)? (4) Are any interrupts or notifications raised?'
  origin: normalize+review
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 4
    cost_usd: 0.043954099999999996
    submissions: 1
    rejections: []
    error: null
    summary: The hardware specification has a dedicated MCU Mailbox SRAM Clearing section and an ownership
      table that define what releasing the mailbox does. They give the zeroization range, the lock timing,
      the completion indication and the ownership change. Which other registers are reset on release is
      not stated, and no interrupt is tied to release. The core of the finding still falls away.
    resolution: The spec text in the HW specification (MCU Mailbox SRAM Clearing and the ownership table)
      defines the behaviour. Optionally cross-reference it from the mbox_execute description in the RDL,
      and state which registers (target_user, dlen, cmd) are cleared on unlock.
    evidence:
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1462
      line_end: 1469
      quote: When the mailbox lock is released the SRAM is zeroed out from 0 to max DLEN set during the
        locking period.
      role: refutes
      note: Defines the zeroization range, the ordering (release, clear, unlock) and that the lock is
        held until clearing ends.
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1473
      line_end: 1473
      quote: '**NOTE**: When DLEN = 0 the entire MBOX SRAM is cleared.'
      role: refutes
      note: Resolves the whole-SRAM versus dlen-range question.
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1401
      line_end: 1404
      quote: '| SRAM owner writes `EXECUTE=0` | None, and hardware begins zeroization |'
      role: refutes
      note: States that EXECUTE=0 starts zeroization and that LOCK clears when it completes. SRAM_OWNER
        reads 0 (None) in the meantime.
    searches:
    - what: zeroiz / release the mailbox in docs and rdl
      where: repo
      found: HW spec sections on MCU Mailbox SRAM Clearing and the ownership table fully describe the
        release behaviour
    near_misses:
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1475
      line_end: 1481
      why_not: The interrupt table lists no interrupt for release or zeroize-done. That is a small residual
        gap, but it is not the ambiguity the finding claims.
    new_sources:
    - path: docs/CaliptraSSHardwareSpecification.md
      reason: Contains the MCU mailbox release, zeroization and ownership description.
    reclassify: null
