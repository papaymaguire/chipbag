      that never writes a terminal `TARGET_STATUS` or `EXECUTE=0`.'
  detail:
    text: Neither Requester nor Root can reclaim the mailbox from a Target that never writes terminal
      TARGET_STATUS or EXECUTE=0.
    note: The set of TARGET_STATUS values that count as terminal is not defined in this section.
    impact: Which TARGET_STATUS values a test writes to return ownership to Root, and which writes it
      expects to leave ownership with the Target, both depend on the set of terminal values. The two existing
      tests only cover EXECUTE=0 being dropped while the Target owns the SRAM. They never exercise the
      terminal-status handoff. One engineer might treat every non-zero status as terminal; another might
      treat only DONE/CMD_FAILURE as terminal and expect writes of other values to leave the Target as
      owner, with TARGET_USER and TARGET_USER_VALID not cleared.
    question: 'Which TARGET_STATUS encodings are terminal, i.e. return SRAM ownership to Root and make
      hardware clear TARGET_USER and TARGET_USER_VALID? What happens when the Target writes a non-terminal
      value: does ownership stay unchanged, is the write accepted, and is TARGET_USER_VALID still cleared?
      Does the TARGET_STATUS done-bit/field encoding play a role in this?'
  origin: normalize+review
  severity: medium
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 9
    cost_usd: 0.0724958
    submissions: 1
    rejections: []
    error: null
    summary: The register description in mcu_mbox_csr.rdl defines terminal as any non-BUSY TARGET_STATUS
      value. The spec's encoding table (BUSY, DATA_READY, COMPLETE, FAILURE) lists the values. A terminal
      write returns ownership to Root, clears TARGET_USER and TARGET_USER_VALID, and notifies Root. The
      RTL matches this.
    resolution: Terminal means any non-BUSY value (1, 2 or 3). The spec section could add this definition
      to the ownership text. The RTL treats a BUSY to non-BUSY transition as the terminal write.
    evidence:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      line_start: 106
      line_end: 106
      quote: Writing any terminal (non-BUSY) value ends the target's SRAM ownership, clears TARGET_USER
        and TARGET_USER_VALID, and notifies Root.
      role: refutes
      note: Register description defines terminal as non-BUSY and states the consequences.
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1421
      line_end: 1426
      quote: '| 0 | BUSY |

        | 1 | DATA_READY |

        | 2 | COMPLETE |

        | 3 | FAILURE |'
      role: refutes
      note: Encoding table; BUSY=0 is the only non-terminal value.
    - path: src/mci/rtl/mcu_mbox.sv
      line_start: 279
      line_end: 279
      quote: assign target_terminal_write = target_status_busy_q && !target_status_busy;
      role: context
      note: RTL treats a transition away from BUSY as the terminal write.
    searches:
    - what: terminal / TARGET_STATUS in docs
      where: docs/
      found: Hardware spec only says 'terminal' without a definition; the encoding table is at 1421.
    - what: TARGET_STATUS description
      where: src/mci/rtl/mcu_mbox_csr.rdl
      found: Defines terminal as non-BUSY, with the ownership and clearing effects.
    near_misses:
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1413
      line_end: 1414
      why_not: The cited sentence is vague on its own, but the register description in the RDL resolves
        it.
    new_sources:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      reason: Register description defining terminal TARGET_STATUS as non-BUSY.
    reclassify: null
- id: f_f8d817cdecbe
  category: spec_ambiguity
  category_no: 1
  type: unclear_referent
  title: Only valid once LOCK is set.
  subject:
    section: sec_e41480f85f4c
    quote: 5437539636e4
  section: src/mci/rtl/mci_reg.rdl > mci_reg > MBOX0_VALID_AXI_USER
  spec:
  - path: src/mci/rtl/mci_reg.rdl
    lines:
    - 822
    - 822
    text: Only valid once LOCK is set.
  detail:
    text: Only valid once LOCK is set.
    note: '''LOCK'' is not tied to a specific register or field, and ''valid'' has no observable behavior
      defined.'
    impact: 'The referent is reasonably clear from context: the next sentence names AXI_USER_LOCK, so
      it is most likely the matching MBOX0_AXI_USER_LOCK[n].LOCK entry. What is unclear is what ''valid''
      means for checking. One engineer would check that an unlocked MBOX0_VALID_AXI_USER[n] entry is ignored
      by the mailbox AXI_USER access filter. In that reading, a request whose AXI_USER matches an unlocked
      entry is rejected, or falls back to another default. Another engineer would treat the entry as usable
      regardless of lock. These readings give different stimulus and different expected accept/reject
      results for mailbox access before and after lock. The per-index pairing (entry n locked by LOCK[n])
      also affects which write-protection checks are written.'
    question: Is MBOX0_VALID_AXI_USER[n] controlled by MBOX0_AXI_USER_LOCK[n].LOCK, with the same index
      n? When that LOCK bit is clear, is entry n excluded from the mailbox AXI_USER access check, so that
      a requester matching only that entry is denied? What exact response does a denied request receive
      (error, or read-as-zero with writes dropped)?
  origin: normalize+review
  severity: medium
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 8
    cost_usd: 0.056463200000000005
    submissions: 1
    rejections: []
    error: null
    summary: Other spec text answers the finding's questions. The LOCK register description pairs each
      lock bit with its entry. The hardware spec says untrusted users get an AXI error response. The integration
      spec says programmed entries must be locked before use.
    resolution: 'Spec text suffices: entry n is paired with LOCK[n]. An entry that is not locked is not
      trusted. An untrusted user gets an AXI error response. A small clarification could say outright
      that unlocked entries are excluded from the check.'
    evidence:
    - path: src/mci/rtl/mci_reg.rdl
      line_start: 830
      line_end: 831
      quote: "[br]Each bit corresponds to locking the associated MBO0X_VALID_AXI_USER register.\n    \
        \             [br]Associated MBOX0_VALID_AXI_USER register is only valid once locked by this bit."
      role: refutes
      note: Ties the LOCK entry to the VALID_AXI_USER entry with the same index (5 entries each), which
        answers the referent question.
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1297
      line_end: 1299
      quote: Any untrusted AXI user trying to read or write the mailbox will receive an AXI error response
      role: refutes
      note: 'Gives the denied-request response: an AXI error, not read-as-zero with dropped writes.'
    - path: docs/CaliptraSSIntegrationSpecification.md
      line_start: 2290
      line_end: 2292
      quote: 'If build-time integration straps are not used for configuring the trusted MBOX AXI users,
        then trusted users will need to configured with the following lockable MCI registers before MBOX
        can be used by SOC agents:'
      role: refutes
      note: Says the entries must be programmed and locked before use. Combined with the LOCK description,
        an unlocked entry is not trusted.
    searches:
    - what: VALID_AXI_USER and AXI_USER_LOCK references in docs and rdl
      where: repo docs/ and src/mci/rtl/mci_reg.rdl
      found: LOCK register description, hardware spec section 'MCU Mailbox Limited Trusted AXI users',
        integration spec requirement CSS_Axi_9
    near_misses:
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1562
      line_end: 1562
      why_not: This is about MCU SRAM AXI USER filtering, not the mailbox, so it does not answer the mailbox
        question.
    new_sources:
    - path: docs/CaliptraSSHardwareSpecification.md
      reason: Section 'MCU Mailbox Limited Trusted AXI users' defines the trusted-user set and the error
        response for untrusted users.
    - path: docs/CaliptraSSIntegrationSpecification.md
      reason: Requirement CSS_Axi_9 and the 'MCU Mailbox Limited Trusted AXI users' section say entries
        must be programmed and locked before use.
    reclassify: null
