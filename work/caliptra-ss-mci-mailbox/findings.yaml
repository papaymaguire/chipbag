- id: f_4a7ed506cf39
  category: spec_ambiguity
  category_no: 1
  type: vague
  title: The associated MBOX0_VALID_AXI_USER register is valid only once locked by this bit.
  subject:
    requirements:
    - cr_24d6af90a638
  section: src/mci/rtl/mci_reg.rdl > mci_reg > MBOX0_AXI_USER_LOCK
  spec:
  - path: src/mci/rtl/mci_reg.rdl
    lines: &id183
    - 831
    - 831
    text: Associated MBOX0_VALID_AXI_USER register is only valid once locked by this bit.
  detail:
    text: The associated MBOX0_VALID_AXI_USER register is valid only once locked by this bit.
    note: It is not stated what 'valid' means observably for the associated register before it is locked.
    impact: Engineers would write opposite pass criteria for mailbox access filtering. Suppose an AXI
      request's AxUSER matches an entry that has been programmed but not yet locked. One engineer would
      expect the request to be accepted. Another would expect it to be rejected or treated as an invalid
      user, since the unlocked entry is ignored. The expected mailbox lock/acquire result and the response
      for that stimulus differ between the two.
    question: Before MBOX0_AXI_USER_LOCK[i].LOCK is set, is MBOX0_VALID_AXI_USER[i] ignored by the mailbox
      AXI_USER filter? Is it ignored completely, so a matching AxUSER is rejected unless it matches another
      locked entry or the default user? And once LOCK is set, is that entry's value used for matching
      from the next transaction onward?
  origin: normalize+review
  severity: high
  status: verified
  verify:
    outcome: verified
    turns: 8
    cost_usd: 0.0682722
    submissions: 1
    rejections: []
    error: null
    summary: No spec text says directly that an unlocked MBOX0_VALID_AXI_USER entry is ignored by the
      filter. The hardware spec defines trusted users and the AXI error for untrusted ones. It never ties
      "valid" to "locked" in observable terms. It also never says when a newly locked entry takes effect.
      A reader can infer the intended behavior, but the spec does not state it.
    resolution: The intended behavior is probably that an unlocked entry is not used for matching, so
      a matching user is untrusted and gets an AXI error unless it matches a locked entry, the default
      user 0xFFFF_FFFF, or MCU. The spec should say this explicitly, and should also state when a newly
      locked entry takes effect.
    evidence:
    - path: src/mci/rtl/mci_reg.rdl
      line_start: 831
      line_end: 831
      quote: '[br]Associated MBOX0_VALID_AXI_USER register is only valid once locked by this bit.'
      role: supports
      note: The cited sentence. It does not say what 'valid' means observably for an unlocked entry.
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1297
      line_end: 1299
      quote: There are 5 trusted AXI Users determined at build time via parameters or via MCI lockable
        registers.
      role: context
      note: Defines the trusted set and says untrusted users get an AXI error. It does not say that an
        unlocked entry is excluded, or when a locked entry starts to match.
    - path: docs/CaliptraSSIntegrationSpecification.md
      line_start: 2293
      line_end: 2293
      quote: 'If build-time integration straps are not used for configuring the trusted MBOX AXI users,
        then trusted users will need to configured with the following lockable MCI registers before MBOX
        can be used by SOC agents:'
      role: context
      note: Implies that programming and locking is needed before use. It is not an explicit statement
        that an unlocked entry is rejected.
    - path: src/mci/rtl/mci_reg_top.sv
      line_start: 650
      line_end: 650
      quote: mci_reg_hwif_in.MBOX0_VALID_AXI_USER[i].AXI_USER.swwel = mci_reg_hwif_out.MBOX0_AXI_USER_LOCK[i].LOCK.value;
      role: context
      note: The RTL uses LOCK to make the entry read-only. The match gating on lock is at line 653. I
        did not inspect it in full.
    searches:
    - what: VALID_AXI_USER and AXI_USER_LOCK in docs and rdl
      where: docs/, src/mci/rtl
      found: Only the vague rdl text, integration strap tables and requirement CSS_Axi_9. None of them
        define the behavior of an unlocked entry.
    - what: MCU Mailbox Limited Trusted AXI users sections
      where: HardwareSpecification.md:1295, IntegrationSpecification.md:2291
      found: They describe the trusted set and the AXI error for untrusted users. They do not say what
        happens to a matching but unlocked entry, or when a locked entry takes effect.
    near_misses:
    - path: docs/CaliptraSSHardwareSpecification.md
      line_start: 1295
      line_end: 1299
      why_not: It gives the AXI error for untrusted users. Reading an unlocked entry as untrusted is an
        inference, not stated text. The next-transaction timing is also unspecified.
    new_sources: []
    reclassify: null
- id: f_93d56e2865ea
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: Hardware clears the field on a terminal TARGET_STATUS write.
  subject:
    requirements:
    - cr_fad8836bd8f3
  section: src/mci/rtl/mcu_mbox_csr.rdl > mcu_mbox_csr > mbox_target_user_valid
  spec:
  - path: src/mci/rtl/mcu_mbox_csr.rdl
    lines:
    - 80
    - 80
    text: Cleared by hardware on a terminal TARGET_STATUS write
  detail:
    text: Hardware clears the field on a terminal TARGET_STATUS write.
    note: It is not defined which TARGET_STATUS values count as terminal.
    impact: The test for hardware clearing writes TARGET_STATUS values and then checks TARGET_USER_VALID.
      If terminal means only COMPLETE, a test writing a non-COMPLETE status such as an error expects VALID
      to stay 1. If error statuses also count as terminal, the same write expects VALID to go to 0. Whether
      non-terminal writes (for example busy or in-progress) must leave VALID set cannot be checked either.
      Existing tests cover only COMPLETE, so the expected result for every other encoding is a guess.
    question: Which TARGET_STATUS encodings (or which field and value combinations) are terminal and cause
      hardware to clear TARGET_USER and TARGET_USER_VALID? Must a write of any non-terminal value leave
      both registers unchanged?
  origin: normalize+review
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.0380506
    submissions: 1
    rejections: []
    error: null
    summary: The TARGET_STATUS field description in the same RDL defines terminal as any non-BUSY value,
      which answers the question. Writing any non-BUSY value (DATA_READY, CMD_COMPLETE, CMD_FAILURE) clears
      TARGET_USER and TARGET_USER_VALID. A BUSY write is non-terminal.
    resolution: Cross-reference the TARGET_STATUS field description from the TARGET_USER_VALID description,
      or restate "terminal = any non-BUSY value". It is still unspecified whether a write of a reserved
      encoding (4 to 15) counts as terminal.
    evidence:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      line_start: 106
      line_end: 106
      quote: Writing any terminal (non-BUSY) value ends the target's SRAM ownership, clears TARGET_USER
        and TARGET_USER_VALID, and notifies Root.
      role: refutes
      note: Defines terminal as non-BUSY and states the clearing effect.
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      line_start: 109
      line_end: 120
      quote: CMD_BUSY = 4'd0 {
      role: context
      note: 'Enum encodings: BUSY=0, DATA_READY=1, COMPLETE=2, FAILURE=3.'
    searches:
    - what: TARGET_USER_VALID and terminal definitions
