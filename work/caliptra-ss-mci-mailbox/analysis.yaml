  section: src/mci/rtl/mcu_mbox_csr.rdl > mcu_mbox_csr > mbox_lock … (3 sections)
  items:
  - req_id: cr_402cb9b67d1a
    statement: 'mcu_mbox_csr.mbox_lock.lock: hardware can set the field (true).'
    section: src/mci/rtl/mcu_mbox_csr.rdl > mcu_mbox_csr > mbox_lock
    spec:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      lines:
      - 53
      - 53
      text: hwset=true
    gap: During normal operation with the lock free, have an agent read MBOX_LOCK and check the read returns
      0 and hardware sets the lock bit. A second read must then return 1. Also check hardware sets the
      lock after the lock is released.
    severity: medium
    tested_by:
    - unit: smoke_test_mcu_mbox_csrs_warm_rst
      rationale: After a warm reset the test checks that the lock is still set. This indirectly shows
        hardware sets or retains the lock across reset.
      missing: Only the reset-time set or retention is checked. Hardware setting the lock during normal
        operation is not exercised.
      cites:
      - path: src/integration/test_suites/smoke_test_mcu_mbox_csrs_warm_rst/smoke_test_mcu_mbox_csrs_warm_rst.c
        lines: *id078
        text: mcu_mbox_read_lock(mbox_num)
        kind: stimulus
        statement: After reset, read the mailbox CSRs back (lock, mbox_user, target_user, target_user_valid,
          target_status, cmd, cmd_status, dlen, hw_status, sram_owner, execute).
      - path: src/integration/test_suites/smoke_test_mcu_mbox_csrs_warm_rst/smoke_test_mcu_mbox_csrs_warm_rst.c
        lines: *id079
        text: mcu_mbox_read_mbox_user(mbox_num)
        kind: stimulus
        statement: After reset, read the mailbox CSRs back (lock, mbox_user, target_user, target_user_valid,
          target_status, cmd, cmd_status, dlen, hw_status, sram_owner, execute).
      - path: src/integration/test_suites/smoke_test_mcu_mbox_csrs_warm_rst/smoke_test_mcu_mbox_csrs_warm_rst.c
        lines: *id080
        text: mcu_mbox_read_target_user(mbox_num)
        kind: stimulus
        statement: After reset, read the mailbox CSRs back (lock, mbox_user, target_user, target_user_valid,
          target_status, cmd, cmd_status, dlen, hw_status, sram_owner, execute).
    - unit: smoke_test_mbox_csr_zeros_after_release
      rationale: The test reads MBOX_LOCK after reset and expects the lock bit to be set. This shows the
        hardware sets the lock out of reset for the MCU.
      missing: Only the reset-time hardware set is checked. Hardware setting the lock at other times,
        and the setting mechanism itself, are not exercised.
      cites:
      - path: src/integration/test_suites/smoke_test_mbox_csr_zeros_after_release/smoke_test_mbox_csr_zeros_after_release.c
        lines:
        - 52
        - 52
        text: (lsu_read_32(SOC_MCI_TOP_MCU_MBOX0_CSR_MBOX_LOCK + MCU_MBOX_NUM_STRIDE * mbox_num) & MCU_MBOX0_CSR_MBOX_LOCK_LOCK_MASK)
          == 0
        kind: check
        statement: The MBOX_LOCK lock bit is set out of reset; otherwise a fatal message is printed, stdout
          ctrl 0x1 is sent and the test hangs.
        fails_test: 'yes'
  - req_id: cr_a7c29b77aa24
    statement: 'mcu_mbox_csr.mbox_lock.lock: hardware can clear the field (true).'
    section: src/mci/rtl/mcu_mbox_csr.rdl > mcu_mbox_csr > mbox_lock
    spec:
    - path: src/mci/rtl/mcu_mbox_csr.rdl
      lines:
      - 53
      - 53
      text: hwclr=true
    gap: Check the hardware clear of the lock directly. Release the lock through the hardware path by
      clearing EXECUTE after an execute, and at the end of zeroize. Check the lock field reads 0 and can
      be re-acquired, without a software write to the lock.
    severity: medium
    tested_by:
    - unit: smoke_test_mcu_mbox_target_user
      rationale: The test clears the mailbox lock held out of reset, then requires the MCU to acquire
        it within the timeout. Acquisition succeeding implies the hardware or clear path released the
        lock.
      missing: The hardware clear is not checked directly. Other hardware clear triggers, such as release
