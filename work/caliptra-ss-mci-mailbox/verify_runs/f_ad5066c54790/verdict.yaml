  outcome: inconclusive
  summary: Three of the five items are covered by the nightly ownership-flow test, and two have no test.
    The `mci_mbox0/1_ownership_flow` test is in the nightly regression. It drives full Requester→Root→Target→Root→Requester
    transactions with a terminal status in the range DATA_READY..CMD_FAILURE (1..3), and it checks `HW_STATUS.SRAM_OWNER`
    in every phase. SRAM_OWNER=NONE and FAILURE=3 are therefore checked, and the BUSY=0 encoding is only
    partly checked. Nothing checks that a terminal TARGET_STATUS is invisible to the Requester as completion,
    and nothing covers the MCU-as-Requester case.
  evidence:
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 95
    line_end: 95
    quote: '    mci_comm_flow_check_phase("released", MCU_MBOX_OWNER_NONE);'
    role: refutes
    note: After EXECUTE=0, `mcu_mbox_check_sram_owner` counts an error unless `SRAM_OWNER` reads NONE
      (value 0). The test is in the nightly regression.
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 202
    line_end: 204
    quote: "    for (int status = mcu_mbox_csr__mbox_cmd_status__status__mbox_status_e__DATA_READY;\n\
      \         status <= mcu_mbox_csr__mbox_cmd_status__status__mbox_status_e__CMD_FAILURE; status++)\n\
      \        mci_comm_flow_transaction(status);"
    role: refutes
    note: FAILURE (3) is written as a terminal status to both TARGET_STATUS and CMD_STATUS. The ownership
      transitions are then checked in each phase.
  - path: src/integration/test_suites/smoke_test_mcu_mbox_write_user_lock/smoke_test_mcu_mbox_write_user_lock.c
    line_start: 137
    line_end: 137
    quote: '    mcu_mbox_write_target_status(mbox_num, MCU_MBOX_TARGET_STATUS_FAILURE);'
    role: context
    note: Root's write of FAILURE to TARGET_STATUS is checked to be ignored. This is an access-control
      check, not an encoding check.
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 133
    line_end: 133
    quote: '    mci_comm_flow_check_phase("root-owns-response", MCU_MBOX_OWNER_ROOT);'
    role: context
    note: After the Target's terminal status, the SRAM owner is Root. The test never reads CMD_STATUS
      as the Requester to confirm the Requester does not see completion yet.
