  summary: The mcu_intr_handler directed test triggers each error and notif interrupt, including the three
    counters cited here. It then reads every *_INTR_COUNT_R and fails the sim if the hardware count sum
    differs from the firmware count. It is in the nightly regressions. The check is an aggregate sum,
    so it is weaker than a per-counter check. But a counter that failed to increment, or incremented by
    more than 1, would fail the test unless another counter offset it.
