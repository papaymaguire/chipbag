  summary: Four items are covered by the directed test mcu_intr_handler, which is in the nightly regression.
    It triggers each interrupt once and checks that the sum of the HW counters equals the firmware count.
    The saturation item (cr_71500986) has no test, and reaching it would take about 2^32 events. So the
    finding stands only for that item.
