  outcome: verified
  summary: The directed test mcu_intr_handler triggers every notif interrupt once, including mbox1_soc_req_lock
    and mbox1_ecc_cor. It then compares the summed hardware counters against the firmware count and kills
    the sim on a mismatch. That covers the increment-by-1 items (cr_4400c784ffb0, cr_49c8b388dda9), though
    only in aggregate. I found no test that drives a counter to saturation, so the two saturation items
    stand. The internal decrement pulse is only checked indirectly, so I left that item inconclusive.
