    reason: Register description defining terminal TARGET_STATUS as non-BUSY.
  resolution: Terminal means any non-BUSY value (1, 2 or 3). The spec section could add this definition
    to the ownership text. The RTL treats a BUSY to non-BUSY transition as the terminal write.
