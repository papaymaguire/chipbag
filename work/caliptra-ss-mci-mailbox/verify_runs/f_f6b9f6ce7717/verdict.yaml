  summary: The register description in mcu_mbox_csr.rdl defines terminal as any non-BUSY TARGET_STATUS
    value. The spec's encoding table (BUSY, DATA_READY, COMPLETE, FAILURE) lists the values. A terminal
    write returns ownership to Root, clears TARGET_USER and TARGET_USER_VALID, and notifies Root. The
    RTL matches this.
