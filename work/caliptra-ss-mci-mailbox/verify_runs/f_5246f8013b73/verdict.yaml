  outcome: withdrawn
  summary: The directed test mcu_intr_handler triggers each MCI error and notif interrupt once. It then
    reads all the *_INTR_COUNT_R counters and fails if their sum differs from the number of events triggered.
    This covers all five items, though only through an aggregate check. The test is in the nightly regression.
    The check does not compare each counter separately, so offsetting errors between two counters could
    mask a fault.
