  summary: No test checks the five items. The ownership-flow test and the target_user smoke tests write
    terminal statuses and check ownership, SRAM contents and notifications. None of them checks a BUSY
    reset, hw/sw write precedence, or what CMD_BUSY or DATA_READY mean. The only BUSY references outside
    the USB suites are enum definitions in caliptra_ss_lib.h.
  evidence:
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 131
    line_end: 133
    quote: mcu_mbox_write(mci_comm_flow_target_status_addr, mci_comm_flow_target, status);
    role: context
    note: The test writes a terminal TARGET_STATUS (DATA_READY, CMD_COMPLETE or CMD_FAILURE). It then
      checks only the TARGET_DONE notification and SRAM ownership, never a read-back of the status or
      a BUSY value.
  - path: src/mci/rtl/mcu_mbox_csr.rdl
    line_start: 122
    line_end: 122
    quote: sw=rw; hw=r; swwe=valid_target_req; encode = mbox_status_e; hwclr; precedence=hw; swmod=true;}
      status[4]=0;
    role: supports
    note: The hwclr and precedence=hw fields are in the spec. No test creates a simultaneous hardware
      clear and software write.
  - path: src/integration/test_suites/libs/caliptra_ss_lib/caliptra_ss_lib.h
    line_start: 245
    line_end: 245
    quote: MCU_MBOX_TARGET_STATUS_CMD_BUSY = 0x0,
    role: context
    note: This enum definition is the only BUSY reference outside the USB suites. No test checks that
      the status reads as BUSY.
