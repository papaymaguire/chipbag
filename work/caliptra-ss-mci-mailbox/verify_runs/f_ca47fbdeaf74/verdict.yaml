verdict:
  outcome: verified
  summary: The directed test mcu_intr_handler triggers each of these interrupts through the INTR_TRIG
    registers. It then reads the hardware count registers and fails the sim if their sum differs from
    a firmware count that grows by 1 per trigger. That covers items 1-4, though the check is on sums rather
    than per register. I found no test that pushes any of these counters to its maximum, so the saturation
    claim (item 5) is untested.
  evidence:
  - path: src/integration/test_suites/mcu_intr_handler/mcu_intr_handler.c
    line_start: 109
    line_end: 110
    quote: lsu_write_32(SOC_MCI_TOP_MCI_REG_INTR_BLOCK_RF_NOTIF0_INTR_TRIG_R, MCI_REG_INTR_BLOCK_RF_NOTIF0_INTR_TRIG_R_NOTIF_MBOX0_CMD_AVAIL_TRIG_MASK     );
      mci_notif_intr_count++;
    role: refutes
    note: 'Stimulus: triggers MBOX0 CMD_AVAIL (line 110 does MBOX1) and bumps the firmware count by 1.
      The same pattern covers ecc_unc at lines 64-65 and soc_req_lock at lines 116-117.'
  - path: src/integration/test_suites/mcu_intr_handler/mcu_intr_handler.c
    line_start: 256
    line_end: 259
    quote: if (mci_notif_intr_count != mci_notif_intr_count_hw) {
    role: refutes
    note: 'Check: the sum of the hardware notif counts, including MBOX0/1 CMD_AVAIL and SOC_REQ_LOCK,
      must equal the firmware count, otherwise the sim is killed. Line 201 does the same for the error
      counts, which include the ECC_UNC counters.'
