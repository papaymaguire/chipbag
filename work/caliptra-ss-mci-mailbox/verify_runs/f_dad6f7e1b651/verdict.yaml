verdict:
  outcome: verified
  summary: Items 1, 3 and 4 are still not covered. I found no test that checks non-Root or Root-when-valid
    writes to TARGET_USER_VALID, writes to TARGET_STATUS by non-target agents, or a TARGET_STATUS write
    attempted while valid_target_req is deasserted. Items 2 and 5 are covered by the MCI_MBOX0/1_OWNERSHIP_FLOW
    SV test, so I withdrew them. That test has the Target write each terminal status DATA_READY..CMD_FAILURE.
    After each write it must see TARGET_DONE set (fatal on timeout) and the SRAM owner back at Root. The
    owner is derived from TARGET_USER_VALID, which the RTL clears on a terminal write. The "not set for
    non-terminal values" part is still unchecked.
  evidence:
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 129
    line_end: 131
    quote: "    mcu_mbox_write(mci_comm_flow_target_status_addr, mci_comm_flow_target, status);\n    mcu_mbox_wait_clear_notif(mci_comm_flow_mbox,\
      \ MCU_MBOX_NOTIF_TARGET_DONE);\n    mci_comm_flow_check_phase(\"root-owns-response\", MCU_MBOX_OWNER_ROOT);"
    role: refutes
    note: Target writes a terminal status; TARGET_DONE must be raised and SRAM owner must be Root (items
      2 and 5)
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 202
    line_end: 202
    quote: '    for (int status = mcu_mbox_csr__mbox_cmd_status__status__mbox_status_e__DATA_READY;'
    role: refutes
    note: Loops over all terminal values DATA_READY..CMD_FAILURE
  - path: src/integration/testbench/sv_tests/mci/mci_common_tasks.svh
    line_start: 490
    line_end: 491
    quote: "        if (poll == max_polls)\n            $fatal(1, \"mcu_mbox_wait_clear_notif: mbox=%0d\
      \ %s never set, NOTIF0=%08x\", mbox_num, notif.name(), data);"
    role: refutes
    note: Check fails the test if TARGET_DONE is never set
  - path: src/mci/rtl/mcu_mbox.sv
    line_start: 376
    line_end: 376
    quote: assign hwif_in.mbox_target_user_valid.valid.hwclr = mbox_release | target_terminal_write;
    role: context
    note: RTL clears valid on a terminal write; the owner flip to Root reflects this
  searches:
  - what: 'Item 1: tests writing TARGET_USER_VALID from non-Root users or from Root while the field is
      1'
    where: src/integration (test_suites, sv_tests)
    found: Only the cited smoke tests (Root write while 0, invalid-user write). The ownership flow only
      writes it as Root while 0. No rejection check for Root while 1 or for a trusted non-Root user.
  - what: 'Item 2: terminal TARGET_STATUS values clearing TARGET_USER_VALID'
    where: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    found: All terminal values are looped, with a Root owner check after each. This is indirect evidence
      that valid cleared; no direct read of TARGET_USER_VALID.
  - what: 'Item 3: TARGET_STATUS writes from non-target, non-Root users or the Requester'
    where: src/integration
    found: None. mci_comm_flow_check_phase only writes SRAM and EXECUTE from non-owners, not TARGET_STATUS.
  - what: 'Item 4: TARGET_STATUS write attempted while valid_target_req is deasserted, then accepted after
      the grant'
    where: src/integration
    found: None beyond the Root-write checks in the cited tests.
  - what: 'Item 5: TARGET_DONE notification per terminal value'
    where: mci_mbox_ownership_flow.svh and mci_common_tasks.svh
    found: TARGET_DONE is waited on after each status in the loop, and a missing one is fatal. Non-terminal
      values not notifying is not checked.
