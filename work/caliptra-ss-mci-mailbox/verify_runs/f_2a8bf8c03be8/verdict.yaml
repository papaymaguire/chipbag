verdict:
  outcome: verified
  summary: No test checks that VALID_AXI_USER or AXI_USER_LOCK become read-only or ignore writes once
    locked. Firmware writes the valid users and then the lock once (configure sequence), and the SV agent
    only polls reads. The generic register tests in mci.c only list the registers in tables; I found no
    write-after-lock check.
  evidence:
  - path: src/integration/test_suites/libs/caliptra_ss_lib/caliptra_ss_lib.c
    line_start: 501
    line_end: 501
    quote: lsu_write_32(SOC_MCI_TOP_MCI_REG_MBOX0_VALID_AXI_USER_0 + MCU_MBOX_AXI_CFG_STRIDE*mbox_num,
      axi_user_id[0]);
    role: context
    note: The firmware configure routine writes the users and then the lock once. It never attempts a
      write after the lock is set and never checks that such a write is blocked.
  - path: src/integration/testbench/sv_tests/mci/mcu_mbox_soc_agent_write_fw_image.svh
    line_start: 104
    line_end: 104
    quote: if (rd_data == 1) begin
    role: context
    note: The SV agent only polls and reads the lock bit. It does not write after lock.
  searches:
  - what: 'cr_9a48d7d6fd74: a write to VALID_AXI_USER after the lock is set, with a check that the value
      is unchanged'
    where: src/integration test_suites and testbench
    found: Only the configure helper writes VALID_AXI_USER, once and before the lock. No write after lock
      and no check.
  - what: 'cr_da0583be4faf: a test of AXI_USER being read-only once locked'
    where: src (tests, assertions, coverage)
    found: Nothing. mci_top_cov_if.sv and mci_reg_uvm.sv are coverage and register model only.
  - what: 'cr_0b9bfdf42da6: a rewrite of the LOCK field after it is set'
    where: src/integration
    found: The lock is written only once, in the configure helper. No second write.
  - what: 'cr_24d6af90a638: a check that VALID_AXI_USER is effective only once locked'
    where: src/integration testbench and tests
    found: The SV agent waits for the lock bit to read 1, but there is no check that an unlocked user
      is rejected.
  - what: 'cr_43669ff8e969: an attempt to clear LOCK once set'
    where: src/integration test_suites and mci.c
    found: Only register table entries and mask entries in mci.c. No clear attempt and no check.
