verdict:
  outcome: verified
  summary: I found no test that checks the pulse or counter behaviour of these four count_incr registers.
    The only test that reads their count registers, `mcu_intr_handler`, triggers interrupts through the
    software trigger registers. It never raises the real hardware events that drive the `hwset` input
    of the incrementor pulse. The other hits are register masks in `mci.c` and coverpoints in `mci_top_cov_if.sv`,
    and neither checks anything.
  evidence:
  - path: src/mci/rtl/mci_reg.rdl
    line_start: 1548
    line_end: 1549
    quote: "This is implemented as a down-counter (1-bit) that will\n                decrement immediately\
      \ on being set - resulting in a pulse"
    role: context
    note: The behaviour the items describe.
  - path: src/mci/rtl/mci_reg.sv
    line_start: 22281
    line_end: 22281
    quote: end else if(hwif_in.intr_block_rf.notif0_internal_intr_r.notif_mbox0_ecc_cor_sts.hwset) begin
      // HW Set
    role: context
    note: The incrementor pulse is set only by the hardware hwset input. The software trigger bit (trig)
      does not drive it.
  - path: src/mci/rtl/mci_reg_top.sv
    line_start: 833
    line_end: 834
    quote: always_comb mci_reg_hwif_in.intr_block_rf.error0_internal_intr_r.error_mbox0_ecc_unc_sts.hwset  =
      mbox0_sram_double_ecc_error;
    role: context
    note: The pulse is driven by real mailbox ECC error events. The tests found never raise them while
      checking the counters.
  - path: src/integration/test_suites/mcu_intr_handler/mcu_intr_handler.c
    line_start: 64
    line_end: 64
    quote: lsu_write_32(SOC_MCI_TOP_MCI_REG_INTR_BLOCK_RF_ERROR0_INTR_TRIG_R, MCI_REG_INTR_BLOCK_RF_ERROR0_INTR_TRIG_R_ERROR_MBOX0_ECC_UNC_TRIG_MASK             );
    role: context
    note: 'Near miss: the stimulus is a software trigger write, not a hardware event on the hwset input.'
  - path: src/mci/coverage/mci_top_cov_if.sv
    line_start: 4810
    line_end: 4810
    quote: 'INTR_BLOCK_RF_ERROR_MBOX0_ECC_UNC_INTR_COUNT_INCR_R_cp : coverpoint i_mci_reg_top.i_mci_reg.field_storage.intr_block_rf.error_mbox0_ecc_unc_intr_count_incr_r;'
    role: context
    note: A coverpoint only. It checks nothing.
  searches:
