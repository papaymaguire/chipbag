  outcome: verified
  summary: Four of the five items are untested. The SRAM_OWNER=0 (None) item is covered. The nightly mci_mbox{0,1}_ownership_flow
    tests release the mailbox with EXECUTE=0 and then read MBOX_HW_STATUS.sram_owner and expect NONE.
    The other four have no stimulus-and-check pair. Nothing checks that TARGET_STATUS goes to BUSY on
    a handoff, and nothing checks that a terminal TARGET_STATUS stays hidden from the Requester. No test
    covers CMD_STATUS being unused when MCU is the Requester. For the BUSY encoding, tests only check
    that the reset value reads 0 and never decode 0 as BUSY.
  evidence:
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 93
    line_end: 95
    quote: "task automatic mci_comm_flow_end(input logic [31:0] user);\n    mcu_mbox_write(mci_comm_flow_execute_addr,\
      \ user, 0);\n    mci_comm_flow_check_phase(\"released\", MCU_MBOX_OWNER_NONE);"
    role: refutes
    note: After release the test checks that sram_owner is NONE (0) through mcu_mbox_check_sram_owner,
      which counts an error on a mismatch. This covers the SRAM_OWNER=0 item.
  - path: src/integration/testbench/sv_tests/mci/mci_mbox_ownership_flow.svh
    line_start: 129
    line_end: 132
    quote: // Target writes its response and DLEN; a terminal TARGET_STATUS returns the SRAM to Root with
      TARGET_DONE.
    role: context
    note: The flow writes a terminal TARGET_STATUS and checks only the SRAM owner and the notification.
      It never reads TARGET_STATUS or CMD_STATUS, so it does not check BUSY on handoff or Requester visibility.
  - path: src/integration/test_suites/smoke_test_mcu_mbox_csrs_warm_rst/smoke_test_mcu_mbox_csrs_warm_rst.c
