  summary: Four of five items stand as untested. The only related test is mcu_intr_handler, which triggers
    each notif and error interrupt through the INTR_TRIG registers and checks that the summed hardware
    counters equal the firmware's per-event count. That check covers "increments by 1 per interrupt event",
    so that item is withdrawn. No test checks saturation, the decrvalue=1 pulse mechanics or the swwel=false
    write behaviour. The 1-cycle pulse is only constrained indirectly, so it is inconclusive.
