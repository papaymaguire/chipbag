refinements:
- general: cr_7f11ce310155
  specific: cr_daf7f972a12c
  note: Names MBOX*_VALID_AXI_USER as a lockable register to program when build-time straps are not used,
    and requires this before SOC agents can use the MBOX.
- general: cr_7f11ce310155
  specific: cr_554ae7995021
  note: Names MBOX*_AXI_USER_LOCK as a lockable register to program when build-time straps are not used,
    and requires this before SOC agents can use the MBOX.
- general: cr_13111347f6a1
  specific: cr_afc100cc6162
  note: 'Specifies the read case: applies to any address within the MBOX, and is listed together with
    read data returning 0.'
- general: cr_13111347f6a1
  specific: cr_3ec096e042ba
  note: 'Specifies the write case: applies to any address within the MBOX, and is listed together with
    write data being dropped.'
- general: cr_b595d18072f4
  specific: cr_02fb83d7a561
  note: 'Specifies the MCU as the accessor: MCU can access the mailbox SRAM only while it is the current
    SRAM owner.'
- general: cr_9ac8672befb2
  specific: cr_08f8117ee778
  note: Names the Requester as the actor that has write access to CMD, DLEN and EXECUTE while it is the
    current SRAM owner.
- general: cr_9ac8672befb2
  specific: cr_1bbaeb8ce995
  note: Names the MCU as the actor that has write access to CMD, DLEN and EXECUTE while it is the current
    SRAM owner (as lock holder or as Root).
- general: cr_9ac8672befb2
  specific: cr_450be2e0c898
  note: Names the Target user as the actor that has write access to DLEN while it is the current SRAM
    owner.
- general: cr_a3c565e7e90b
  specific: cr_a7a5760af8b0
  note: Adds that writing TARGET_USER_VALID=1 makes the Target the SRAM owner.
- general: cr_a7a5760af8b0
  specific: cr_544f85d0643b
  note: Adds the condition EXECUTE=1 and states that the owner is the agent named by TARGET_USER.
- general: cr_a3c565e7e90b
  specific: cr_d08aaaf85b8d
  note: Adds that TARGET_USER must be written with the Target AXI identity before TARGET_USER_VALID=1.
- general: cr_9577993d9d4a
  specific: cr_3b6d13a3f56d
  note: Adds that SRAM ownership returns to ROOT (MCU) on the same terminal TARGET_STATUS write.
- general: cr_013cc862bac2
  specific: cr_3b6d13a3f56d
  note: Adds that hardware clears TARGET_USER and TARGET_USER_VALID on the same terminal write.
- general: cr_edff6af5db3e
  specific: cr_56a9f089c083
  note: Adds that the requester reads LOCK first and stages SRAM, DLEN and CMD only while it is the owner.
- general: cr_490431f570f6
  specific: cr_1a9c1093ca29
  note: 'Adds exclusivity: the Requester regains ownership only after the non-BUSY CMD_STATUS write, and
    not before.'
- general: cr_2d3206a4c6cc
  specific: cr_8c87d704146c
  note: Adds the requirement that writes to TARGET_USER_VALID come only from Root, in addition to the
    TARGET_USER_VALID=0 condition.
- general: cr_2d3206a4c6cc
  specific: cr_1f76a6b9287f
  note: Narrows the TARGET_USER_VALID=0 write condition to the TARGET_USER field only.
- general: cr_2fb489622bbf
  specific: cr_381131113d9e
  note: 'req_96d83026f027 adds exclusivity: MCU is the only agent allowed to write CMD_STATUS while an
    external Requester holds the lock. req_16023368c369 only states that MCU has RW access.'
- general: cr_22019b2fd428
  specific: cr_76646888f9aa
  note: Also states that LOCK clears after the zeroization, in addition to the zeroization through the
    maximum DLEN.
- general: cr_c6d88c437f9b
  specific: cr_8e97283b1d02
  note: req_9ce6c1a75334 additionally states that the Requester cannot change the request after EXECUTE=1,
    not only abort it.
- general: cr_c3cf5a9b3e68
  specific: cr_83b707b90303
  note: Applies to the MCU-as-intermediary flow for a SoC Requester, and adds that the MCU finalizes the
    response after reading TARGET_STATUS.
- general: cr_0cf0aff16ad9
  specific: cr_a9dedad0d8d3
  note: Adds the maximum fully addressable SRAM size of 2 MB for each mailbox SRAM.
- general: cr_46947f53e3a7
  specific: cr_88e6e15d4e78
  note: 'Specifies the trigger: the Target user writes a terminal TARGET_STATUS.'
- general: cr_920e089bc5fb
  specific: cr_12dbdc943d69
  note: Specifies that a command is available when a SOC agent gets the lock and asserts the EXECUTE register.
- general: cr_b395303f48f6
  specific: cr_4620abd4f768
  note: 'req_807189809570 adds the exact assertion condition: MCU holds the mailbox lock and EXECUTE is
    1, with the signal asserted for as long as that holds. req_65b0bab10daf only says the signal asserts
    when the Target uses the sideband wire.'
- general: cr_47d5ed927b44
  specific: cr_9745edebffd7
  note: Adds that the same MBOX_DLEN and MBOX_EXECUTE sequence also wipes the MBOX SRAM, not just releases
    the mailbox.
- general: cr_70d4abdff253
  specific: cr_c7b22ef8b5a5
  note: req_6742bd91059f states only that hardware can clear mbox_dlen.length; req_3579b9e93ee6 adds the
    condition that it is cleared when the lock is cleared.
