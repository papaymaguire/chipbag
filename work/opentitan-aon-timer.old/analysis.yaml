    note: The text does not say whether wkup_req is cleared, when it is cleared, or whether the threshold
      is a register-configured value.
    impact: 'The watchdog has two thresholds, bark and bite. One engineer may expect wkup_req on bark,
      as the existing tests check. Another may expect it on bite, or on both. The deassertion check also
