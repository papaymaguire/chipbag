  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WKUP_THOLD_HI
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 208
    - 208
    text: The count at which a wakeup interrupt should be generated, top 32 bits.
  detail:
    text: The count at which a wakeup interrupt should be generated, top 32 bits.
    note: '''should be generated'' is a weak modal, and the comparison (equal vs greater-or-equal) and
      timing of the wakeup interrupt are not specified.'
    impact: 'The equal vs greater-or-equal question changes expected results when software programs a
      threshold at or below the current count. Under ''>='', the interrupt fires immediately. Under ''=='',
      it never fires until the counter wraps. A scoreboard predicting interrupt assertion would differ
      between the two readings. The unspecified latency also matters: the threshold crosses from the bus
      clock to clk_aon, so cycle-accurate checks of interrupt or wakeup timing would use different windows.
      Finally, the passage does not say how the 32-bit HI/LO halves combine for the comparison. Engineers
      could differ on stimulus that updates the halves non-atomically.'
    question: Is the wakeup interrupt and wakeup request asserted when the 64-bit count (WKUP_COUNT_HI:LO)
      is greater than or equal to the 64-bit threshold (WKUP_THOLD_HI:LO), or only when equal? Is it asserted
      immediately if the threshold is programmed at or below the current count? How many clk_aon_i cycles
      after the count reaches the threshold does the interrupt/wakeup assert, accounting for the CDC of
      the threshold registers?
  origin: normalize+review
  severity: medium
  status: candidate
- id: f_1bc5edd4d321
  category: spec_ambiguity
