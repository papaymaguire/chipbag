    - 220
    text: The count at which a wakeup interrupt should be generated, bottom 32 bits.
  detail:
    text: The count at which a wakeup interrupt should be generated, bottom 32 bits.
    note: '''should be generated'' is a weak modal and leaves the comparison condition between the count
      and threshold undefined.'
    impact: An engineer assuming '==' and one assuming '>=' would write different checks in two cases.
      One is software lowering the threshold below the current count. The other is count wrapping. Under
      '>=', the interrupt and wakeup request fire immediately (on the next aon tick). Under '==', nothing
      fires until wrap. The latency of the interrupt is also unstated. This includes the prescaler tick
      and the clk_aon_i to clk_i synchronization. Without it, the expected assertion cycle window in the
      scoreboard would differ.
    question: Is the wakeup interrupt/request asserted when the 64-bit wakeup count is greater than or
      equal to {WKUP_THOLD_HI, WKUP_THOLD_LO}, or only when it is exactly equal? Does it fire immediately
      if the threshold is programmed below the current count? What is the maximum latency, in clk_aon_i
      and clk_i cycles, from the count meeting the threshold to intr_wkup_timer_expired_o / wkup_req being
      observed?
  origin: normalize+review
  severity: medium
  status: candidate
