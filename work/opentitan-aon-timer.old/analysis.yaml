  title: A watchdog bark interrupt is generated when the watchdog count reaches the threshold value.
  subject:
    requirements:
    - cr_d264b8651756
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WDOG_BARK_THOLD
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 290
    - 290
    text: The count at which a watchdog bark interrupt should be generated.
  detail:
    text: A watchdog bark interrupt is generated when the watchdog count reaches the threshold value.
    note: It is not stated whether the bark fires on count equal to or at/above the threshold, or how
      many cycles after the count reaches it.
    impact: The field description only says 'the count at which' the bark should be generated. Two engineers
      would build different scoreboard models in two cases. First, if software writes WDOG_COUNT above
      the threshold, as in a jump test, or lowers the threshold below the current count, an equality model
      predicts no bark until the counter wraps, while a >= model predicts an immediate bark. Second, the
      cycle at which the interrupt state and pin assert differs depending on assumed latency, including
      the CDC from clk_aon_i to the bus clock. A threshold of 0 is another corner where the two models
      diverge.
    question: Does the bark condition assert when WDOG_COUNT == threshold or when WDOG_COUNT >= threshold,
      including when the count is written above an already-programmed threshold? How many clk_aon_i cycles
      after the condition is met, plus how many bus-clock cycles of synchronization, until INTR_STATE.wdog_timer_bark
      and the interrupt pin assert?
  origin: normalize+review
  severity: medium
  status: candidate
