      text: For such values, disable the timer with WKUP_CTRL while writing the counter.
    gap: Disable the timer through WKUP_CTRL, write a count value close to overflow (for example 0xFFFFFFF0
      in the low word, or near the 64-bit rollover), then re-enable. Check that the counter holds the
      written value without corruption, that no spurious rollover or wakeup occurs, and that the count
      then continues correctly. Also compare against writing the counter without disabling.
