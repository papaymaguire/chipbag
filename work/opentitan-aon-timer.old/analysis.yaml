  detail:
    text: The interrupt retriggers at the next clock tick if the count remains above the threshold after
      clearing and the timer remains enabled.
    note: It is unclear which clock's tick is meant for retriggering.
    impact: A test that clears INTR_STATE/WKUP_CAUSE while the count is still at or above the threshold
      must decide when re-assertion is expected. One engineer would expect it within one AON clock cycle,
      plus CDC sync into the bus clock domain. Another would expect it only at the next prescaled counter
      tick, which is up to WKUP_CTRL.prescaler+1 AON cycles later. With a large prescaler, the expected
      latency and the pass window for re-assertion differ substantially. A check that the interrupt stays
      deasserted for some cycles after clearing would pass under one reading and fail under the other.
    question: After INTR_STATE/WKUP_CAUSE is cleared while the timer is enabled and {WKUP_COUNT_HI, WKUP_COUNT_LO}
      is still at or above WKUP_THOLD, is the next clock tick the next AON clock cycle or the next prescaled
      counter increment? How many AON and bus clock cycles of latency, including CDC synchronization,
      should a test allow before the interrupt and wakeup request re-assert? Is the retrigger condition
      count >= threshold or strictly count > threshold?
  origin: normalize+review
  severity: medium
  status: candidate
