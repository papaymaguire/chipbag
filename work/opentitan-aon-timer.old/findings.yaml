  - path: hw/ip/aon_timer/doc/theory_of_operation.md
    lines: *id001
    text: Bits[31:0] in registers
  - path: hw/ip/aon_timer/doc/theory_of_operation.md
    lines: *id002
    text: WKUP_THOLD_HI
  detail:
    statements:
    - 'WKUP_THOLD_HI.threshold_hi: occupies bits 31:0.'
    - Wakeup threshold bits [31:0] are in the low threshold register.
    difference: req_354691b06277's statement places threshold bits [31:0] in the low threshold register,
      but its own quote cites WKUP_THOLD_HI for bits[31:0]. req_da2a1e056981 defines WKUP_THOLD_HI.threshold_hi
      as bits 31:0 of the HI register. If the threshold is 64 bits split across LO and HI, it is unclear
      whether bits [31:0] of the threshold live in LO or HI, and whether req_da2a1e056981's 31:0 is a
      position within the register or within the threshold.
    question: Does WKUP_THOLD_LO hold threshold bits [31:0] and WKUP_THOLD_HI hold threshold bits [63:32]
      (each field occupying bits 31:0 of its own register), or does WKUP_THOLD_HI hold threshold bits
      [31:0]?
  origin: dedup
  severity: high
  status: verified
  verify:
    outcome: verified
    turns: 3
    cost_usd: 0.050897399999999995
    submissions: 1
    rejections: []
    error: null
    summary: The theory_of_operation.md line 32 says bits[31:0] are in WKUP_THOLD_HI, although its link
      target is wkup_thold_lo. Line 31 of the same file and the hjson say HI holds bits 63:32. This is
      a documentation typo, not a real ambiguity, but the text does contradict itself.
    resolution: The intended mapping is WKUP_THOLD_LO = threshold bits [31:0] and WKUP_THOLD_HI = threshold
      bits [63:32]. The hjson and the link anchor agree with this. I did not check the RTL. Fix the doc
      by changing the visible text on line 32 of theory_of_operation.md from `WKUP_THOLD_HI` to `WKUP_THOLD_LO`.
    evidence:
    - path: hw/ip/aon_timer/doc/theory_of_operation.md
      line_start: 32
      line_end: 32
      quote: Bits[31:0] in registers [`WKUP_COUNT_LO`](registers.md#wkup_count_lo) and [`WKUP_THOLD_HI`](registers.md#wkup_thold_lo).
      role: supports
      note: Text names THOLD_HI for bits 31:0, but the link anchor is wkup_thold_lo (typo).
    - path: hw/ip/aon_timer/doc/theory_of_operation.md
      line_start: 31
      line_end: 31
      quote: Bits[63:32] in registers [`WKUP_COUNT_HI`](registers.md#wkup_count_hi) and [`WKUP_THOLD_HI`](registers.md#wkup_thold_hi).
      role: supports
      note: The previous line puts THOLD_HI at bits 63:32, so the two lines conflict.
    - path: hw/ip/aon_timer/data/aon_timer.hjson
      line_start: 200
      line_end: 211
      quote: "{ name: \"WKUP_THOLD_HI\",\n      desc: \"Wakeup Timer Threshold Register (bits 63 - 32)\"\
        ,"
      role: context
      note: The register description says HI holds bits 63-32. Its field 31:0 is the position within the
        register, not within the 64-bit threshold.
    searches:
    - what: WKUP_THOLD_HI/LO definitions and the doc description
      where: aon_timer.hjson, doc/theory_of_operation.md
      found: 'The hjson is consistent: HI holds bits 63-32 and LO holds bits 31-0. Doc line 32 has a typo
