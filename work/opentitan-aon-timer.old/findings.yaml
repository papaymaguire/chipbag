- id: f_f2608a62b470
  category: spec_ambiguity
  category_no: 1
  type: weak_modal
  title: A watchdog bite reset is generated when the watchdog count reaches the threshold value.
  subject:
    requirements:
    - cr_23458bf5d4fa
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WDOG_BITE_THOLD
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 303
    - 303
    text: The count at which a watchdog bite reset should be generated.
  detail:
    text: A watchdog bite reset is generated when the watchdog count reaches the threshold value.
    note: The text uses 'should be generated' and does not say whether the reset triggers on equality
      or on greater-or-equal.
    impact: 'In normal counting, equality and >= both fire when the count reaches the threshold. They
      diverge when software writes WDOG_COUNT above the threshold (as in aon_timer_jump) or lowers WDOG_BITE_THOLD
      below the current count. A >= model expects an immediate bite; an equality model expects no bite
      until the 32-bit counter wraps around. The scoreboard''s expected bite timing would differ. The
      cycle at which the bite asserts relative to the count update is also unstated: in the same aon cycle
      as the count equals the threshold, or on the following increment. This affects the exact-cycle checks
      in run_wdog_bite_timer. The threshold=0 case (smoke_min_thold) depends on the same rule.'
    question: Is the watchdog bite condition count >= WDOG_BITE_THOLD.threshold or count == threshold?
      If the count is already above a newly programmed threshold, or software writes the count above it,
      does a bite assert immediately? Also, in which clk_aon cycle does the bite request assert relative
      to the count reaching the threshold?
  origin: normalize+review
  severity: medium
  status: verified
  verify:
    outcome: verified
    turns: 5
    cost_usd: 0.04055
    submissions: 1
    rejections: []
    error: null
    summary: No spec text states whether the watchdog bite condition is >= or ==, or the cycle at which
      the bite asserts. The only supporting text is the programmer's guide, which covers the wakeup timer
      only. The RTL uses >= gated by an increment pulse.
    resolution: The RTL asserts the bite when wdog_count >= bite_thold, qualified by the watchdog increment
      pulse. Add that statement to the WDOG_BITE_THOLD description, with the cycle timing relative to
      the count update.
    evidence:
    - path: hw/ip/aon_timer/data/aon_timer.hjson
      line_start: 303
      line_end: 303
      quote: The count at which a watchdog bite reset should be generated.
      role: supports
      note: The register description is the only text for the bite threshold and gives no comparison rule.
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      line_start: 93
      line_end: 93
      quote: remains above the threshold after clearing the interrupt or wakeup event and the timer remains
        enabled, the interrupt and wakeup event will trigger again at the next clock tick.
      role: context
      note: This implies >= behaviour, but only for the wakeup timer. It says nothing about the watchdog
        bite.
    - path: hw/ip/aon_timer/rtl/aon_timer_core.sv
      line_start: 85
      line_end: 85
      quote: assign wdog_reset_req_o = wdog_incr & (reg2hw_i.wdog_count.q >= reg2hw_i.wdog_bite_thold.q);
      role: context
      note: The RTL uses >=, gated by the watchdog increment pulse (wdog_incr). This is design behaviour,
        not spec.
    searches:
    - what: bite, threshold, >= wording in the aon_timer docs
      where: hw/ip/aon_timer/doc
      found: Only generic 'reaches the programmed threshold' text. The wakeup 'remains above' sentence
        is the only >= hint, and it does not cover the watchdog.
    - what: comparison operators in the RTL
      where: hw/ip/aon_timer/rtl
      found: The RTL uses >= for the bite request, gated by wdog_incr.
    near_misses:
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      line_start: 93
      line_end: 93
      why_not: It covers only the wakeup timer, not the watchdog bite, and does not give the cycle timing.
    new_sources: []
    reclassify: null
