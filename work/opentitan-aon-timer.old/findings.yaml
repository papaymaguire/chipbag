- id: f_087fbd904483
  category: spec_ambiguity
  category_no: 1
  type: weak_modal
  title: The count at which a wakeup interrupt should be generated, top 32 bits.
  subject:
    section: sec_936a6dd44a46
    quote: 5d10794f25de
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WKUP_THOLD_HI
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 208
    - 208
    text: The count at which a wakeup interrupt should be generated, top 32 bits.
  detail:
    text: The count at which a wakeup interrupt should be generated, top 32 bits.
    note: '''should be generated'' is a weak modal, and the comparison (equal vs greater-or-equal) and
      timing of the wakeup interrupt are not specified.'
    impact: 'The equal vs greater-or-equal question changes expected results when software programs a
      threshold at or below the current count. Under ''>='', the interrupt fires immediately. Under ''=='',
      it never fires until the counter wraps. A scoreboard predicting interrupt assertion would differ
      between the two readings. The unspecified latency also matters: the threshold crosses from the bus
      clock to clk_aon, so cycle-accurate checks of interrupt or wakeup timing would use different windows.
      Finally, the passage does not say how the 32-bit HI/LO halves combine for the comparison. Engineers
      could differ on stimulus that updates the halves non-atomically.'
    question: Is the wakeup interrupt and wakeup request asserted when the 64-bit count (WKUP_COUNT_HI:LO)
      is greater than or equal to the 64-bit threshold (WKUP_THOLD_HI:LO), or only when equal? Is it asserted
      immediately if the threshold is programmed at or below the current count? How many clk_aon_i cycles
      after the count reaches the threshold does the interrupt/wakeup assert, accounting for the CDC of
      the threshold registers?
  origin: normalize+review
  severity: medium
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.0426252
    submissions: 1
    rejections: []
    error: null
    summary: 'Other spec text answers the comparison and immediate-firing questions: the README says the
      outputs go high when the count is at or above the threshold, on a prescaler tick. The programmer''s
      guide also covers combining the HI and LO halves as one 64-bit value and the non-atomic write hazard.
      Exact CDC latency in clk_aon cycles is not stated, but the main ambiguity is resolved.'
    resolution: The design asserts when count >= threshold, on a prescaler tick. The spec could add the
      CDC latency in clk_aon cycles to the hjson description.
    evidence:
    - path: hw/ip/aon_timer/README.md
      line_start: 35
      line_end: 35
      quote: 'Each time the pre-scaler completes when the count is at or above the threshold, two outputs
        become high:'
      role: refutes
      note: Specifies >= comparison, evaluated on each prescaler tick. So a threshold at or below the
        current count fires at the next tick.
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      line_start: 93
      line_end: 93
      quote: remains above the threshold after clearing the interrupt or wakeup event and the timer remains
        enabled, the interrupt and wakeup event will trigger again at the next clock tick.
      role: refutes
      note: Confirms level-style, re-triggering behaviour on the next tick. The count is treated as one
        64-bit value.
    - path: hw/ip/aon_timer/rtl/aon_timer_core.sv
      line_start: 68
      line_end: 68
      quote: assign wkup_intr_o = wkup_incr & (wkup_count >= wkup_thold);
      role: context
      note: RTL uses >= gated by the prescaler tick, which matches the README.
    searches:
    - what: threshold comparison wording in aon_timer docs
      where: hw/ip/aon_timer/**/*.md
      found: README says 'at or above the threshold'; the programmer's guide covers 64-bit access and
        the interim threshold value.
    - what: '>= in RTL'
      where: hw/ip/aon_timer/rtl
      found: wkup_count >= wkup_thold
    near_misses:
    - path: hw/ip/aon_timer/data/aon_timer.hjson
      line_start: 208
      line_end: 208
      why_not: This is the cited text. It is vague on its own, but other spec documents resolve it.
    new_sources:
    - path: hw/ip/aon_timer/README.md
      reason: States the at-or-above comparison and the prescaler-tick timing.
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      reason: Covers the 64-bit threshold access and the non-atomic write hazard.
    reclassify: null
