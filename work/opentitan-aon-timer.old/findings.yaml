    note: '''should be generated'' is a weak modal and leaves the comparison condition between the count
      and threshold undefined.'
    impact: An engineer assuming '==' and one assuming '>=' would write different checks in two cases.
      One is software lowering the threshold below the current count. The other is count wrapping. Under
      '>=', the interrupt and wakeup request fire immediately (on the next aon tick). Under '==', nothing
      fires until wrap. The latency of the interrupt is also unstated. This includes the prescaler tick
      and the clk_aon_i to clk_i synchronization. Without it, the expected assertion cycle window in the
      scoreboard would differ.
    question: Is the wakeup interrupt/request asserted when the 64-bit wakeup count is greater than or
      equal to {WKUP_THOLD_HI, WKUP_THOLD_LO}, or only when it is exactly equal? Does it fire immediately
      if the threshold is programmed below the current count? What is the maximum latency, in clk_aon_i
      and clk_i cycles, from the count meeting the threshold to intr_wkup_timer_expired_o / wkup_req being
      observed?
  origin: normalize+review
  severity: medium
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.0430332
    submissions: 1
    rejections: []
    error: null
    summary: The aon_timer README says the comparison is "at or above", so it is >=. The programmer's
      guide confirms that a count that stays above the threshold re-triggers on the next tick. The latency
      in clk cycles is not stated, but the finding's main ambiguity is resolved.
    resolution: The design fires when count >= threshold, checked on each prescaler tick. The register
      description could say "at or above" to match the README. A stated CDC latency bound would close
      the remaining gap.
    evidence:
    - path: hw/ip/aon_timer/README.md
      line_start: 35
      line_end: 35
      quote: 'Each time the pre-scaler completes when the count is at or above the threshold, two outputs
        become high:'
      role: refutes
      note: Defines the comparison as >=, evaluated on each prescaler tick, so a threshold below the current
        count fires on the next tick.
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      line_start: 93
      line_end: 93
      quote: the interrupt and wakeup event will trigger again at the next clock tick.
      role: refutes
      note: Confirms level/above behaviour and that triggering happens at the next tick.
    - path: hw/ip/aon_timer/rtl/aon_timer_core.sv
      line_start: 68
      line_end: 68
      quote: assign wkup_intr_o = wkup_incr & (wkup_count >= wkup_thold);
      role: context
      note: The RTL uses >=, matching the README.
    searches:
    - what: threshold comparison wording in the aon_timer docs
      where: hw/ip/aon_timer/**/*.md
