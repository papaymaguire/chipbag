  summary: The repository's generic CSR tests cover this. The common csr_testplan maps the regwen/lockable
    item to the shared csr_rw and csr_aliasing tests. These are enabled per block via csr_tests_mode.
    The RAL models regwen locking by changing lockable fields to read-only after a regwen clear, so csr_rw's
    read-back comparison fails if a lockable CSR stays writable. I did not identify which block the finding
    refers to, so I only confirmed csr_rw is wired into aes and kmac.
