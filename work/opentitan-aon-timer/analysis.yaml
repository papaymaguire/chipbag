- id: f_57c50a9573d0
  category: untested
  category_no: 5
  type: partially_tested
  title: 'Partially tested: 1 requirement(s) in hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WDOG_BITE_THOLD'
  subject:
    requirements:
    - cr_dce064574acf
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WDOG_BITE_THOLD
  items:
  - req_id: cr_dce064574acf
    statement: A watchdog bite triggers a reset; the bite reset is generated when the watchdog count reaches
      WDOG_BITE_THOLD.
    section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WDOG_BITE_THOLD
    spec:
    - path: hw/ip/aon_timer/data/aon_timer.hjson
      lines:
      - 303
      - 303
      text: The count at which a watchdog bite reset should be generated.
    - path: hw/ip/aon_timer/data/aon_timer.hjson
      lines:
      - 153
      - 153
      text: A bite triggers a reset.
    gap: Run the watchdog with mid-range bite thresholds, and make the count reach the threshold deterministically,
      for example by loading the count just below it. Check that the reset request is not asserted before
      the count reaches WDOG_BITE_THOLD and is asserted when it does. Do this in a test that uses a watchdog
      bite, not an escalation reset.
    severity: medium
    tested_by:
    - unit: aon_timer_jump
      rationale: Writes the watchdog count to within 10 of the bark/bite thresholds and enables the watchdog,
        so the count reaches the bite threshold; scoreboard c8 checks the reset_req pin against the modelled
        expectation.
      missing: The test has no checks of its own and only exercises counts near the threshold; whether
        the bite is actually hit depends on the randomisation, and only the scoreboard's model verifies
        the reset.
      cites:
      - path: hw/ip/aon_timer/dv/env/seq_lib/aon_timer_jump_vseq.sv
        lines:
        - 54
        - 54
        text: csr_utils_pkg::csr_wr(ral.wdog_count, wdog_count);
        kind: stimulus
        statement: Write random WDOG count near bark/bite threshold.
      - path: hw/ip/aon_timer/dv/env/seq_lib/aon_timer_jump_vseq.sv
        lines: *id026
        text: csr_utils_pkg::csr_wr(ral.wdog_ctrl.enable, 1'b1);
        kind: stimulus
        statement: Enable WDOG and WKUP timers.
      - path: hw/ip/aon_timer/dv/env/seq_lib/aon_timer_jump_vseq.sv
        lines: *id027
        text: csr_utils_pkg::csr_wr(ral.wkup_ctrl.enable, 1'b1);
        kind: stimulus
        statement: Enable WDOG and WKUP timers.
    - unit: aon_timer_smoke_min_thold
      rationale: Runs the smoke sequence with the bite threshold constrained to 0, with the scoreboard
        model_and_check_wdog_bite (c8) checking the reset request pin against the modelled bite expectation.
      missing: Only the minimum threshold value (0) is exercised; mid-range thresholds are not covered
        here, and the reset request is only checked through the scoreboard model.
      cites:
      - path: hw/ip/aon_timer/dv/env/seq_lib/aon_timer_smoke_min_thold_vseq.sv
        lines:
        - 21
        - 21
        text: wdog_bite_thold == 0;
        kind: stimulus
        statement: Constrain the watchdog bite threshold to 0.
      - path: hw/ip/aon_timer/dv/env/aon_timer_scoreboard.sv
        lines: &id042
        - 1392
        - 1393
        text: '`DV_CHECK_CASE_EQ(wdog_rst_req_exp, cfg.aon_intr_vif.sample_pin(.idx(0)))'
        kind: checker_check
        statement: The reset_req pin (idx 0) must equal the expected watchdog reset request.
        fails_test: 'yes'
        checker_id: ct_9c57e63c5bc4
    - unit: aon_timer_smoke_max_thold
      rationale: Runs the smoke sequence with the bite threshold at its maximum value, with scoreboard
        c8 checking the reset request pin against the modelled bite.
      missing: Only the maximum threshold value is exercised, and the bite may not be reached at that
        value in simulation.
      cites:
      - path: hw/ip/aon_timer/dv/env/seq_lib/aon_timer_smoke_max_thold_vseq.sv
        lines:
        - 21
        - 21
        text: wdog_bite_thold == (2**WDOG_WIDTH-1);
        kind: stimulus
        statement: Constrain watchdog bite threshold to maximum value.
      - path: hw/ip/aon_timer/dv/env/aon_timer_scoreboard.sv
        lines: *id042
        text: '`DV_CHECK_CASE_EQ(wdog_rst_req_exp, cfg.aon_intr_vif.sample_pin(.idx(0)))'
        kind: checker_check
        statement: The reset_req pin (idx 0) must equal the expected watchdog reset request.
        fails_test: 'yes'
        checker_id: ct_9c57e63c5bc4
    - unit: aon_timer_wdog_lc_escalate_test
      rationale: Programs the watchdog bark and bite timeouts and expects an escalation reset; the reset
        reason check is for escalation, not a watchdog bite.
      missing: Does not check that the bite reset is generated when the count reaches the threshold; the
        test checks escalation resets instead.
      cites:
      - path: sw/device/tests/aon_timer_wdog_lc_escalate_test.c
        lines: *id043
        text: aon_timer_testutils_watchdog_config(aon_timer, bark_cycles, bite_cycles,
        kind: stimulus
        statement: Program the watchdog bark and bite timeouts without pausing in sleep.
      - path: sw/device/tests/aon_timer_wdog_lc_escalate_test.c
        lines:
        - 276
        - 276
        text: CHECK(rst_info == kDifRstmgrResetInfoPor ||
        kind: check
        statement: The reset reason must be either POR or escalation.
        fails_test: 'yes'
      - path: sw/device/tests/aon_timer_wdog_lc_escalate_test.c
        lines:
        - 277
        - 277
        text: rst_info == kDifRstmgrResetInfoEscalation,
        kind: check
        statement: The reset reason must be either POR or escalation.
        fails_test: 'yes'
  origin: correlate+triage
  severity: medium
  status: candidate
