  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WKUP_CAUSE
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 363
    - 363
    text: AON timer requested wakeup
  detail:
    text: The cause bit indicates that the AON timer requested a wakeup.
    note: The text does not say which AON timer event (wakeup threshold or watchdog) sets the bit, or
      when it is set.
    impact: From this register alone, one engineer would check only that cause sets when the wakeup counter
      reaches its threshold. Another would also expect it to set on watchdog bark, which is what the existing
      scoreboard predicts. The two would diverge on bark-only scenarios. The register is async to clk_aon_i,
      so the cycle latency before the bit reads as 1 on the bus is also unstated. That changes when a
      read-back check should expect the value. It is equally unclear whether HW keeps re-setting the bit
      while the wakeup condition persists after a write-0, which changes the expected result of clear-then-read
      checks.
    question: 'Which events set WKUP_CAUSE.cause: the wakeup timer threshold match, watchdog bark, watchdog
      bite, or some combination, and is each gated by the corresponding enable? What is the latency in
      clk_aon_i and bus clock cycles before the set is visible to a register read? If SW writes 0 while
      the triggering condition is still true, does HW immediately set the bit again?'
  origin: normalize+review
  severity: high
  status: candidate
