  detail:
    text: If the count remains above the threshold after clearing and the timer stays enabled, the wakeup
      event triggers again at the next clock tick.
    note: It is unclear which clock the 'next clock tick' refers to (AON clock or bus clock) and whether
      it is the prescaled tick.
    impact: A test that clears INTR_STATE or WKUP_CAUSE while the count is still at or above the threshold
      must decide when re-assertion is expected. One reading expects re-assertion within one AON clock
      cycle, plus CDC sync latency into the bus domain. The other waits for the next prescaler tick, which
      can be up to prescaler+1 AON cycles later. These lead to different timing windows and pass criteria
      in the scoreboard. A test that clears just before a prescaler tick and checks the interrupt stays
      low until then would pass under one reading and fail under the other.
    question: After software clears INTR_STATE or WKUP_CAUSE, with the wakeup timer still enabled and
      the count at or above the threshold, when are the interrupt and wakeup request re-asserted? Is it
      the next AON clock cycle (comparison evaluated every AON cycle regardless of prescaler), or the
      next prescaler-derived count tick? What fixed synchronization latency should be expected before
      the bus-side INTR_STATE reflects it? Also, is the condition count >= threshold or count > threshold?
