  text: ".CFG_T(aon_timer_env_cfg),\n    .RAL_T(aon_timer_reg_block),\n    .COV_T(aon_timer_env_cov)\n\
    \  );\n  `uvm_component_utils(aon_timer_scoreboard)\n\n  // local variables\n  local bit  wkup_en;\n\
