    \n  // Access to DUT clock.\n  virtual clk_rst_if clk_rst_vif;\n  // Access to DUT registers.\n  aon_timer_reg_block\
    \ ral;\n\n  timed_reg timed[timed_reg_e];\n\n  // Monotonic, wrapping cycle count; used to detect\
    \ when expectations have not been met.\n  // Incremented in 'check_predictions' task\n  int time_now\
    \ = 0;\n\n  // Perform a read of the actual DUT register state, for checking against expectations.\n\
    \  // Note: we perform a backdoor read to avoid impacting the timing of the DUT and DV.\n  extern\
    \ task read_act_data(timed_reg_e r, output uvm_reg_data_t act_data);\n  // Add a timed, predicted\
    \ state change to the list of expectations for the given register.\n  extern function void predict(timed_reg_e\
    \ r, uvm_reg_data_t prev_data, uvm_reg_data_t new_data);\n  // Check a DUT read from the specified\
