    \ a race condition even if both SYS and\n  // AON clock have the pos-edge at the same time, since\
    \ the variable is used a couple of sys-clock\n  // ticks (or more, depending on CDC crossing) after\
    \ the AON clock cycle because that's when the\n  // interrupt check is carried out.\n  int unsigned\
    \ aon_clk_cycle = 0;\n  int unsigned last_wkup_cause_write_aon_clk_cycle = 0;\n\n  extern function\
    \ new (string name, uvm_component parent);\n  extern function void build_phase(uvm_phase phase);\n\
    \  extern task run_phase(uvm_phase phase);\n  extern function void check_phase(uvm_phase phase);\n\
    \  // Convenience task which keeps count of a given AON clock cycle. Currently only used to\n  //\
    \ distinguish the case when a write to wkup_cause occurs at the same time as a interrupt being\n \
    \ // high\n  extern task track_aon_clk_cycle();\n  // Collects interrupt coverage from RTL interrupts\
