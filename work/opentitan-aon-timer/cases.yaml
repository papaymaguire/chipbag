  text: "task aon_timer_base_vseq::write_wkup_reg(input uvm_object ptr, input uvm_reg_data_t value);\n\
    \  bit we;\n  string path_to_we;\n  csr_field_t csr_or_fld = decode_csr_or_field(ptr);\n\n  if (cfg.under_reset)\
    \ return;\n  if (csr_or_fld.csr == null)\n    `uvm_fatal(`gfn, \"Couldn't decode argument into CSR\
    \ reg\")\n  path_to_we = {\".u_reg.aon_\", csr_or_fld.csr.get_name(), \"_we\"};\n  csr_utils_pkg::csr_wr(ptr,\
    \ value);\n  // Fork killable by reset\n  fork\n    begin : iso_fork\n      fork\n        wait(cfg.under_reset);\n\
    \        begin\n          // After write we wait for WE to go high and then low\n          cfg.wait_for_we_pulse(path_to_we);\n\
    \        end\n      join_any\n      disable fork;\n    end : iso_fork\n  join\n\nendtask : write_wkup_reg"
