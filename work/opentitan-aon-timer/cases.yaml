- path: hw/ip/aon_timer/dv/env/seq_lib/aon_timer_base_vseq.sv
  chunk: aon_timer_base_vseq.sv
  chunk_id: sec_b81701cf3420
  lines:
  - 6
  - 67
  chars:
  - 226
  - 2995
  text: ".RAL_T               (aon_timer_reg_block),\n    .CFG_T               (aon_timer_env_cfg),\n\
    \    .COV_T               (aon_timer_env_cov),\n    .VIRTUAL_SEQUENCER_T (aon_timer_virtual_sequencer)\n\
    \  );\n  `uvm_object_utils(aon_timer_base_vseq)\n\n  // If this is set, the AON clock starts first\
    \ and then the fast clock starts sometime later. If\n  // not, they start in parallel. Since the fast\
    \ clock is *much* quicker, the practical result is\n  // that it starts first.\n  // Currently set\
    \ to 1 always so AON clock always start first. The testbench doesn't correctly\n  // support AON and\
    \ fast clock starting together. Within OpenTitan earlgrey the aon clock is always\n  // active before\
    \ the fast path so the reset_aon_first == 0 mode isn't required. Leaving the\n  // functionality in\
    \ for now whilst we decide if we want to support reset_aon_first == 0 in the\n  // testbench or remove\
    \ this functionality entirely.\n  // rand bit reset_aon_first;\n  bit reset_aon_first = 1;\n\n  //\
    \ Should the escalation signal be enabled at the start of time?\n  rand bit initial_lc_escalate_en;\n\
    \n  // When this is not set, we are locking the configuration registers of watchdog timer after its\n\
    \  // initial setup.\n  rand bit wdog_regwen;\n\n  // Is the chip in sleep at the start of time? In\
    \ the real chip, the answer is (obviously) no, but\n  // the design should work either way so we may\
    \ as well test it.\n  rand bit initial_sleep_mode;\n\n  // Randomize Bark/Bite and Wake-up thresholds\
    \ for the counter\n  rand bit [63:0] wkup_thold;\n  rand bit [31:0] wdog_bark_thold;\n  rand bit [31:0]\
    \ wdog_bite_thold;\n\n  // Randomize Bark/Bite and Wake-up thresholds for the counter\n  rand bit\
    \ [63:0] wkup_count;\n  rand bit [31:0] wdog_count;\n\n  // Used to determine the differenceto initialise\
    \ the counts with respect to the thresholds\n  rand int unsigned wkup_count_gap, wdog_count_gap;\n\
    \  // When set randomisation tries to set the count and threshold so that the bite is likely hit:\n\
    \  rand bit          aim_bite;\n\n  // Used to randomly configure wdog_ctrl.pause_in_sleep\n  rand\
    \ bit          wdog_ctrl_pause_in_sleep;\n\n  // Limits threshold and count values\n  extern constraint\
    \ thold_count_c;\n\n  extern function new (string name=\"\");\n  extern virtual task dut_init(string\
    \ reset_kind = \"HARD\");\n  extern virtual task aon_timer_shutdown();\n  // WDOG and WKUP init tasks\
    \ are split to be able to spawn both processes in parallel\n  extern task wdog_init();\n  extern task\
    \ wkup_init();\n  extern task aon_timer_init();\n  extern virtual task apply_reset(string kind = \"\
    HARD\");\n  extern virtual task apply_resets_concurrently(int reset_duration_ps = 0);\n  extern task\
    \ wait_for_interrupt(bit intr_state_read = 1);\n  extern task write_wkup_reg(input uvm_object ptr,\
    \ input uvm_reg_data_t value);\n\nendclass : aon_timer_base_vseq"
