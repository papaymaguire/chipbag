  text: "endcase\n  `uvm_info(`gfn, $sformatf(\"Backdoor read of reg %p yielded 0x%0x\", r, act_data),\
    \ UVM_HIGH)\nendtask : read_act_data\n\nfunction void aon_timer_intr_timed_regs::predict(timed_reg_e\
    \ r, uvm_reg_data_t prev_data,\n                                                 uvm_reg_data_t new_data);\n\
    \  `uvm_info(`gfn, $sformatf(\"Expecting reg %p <= 0x%0x, from 0x%0x (mask 0x%0x), time_now %0d\"\
    ,\n                            r, new_data, prev_data, prev_data ^ new_data, time_now), UVM_MEDIUM)\n\
    \n  // The interrupts get predicted on:\n  // - neg-edge for counter > threshold predictions and on\n\
    \  // - pos-edge for intr_state/test predictions.\n  // If they occur at the same clock tick there\
    \ will be two (maybe opposite) predictions at the same\n  // time resulting in an error.\n  // The\
    \ RTL prioritises an intr_state/test write over a counter prediction and hence the oldest\n  // prediction\
    \ is removed to model the RTL correctly.\n  // The loop below removes the newest prediction before\
    \ the new one is added.\n  foreach(timed[r].fields[i]) begin\n    int unsigned max_delay = timed[r].fields[i].max_delay;\n\
    \    if ((max_delay + time_now) == timed[r].fields[i].pred_q[$].latest_time) begin\n      `uvm_info(`gfn,\
    \ $sformatf({\"There's already a predicted interrupt at the same time. \",\n                     \
    \            \"Priority is given to latest prediction. Removing old \",\n                        \
    \         \"prediction (%p)\"}, timed[r].fields[i].pred_q[$]), UVM_DEBUG)\n\n      // Popping the\
    \ last predicted item, since the new prediction from intr_state wins"
