  text: "// only a few cycles for internal changes to propagate, but some are substantially longer\n \
    \ // owing to the immediate operation of the functional model.\n  int unsigned max_delay = 5;\n  //\
    \ Capture the initial state of the loosely-timed registers.\n  capture_timed_regs(init_regs);\n\n\
    \  // Remember the register state.\n  prev_timed_regs = init_regs;\n  // Create the register descriptions.\n\
    \  r = r.first();\n  for (int i = 0; i < r.num(); i++) begin\n    timed_reg tr = timed_reg::type_id::create(\"\
    tr\");\n    uvm_reg_data_t init_val = 0;\n    dv_base_reg_field fields[$];\n    // Collect the field\
    \ descriptions for this register.\n    if (!(r inside {aon_timer_intr_timed_regs::TimedIntrStateWdogBark,\n\
    \                    aon_timer_intr_timed_regs::TimedIntrStateWkupExpired}))\n      `uvm_fatal(`gfn,\
    \ \"Invalid/unknown register\")\n    ral.intr_state.get_dv_base_reg_fields(fields);\n\n    // Report\
    \ the initial value of this register as predicted by the BFM.\n    `uvm_info(`gfn, $sformatf(\"Reg\
    \ %p : initial value 0x%0x\", r, init_regs.r[r]), UVM_MEDIUM)\n    // Collect the initial values of\
    \ the register fields, dropping any that we cannot predict.\n    foreach(fields[f]) begin\n      string\
    \ field_name = fields[f].get_name();\n      // Extract the initial value of this register field from\
    \ the modeled register state.\n      uvm_reg_data_t mask = (1 << fields[f].get_n_bits()) - 1;\n  \
    \    init_val = (init_regs.r[r] >> fields[f].get_lsb_pos()) & mask;\n      tr.add_field(fields[f],\
    \ init_val, max_delay);\n      `uvm_info(`gfn, $sformatf(\"Register %p field %s : initially 0x%0x\"\
    , r,\n                                field_name, init_val), UVM_MEDIUM)\n    end\n    timed_regs.timed[r]\
    \ = tr;\n    r = r.next();\n  end\nendfunction : init_timed_regs\n\n//"
