  text: "extern virtual task run_wdog_bark_timer();\n  extern virtual task run_wdog_bite_timer();\n\n\
    \  // Models the wdog_bite/bark behavior and checks the interrupt propagates. It receives by reference\
    \ a\n  // 'predicting_interrupt' flag which gets set when an interrupt is meant to propagate in spite\
    \ of\n  // the timer being disabled.\n  extern task model_and_check_wdog_bite(ref bit predicting_interrupt);\n\
    \  extern task model_and_check_wdog_bark(ref bit predicting_interrupt);\n  // Models the wkup timer\
    \ and checks interrupt propagates, it takes the argument 'predicting_interrupt'\n  // by reference\
    \ for moments in which an interrupt propagates even when the timer has just been disabled.\n  extern\
    \ task model_and_check_wkup(ref bit predicting_interrupt);\n\n  // The three collect_*_coverage below\
    \ tasks run forever and can be safely killed at any time.\n  //\n  // collect_wkup_timer_coverage:\
    \ Whenever the sample_coverage event fires, sample the 64-bit\n  // wkup_count counter, threshold\
    \ value and interrupt for wake_up_timer_thold_hit_cg covergroup.\n  extern task collect_wkup_timer_coverage(event\
    \ sample_coverage);\n  // collect_wdog_bark_timer_coverage: Whenever the sample_coverage event fires,\
    \ sample the 32-bit\n  // wdog_count counter, threshold value and interrupt for watchdog_timer_bark_thold_hit_cg\n\
    \  // covergroup.\n  extern task collect_wdog_bark_timer_coverage(event sample_coverage);\n  // collect_wdog_bite_timer_coverage:\
    \ Whenever the sample_coverage event fires, sample the 32-bit\n  // wdog_count counter, threshold\
    \ value and interrupt for watchdog_timer_bite_thold_hit_cg\n  // covergroup.\n  extern task collect_wdog_bite_timer_coverage(event\
    \ sample_coverage);\n\n  // Sets both predicted timed register (WKUP/WDOG) values, captured from intr_state_exp.\n\
    \  extern function void capture_timed_regs(output bfm_timed_regs_t state);\n  // The argument passed\
    \ by reference `state` stores the value predicted for intr_state for each\n  // type of timer, `r`\
    \ and tmr refer to the type of timer to predict for the timed and the expected\n  // interrupts respectively\n\
    \  extern function void capture_timed_regs_independently(ref bfm_timed_regs_t state,\n           \
    \                                             aon_timer_intr_timed_regs::timed_reg_e r,\n        \
    \                                                timers_e tmr);\n  // Initialise the timed regs (called\
    \ in the build_phase)\n  extern function void init_timed_regs();\n  // need separate wdog/wkup update\
    \ functions in case they are called at the same time\n  extern function void update_timed_regs_independently(timers_e\
    \ tmr);\n  // Update the model side of the WKUP/WDOG(or both) timed registers\n  extern function void\
    \ update_timed_regs();\n  extern function void update_timed_regs_wdog();\n  extern function void update_timed_regs_wkup();\n\
    \n  // Predicts register wkup_cause whenever the busy flag is 0 and blocks other parts of the TB to\n\
    \  // predict it's value until an ongoing prediction finishes\n  // In addition, the prediction can\
    \ be delayed by setting 'wait_for_we' if the TB wants the\n  // prediction to proceed after the wkup_cause\
    \ write crosses the CDC boundary to be in sync with\n  // the RTL.\n  extern task predict_wkup_cause(bit\
    \ wkup_cause, bit wait_for_we);\n  // Predicts register intr_state whenever the busy flag is 0. It\
    \ checks the prediction went through\n  // and blocks other parts of the TB to predict its value until\
    \ an ongoing prediction finishes\n  extern task predict_intr_state(bit [1:0] pred_intr_state, bit\
    \ field_only = 0, bit is_wkup = 0);\n\n  // Update tasks wait for the value to cross CDC boundaries\
    \ by checking the write enable\n  // before the TB starts counting\n  extern task update_wdog_or_wkup_reg_timely(string\
    \ path, timers_e timer_type);\n  extern task update_wdog_count_timely();\n  extern task update_wdog_bite_thold_timely();\n\
    \  extern task update_wdog_bark_thold_timely();\n  extern task update_wkup_count_lo_timely();\n  extern\
    \ task update_wkup_count_hi_timely();\n  extern task update_wkup_thold_lo_timely();\n  extern task\
    \ update_wkup_thold_hi_timely();\n\n  // Pushes predicted values for wdog/wkup_interrupt in a queue\
    \ and keeps track of the RTL until\n  // the committed value propagates and becomes the register value\n\
    \  extern task wkup_intr_predicted_values(bit exp_wkup_intr);\n  extern task wdog_intr_predicted_values(bit\
    \ exp_wdog_intr);"
