- id: f_6bf289f534a0
  category: spec_contradiction
  category_no: 2
  type: description_vs_definition
  title: The sentence says reads are synchronized, but the following text describes the effect on writes.
  subject:
    requirements:
    - cr_eadb3b6bb9a2
  spec:
  - path: hw/ip/aon_timer/doc/theory_of_operation.md
    lines:
    - 25
    - 25
    text: Register reads via the TL-UL interface (SYS domain) are synchronized to the slow clock (AON
      domain) using the "async" register generation feature.
  detail:
    statement: TL-UL register accesses from the SYS domain are synchronized to the AON slow clock using
      the async register generation feature.
    note: The sentence says reads are synchronized, but the following text describes the effect on writes.
    question: Does the async synchronization apply to register writes, reads, or both?
  origin: normalize
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 3
    cost_usd: 0.0446308
    submissions: 1
    rejections: []
    error: null
    summary: 'The cited spec line says "Register reads ... are synchronized", not all accesses. The following
      sentences say writes can complete early, and a read-back guarantees completion of earlier writes.
      These fit together: the async interface crosses domains, and a read-back waits for it. The only
      issue is loose wording, which is not two incompatible statements. I did not inspect the RTL.'
    resolution: No contradiction. Optionally reword line 25 to "Register accesses ... are synchronized".
      I did not check the RTL, so I cannot say which side it matches.
    evidence:
    - path: hw/ip/aon_timer/doc/theory_of_operation.md
      line_start: 25
      line_end: 28
      quote: This means that writes can complete before the data has reached its underlying register in
        the slow clock domain.
      role: refutes
      note: 'The text consistently describes async register behaviour: writes complete early, and a read-back
        guarantees completion. This is not a contradiction.'
    searches:
    - what: Read the cited paragraph in context
      where: hw/ip/aon_timer/doc/theory_of_operation.md
      found: Line 25 says reads are synchronized; lines 26-28 describe the write-completion consequence
        and read-back.
    near_misses:
    - path: hw/ip/aon_timer/doc/theory_of_operation.md
      line_start: 25
      line_end: 25
      why_not: The wording 'Register reads' is imprecise, since async generation covers all accesses,
        but it does not contradict the next sentences.
    new_sources: []
    reclassify: null
