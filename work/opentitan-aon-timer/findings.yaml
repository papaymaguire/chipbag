      line_end: 49
      why_not: The sequence does not itself read WKUP_COUNT, but the scoreboard covers the timing check.
    new_sources:
    - path: hw/ip/aon_timer/dv/env/aon_timer_scoreboard.sv
      reason: Holds the expected-time check for the wakeup interrupt using the prescaler.
    reclassify: null
