    cost_usd: 0.029454699999999997
    submissions: 1
    rejections: []
    error: null
    summary: 'The aon_timer README states the bark condition: bark fires on every AON clock tick while
      the timer is enabled and the count is at least WDOG_BARK_THOLD. That is a >= condition that stays
      asserted. It answers the finding''s question.'
    resolution: The spec already says bark is raised on every AON tick while the count is >= the threshold.
      A pointer from the register description to the README would make this easier to find.
    evidence:
