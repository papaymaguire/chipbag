  detail:
    text: A watchdog bark interrupt is generated when the watchdog count reaches the threshold value.
    note: The text does not say whether the bark fires on equality or on greater-or-equal, and it uses
      the weak wording 'should'.
    impact: In the normal case, where the count increments up to the threshold, both readings give the
      same result. They differ when software writes a threshold below the current count, or when the count
      is written above the threshold. Under a '>=' model the scoreboard predicts the bark immediately.
      Under an '==' model it predicts no bark until the count wraps. The two readings also disagree on
      whether bark stays asserted while the count remains above the threshold. Reference models and checks
      built on each reading would conflict, and the existing max-threshold test does not exercise this
      case.
    question: Is the watchdog bark condition defined as count == threshold or count >= threshold? If the
      threshold is programmed below the current count, or the count is written above the threshold, does
      bark assert immediately, on which cycle, and does it remain asserted?
  origin: normalize+review
