- id: f_c17ea0faef77
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: The prescaler field holds the pre-scaler value for the wakeup timer count.
  subject:
    requirements:
    - cr_29f17b8f82d2
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WKUP_CTRL
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 195
    - 195
    text: Pre-scaler value for wakeup timer count
  detail:
    text: The prescaler field holds the pre-scaler value for the wakeup timer count.
    note: The relationship between the prescaler value and the count rate is not specified.
    impact: The scoreboard's expected wakeup interrupt time depends on whether the counter increments
      every prescaler cycles or every prescaler+1 clk_aon cycles. With prescaler=0 it is either one tick
      per cycle or a divide-by-zero or hold. Two engineers would predict different interrupt cycles and
      different wkup_count values over time.
    question: With prescaler=N, how many clk_aon_i cycles pass between WKUP_COUNT increments (N+1 or N)?
      What happens when N=0?
  origin: normalize+review
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 3
    cost_usd: 0.0227287
    submissions: 1
    rejections: []
    error: null
    summary: 'The aon_timer README states that the number of cycles per tick is one more than the prescaler
      field. That answers the question: N+1 cycles per increment, and N=0 means one tick per cycle.'
    resolution: 'Add the README sentence to the WKUP_CTRL.prescaler field description in aon_timer.hjson:
      the counter increments every prescaler+1 clk_aon cycles, and prescaler=0 gives one tick per cycle.'
    evidence:
    - path: hw/ip/aon_timer/README.md
      line_start: 31
      line_end: 32
      quote: The number of cycles per tick is one more than the 12-bit [`WKUP_CTRL.prescaler`](doc/registers.md#wkup_ctrl)
        field.
      role: refutes
      note: Defines the count rate as prescaler+1 clk_aon cycles per tick, so prescaler=0 gives one tick
        per cycle.
    searches:
    - what: prescaler / pre-scaler text in aon_timer docs and hjson
      where: hw/ip/aon_timer
      found: README.md lines 31-32 specify the N+1 cycles per tick relationship
    near_misses: []
    new_sources:
    - path: hw/ip/aon_timer/README.md
      reason: Specifies the prescaler to tick relationship (N+1 cycles per tick).
    reclassify: null
- id: f_c7ed49ba3834
  category: spec_ambiguity
  category_no: 1
  type: missing_detail
  title: The cause bit indicates that the AON timer requested a wakeup.
  subject:
    requirements:
    - cr_4f0006fef572
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WKUP_CAUSE
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 363
    - 363
    text: AON timer requested wakeup
  detail:
    text: The cause bit indicates that the AON timer requested a wakeup.
    note: The text does not say which AON timer event (wakeup threshold or watchdog) sets the bit, or
      when it is set.
    impact: From this register alone, one engineer would check only that cause sets when the wakeup counter
      reaches its threshold. Another would also expect it to set on watchdog bark, which is what the existing
      scoreboard predicts. The two would diverge on bark-only scenarios. The register is async to clk_aon_i,
      so the cycle latency before the bit reads as 1 on the bus is also unstated. That changes when a
      read-back check should expect the value. It is equally unclear whether HW keeps re-setting the bit
      while the wakeup condition persists after a write-0, which changes the expected result of clear-then-read
      checks.
    question: 'Which events set WKUP_CAUSE.cause: the wakeup timer threshold match, watchdog bark, watchdog
      bite, or some combination, and is each gated by the corresponding enable? What is the latency in
      clk_aon_i and bus clock cycles before the set is visible to a register read? If SW writes 0 while
      the triggering condition is still true, does HW immediately set the bit again?'
  origin: normalize+review
  severity: high
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.0368766
    submissions: 1
    rejections: []
    error: null
    summary: 'The README says which events set the cause bit: the wakeup threshold match and the watchdog
      bark. Bite is not listed. It also says what happens after a write-0 clear. Only the exact cycle
      latency is not given.'
    resolution: The README answers the event sources and the re-assertion behaviour. The remaining gap
      is the cross-domain latency, which could be added to the register description or the programmer's
      guide.
    evidence:
    - path: hw/ip/aon_timer/README.md
      line_start: 35
      line_end: 44
      quote: 'Each time the pre-scaler completes when the count is at or above the threshold, two outputs
        become high:'
      role: refutes
      note: The wakeup threshold match asserts wkup_req_o. The same text says the signal is also asserted
        by a watchdog bark and stays high until SW writes 0 to WKUP_CAUSE. It also says the signals are
        re-asserted at the next prescaler completion unless the counter is cleared. That answers the clear-then-read
        question.
    - path: hw/ip/aon_timer/README.md
      line_start: 69
      line_end: 77
      quote: 'When there is a "bark" event, two outputs become high:'
      role: refutes
      note: A watchdog bark also raises wkup_req_o, which stays high until SW writes 0 to WKUP_CAUSE.
        A bark therefore sets the cause bit. This settles the bark-only scenario.
    - path: hw/ip/aon_timer/data/aon_timer.hjson
      line_start: 363
      line_end: 363
      quote: 'desc: "AON timer requested wakeup, write 0 to clear.",'
      role: context
      note: The register description is terse, as the finding says.
    searches:
    - what: WKUP_CAUSE in the aon_timer docs
      where: hw/ip/aon_timer/**/*.md
      found: README.md, doc/programmers_guide.md and dv/README.md describe the event sources and the clearing
        behaviour.
    near_misses:
    - path: hw/ip/aon_timer/README.md
      line_start: 82
      line_end: 84
      why_not: The watchdog bite section describes a separate output. It does not say whether bite sets
        WKUP_CAUSE. The bark and wakeup sections do say bark and the wakeup threshold set it.
    new_sources:
    - path: hw/ip/aon_timer/README.md
      reason: Describes which events assert wkup_req_o and how software clears it.
    reclassify: null
- id: f_1bc5edd4d321
  category: spec_ambiguity
  category_no: 1
  type: weak_modal
  title: The count at which a wakeup interrupt should be generated, bottom 32 bits.
  subject:
    section: sec_05476ea7e547
    quote: c0ef738df28b
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > WKUP_THOLD_LO
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines:
    - 220
    - 220
    text: The count at which a wakeup interrupt should be generated, bottom 32 bits.
  detail:
    text: The count at which a wakeup interrupt should be generated, bottom 32 bits.
    note: '''should be generated'' is a weak modal, and the exact comparison (equal, or greater than or
      equal) that triggers the wakeup interrupt is not stated.'
    impact: The checks diverge when software programs a threshold at or below the current WKUP_COUNT,
      or when the count passes the threshold. An equality-based model expects no interrupt until the counter
      wraps the full 64-bit range. A greater-than-or-equal model expects the interrupt immediately and
      expects it to persist or re-assert while count >= threshold. This changes the expected intr_wkup_timer_expired
      and wakeup request timing in the scoreboard, and the pass criteria for threshold-update tests.
    question: Is the wakeup interrupt/wakeup request asserted when the 64-bit WKUP_COUNT is greater than
      or equal to {WKUP_THOLD_HI, WKUP_THOLD_LO}, or only when it is exactly equal? Does it remain asserted
      (re-triggering after a clear) on every cycle while the condition holds?
  origin: normalize+review
  severity: medium
  status: withdrawn
  verify:
    outcome: withdrawn
    turns: 5
    cost_usd: 0.0514723
    submissions: 1
    rejections: []
    error: null
    summary: The README and programmer's guide say the wakeup interrupt fires when the count is at or
      above the threshold, on each prescaler tick, and re-triggers after a clear while the count stays
      above it. This answers the question, so the ambiguity in the register description is resolved elsewhere
      in the spec.
    resolution: The design uses >= and re-asserts on each tick while the count is at or above the threshold.
      The register description could add 'when the count is greater than or equal to this value' to say
      so directly.
    evidence:
    - path: hw/ip/aon_timer/README.md
      line_start: 35
      line_end: 35
      quote: 'Each time the pre-scaler completes when the count is at or above the threshold, two outputs
        become high:'
      role: refutes
      note: States the comparison is at-or-above (>=), and the trigger is on each prescaler completion.
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      line_start: 93
      line_end: 93
      quote: the interrupt and wakeup event will trigger again at the next clock tick.
      role: refutes
      note: States the interrupt re-triggers after being cleared while the count remains above the threshold.
    - path: hw/ip/aon_timer/rtl/aon_timer_core.sv
      line_start: 68
      line_end: 68
      quote: assign wkup_intr_o = wkup_incr & (wkup_count >= wkup_thold);
      role: context
      note: The RTL implements >=, matching the documented behaviour.
    searches:
    - what: Wording on threshold comparison in aon_timer docs
      where: hw/ip/aon_timer/*.md and doc/
      found: README says 'at or above'; programmers_guide says it re-triggers while the count stays above
        the threshold
    - what: Threshold comparison in RTL
      where: hw/ip/aon_timer/rtl
      found: wkup_count >= wkup_thold
    near_misses: []
    new_sources:
    - path: hw/ip/aon_timer/README.md
      reason: States the at-or-above comparison for the wakeup threshold.
    - path: hw/ip/aon_timer/doc/programmers_guide.md
      reason: States the interrupt re-triggers while the count stays above the threshold.
    reclassify: null
- id: f_483ce24e65e4
  category: spec_ambiguity
  category_no: 1
  type: unclear_referent
  title: The policy selection vector parameter selects the RACL policy applied to each register.
  subject:
    requirements:
    - cr_d3bb7e9459e0
  section: hw/ip/aon_timer/data/aon_timer.hjson > aon_timer > inter_signal_list
  spec:
  - path: hw/ip/aon_timer/data/aon_timer.hjson
    lines: &id099
    - 116
    - 116
    text: The policy selection vector (parameter) selects the policy for each register.
  - path: hw/ip/aon_timer/doc/interfaces.md
    lines: &id100
    - 20
    - 20
    text: The policy selection vector (parameter) selects the policy for each register.
  detail:
    text: The policy selection vector parameter selects the RACL policy applied to each register.
    note: The parameter is not named, and the selection encoding is not given.
    impact: RACL access-control tests must know which policy index governs each aon_timer register to
      predict whether an access is allowed or blocked. Without the parameter name and its encoding, one
