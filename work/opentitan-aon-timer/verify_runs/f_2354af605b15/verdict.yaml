  summary: The test is implemented and listed in the chip regressions, so it is not planned-only. The
    firmware arms the watchdog bark and bite inside escalation phase 1, then forces an alert and escalates.
    It fails if the wrong reset reason appears after the escalation reset. A bite that got through would
    give a watchdog reset reason and fail that check. The check is indirect, because the bark ISR only
    logs an error.
