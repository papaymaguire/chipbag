      \                                          /*pause_in_sleep=*/false));"
    role: refutes
    note: 'Stimulus: the watchdog is armed, then an alert is forced so the alert handler escalates before
      bark and bite. The bark and bite times fall inside phase 1, as the file''s static_assert requires.'
  - path: sw/device/tests/aon_timer_wdog_lc_escalate_test.c
