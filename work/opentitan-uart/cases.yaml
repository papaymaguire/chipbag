    \n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic, dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqRxTimeout),\
    \ kPlicTarget,\n      kDifToggleEnabled));\n\n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic,\
    \ dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqRxParityErr), kPlicTarget,\n      kDifToggleEnabled));\n\
    }\n\n/**\n * Continue ongoing transmission of bytes.\n *\n * This is a wrapper around `dif_uart_bytes_send|receive()`\
    \ functions. It picks\n * up an ongoing transfer of data starting at `dataset_index` location until\n\
    \ * the UART can no longer accept any more data to be sent / return any more\n * data received, depending\
    \ on the direction of the data transfer indicated with\n * the `uart_direction` argument. It uses\
    \ the `bytes_written` / `bytes_read`\n * value to advance the `dataset_index` for the next round.\
    \ It updates the\n * `transfer_done` arg to indicate if the ongoing transfer has completed.\n */\n\
    static bool uart_transfer_ongoing_bytes(const dif_uart_t *uart,\n                                \
    \        uart_direction_t uart_direction,\n                                        uint8_t *data,\
    \ size_t dataset_size,\n                                        size_t *dataset_index,\n         \
    \                               size_t max_xfer_size,\n                                        bool\
    \ *transfer_done) {\n  size_t bytes_remaining = dataset_size - *dataset_index;\n  size_t bytes_to_xfer\
    \ =\n      max_xfer_size < bytes_remaining ? max_xfer_size : bytes_remaining;\n  size_t bytes_transferred\
    \ = 0;\n  bool result = false;\n  switch (uart_direction) {\n    case kUartSend:\n      result = dif_uart_bytes_send(uart,\
    \ &data[*dataset_index], bytes_to_xfer,\n                                   &bytes_transferred) ==\
    \ kDifOk;\n\n      CHECK_DIF_OK(dif_uart_irq_set_enabled(uart, kDifUartIrqTxWatermark,\n         \
    \                                   kDifToggleEnabled));\n      CHECK_DIF_OK(dif_uart_irq_set_enabled(uart,\
    \ kDifUartIrqTxEmpty,\n                                            kDifToggleEnabled));\n      break;\n\
    \    case kUartReceive:\n      result =\n          dif_uart_bytes_receive(uart, bytes_to_xfer, &data[*dataset_index],\n\
    \                                 &bytes_transferred) == kDifOk;\n\n      CHECK_DIF_OK(dif_uart_irq_set_enabled(uart,\
    \ kDifUartIrqRxWatermark,\n                                            kDifToggleEnabled));\n    \
    \  break;\n    default:\n      LOG_FATAL(\"Invalid UART data transfer direction!\");\n  }\n  *dataset_index\
    \ += bytes_transferred;\n  *transfer_done = *dataset_index == dataset_size;\n  return result;\n}\n\
    \nstatic void execute_test(const dif_uart_t *uart) {\n  bool uart_tx_done = false;\n  size_t uart_tx_bytes_written\
    \ = 0;\n  exp_uart_irq_tx_watermark = true;\n  exp_uart_irq_tx_empty = true;\n  // Set the flag below\
    \ to true to allow TX data to be sent the first time in\n  // the if condition below. Subsequently,\
    \ TX watermark interrupt will trigger\n  // more data to be sent.\n  uart_irq_tx_watermark_fired =\
    \ true;\n  exp_uart_irq_tx_done = false;\n  uart_irq_tx_done_fired = false;\n\n  bool uart_rx_done\
    \ = false;\n  size_t uart_rx_bytes_read = 0;\n  exp_uart_irq_rx_watermark = true;\n  // Set the flag\
    \ below to true to allow RX data to be received the first time\n  // in the if condition below. Subsequently,\
