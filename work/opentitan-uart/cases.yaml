  text: "function bit is_in_ignored_period(uart_dir_e dir);\n    case (dir)\n      UartTx: return uart_tx_clk_pulses\
    \ inside `TX_IGNORED_PERIOD;\n      UartRx: return uart_rx_clk_pulses inside `RX_IGNORED_PERIOD;\n\
    \    endcase\n  endfunction\n\n  virtual task process_tl_access(tl_seq_item item, tl_channels_e channel,\
    \ string ral_name);\n    uvm_reg csr;\n    bit     do_read_check   = 1'b1;\n    bit     write    \
    \       = item.is_write();\n    uvm_reg_addr_t csr_addr = cfg.ral_models[ral_name].get_word_aligned_addr(item.a_addr);\n\
    \n    csr = cfg.ral_models[ral_name].get_default_map().get_reg_by_offset(csr_addr);\n    if (csr ==\
    \ null) begin\n      `uvm_fatal(`gfn, $sformatf(\"Access unexpected addr 0x%0h\", csr_addr))\n   \
    \ end\n\n    if (channel == AddrChannel) begin\n      // if incoming access is a write to a valid\
    \ csr, then make updates right away\n      if (write) begin\n        void'(csr.predict(.value(item.a_data),\
    \ .kind(UVM_PREDICT_WRITE), .be(item.a_mask)));\n      end\n\n      // need to store uart_tx/tx_clk_pulses\
    \ earlier to predict reg value correctly\n      uart_tx_clk_pulses   = uart_vif.uart_tx_clk_pulses;\n\
    \      uart_rx_clk_pulses   = uart_vif.uart_rx_clk_pulses;\n      // save fifo level at address phase\n\
    \      tx_q_size_at_addr_phase = tx_q.size;\n      rx_q_size_at_addr_phase = rx_q.size;\n    end\n\
    \n    // process the csr req\n    // for write, update local variable and fifo at address phase\n\
    \    // for read, update prediction at address phase and compare at data phase\n    case (csr.get_name())\n\
    \      \"ctrl\": begin\n        if (write && channel == AddrChannel) begin\n          if (cfg.en_cov)\
    \ begin\n            cov.baud_rate_w_core_clk_cg.sample(cfg.m_uart_agent_cfg.baud_rate, cfg.clk_freq_mhz);\n\
    \          end\n\n          tx_enabled = ral.ctrl.tx.get_mirrored_value();\n          rx_enabled =\
    \ ral.ctrl.rx.get_mirrored_value();\n\n          if ((tx_q.size > 0 || tx_processing_item_q.size >\
    \ 0) && tx_enabled) begin\n            if (tx_q.size > 0 && tx_processing_item_q.size == 0) begin\n\
    \              tx_processing_item_q.push_back(tx_q.pop_front());\n              fork begin\n     \
    \           int loc_tx_q_size = tx_q.size();\n                cfg.clk_rst_vif.wait_n_clks(NUM_CLK_DLY_TO_UPDATE_TX_WATERMARK);\n\
    \                predict_tx_watermark_intr(loc_tx_q_size);\n              end join_none\n        \
    \    end\n          end\n        end\n      end\n      \"wdata\": begin\n        // if tx is enabled,\
    \ push exp tx data to q\n        if (write && channel == AddrChannel) begin\n          uart_item tx_item\
    \ = uart_item::type_id::create(\"tx_item\");\n\n          fork begin\n            int loc_tx_q_size;\n\
    \            bit dec_q_size;\n\n            // Don't update tx_q til next negedge. The TX FIFO doesn't\
    \ get written til the cycle\n            // after the write transaction so an immediate read of 'fifo_status'\
    \ after the write\n            // doesn't see the increased depth. Waiting here ensures this is modeled\
    \ correctly.\n            cfg.clk_rst_vif.wait_n_clks(1);\n\n            tx_item.data = item.a_data;\n\
    \            if (tx_q.size() < TxFifoDepth) begin\n              tx_q.push_back(tx_item);\n      \
    \        `uvm_info(`gfn, $sformatf(\"After push one item, tx_q size: %0d\", tx_q.size), UVM_HIGH)\n\
    \            end else begin\n              `uvm_info(`gfn, $sformatf(\n                  \"Drop tx\
    \ item: %0h, tx_q size: %0d, uart_tx_clk_pulses: %0d\",\n                  csr.get_mirrored_value(),\
    \ tx_q.size(), uart_tx_clk_pulses), UVM_MEDIUM)\n            end\n\n            loc_tx_q_size = tx_q.size();\n\
    \            dec_q_size = 1'b0;\n            // remove 1 when it's abort to be popped for transfer\n\
    \            if (tx_enabled && tx_processing_item_q.size == 0 && tx_q.size > 0) begin\n          \
    \    // Must decide if we're reducing the queue size used for watermark modelling now based\n    \
    \          // upon the tx_q size immediately after the push. The actual watermark prediction\n   \
    \           // occurs after update delay\n              dec_q_size = 1'b1;\n            end\n\n  \
    \          // use negedge to avoid race condition with -1 as we've already waited a cycle above.\n\
    \            cfg.clk_rst_vif.wait_n_clks(NUM_CLK_DLY_TO_UPDATE_TX_WATERMARK - 1);\n            if\
    \ (ral.ctrl.slpbk.get_mirrored_value()) begin\n              // if sys loopback is on, tx item isn't\
    \ sent to uart pin but rx fifo\n              uart_item tx_item = tx_q.pop_front();\n            \
    \  if (rx_enabled && (rx_q.size < RxFifoDepth)) begin\n                rx_q.push_back(tx_item);\n\
    \                predict_rx_watermark_intr();\n              end\n            end else if (tx_enabled\
    \ && tx_processing_item_q.size == 0 && tx_q.size > 0) begin\n              tx_processing_item_q.push_back(tx_q.pop_front());\n\
    \            end\n\n            if (dec_q_size) begin\n              // Predict the TX watermark/empty\
    \ interrupts before waiting and decrementing\n              // to model the scenario where: a TX watermark\
    \ (or empty) interrupt is briefly\n              // triggered due to the TX FIFO level going above\
    \ the watermark threshold (or zero),\n              // then dropping below again one cycle later when\
    \ the TX item gets popped.\n              predict_tx_watermark_intr(loc_tx_q_size);\n            \
    \  cfg.clk_rst_vif.wait_n_clks(1);\n              loc_tx_q_size--;\n            end\n\n          \
    \  predict_tx_watermark_intr(loc_tx_q_size);\n          end join_none\n        end // write && channel\
    \ == AddrChannel\n      end\n      \"fifo_ctrl\": begin\n        if (write && channel == AddrChannel)\
    \ begin\n          // these fields are WO\n          bit txrst_val = bit'(get_field_val(ral.fifo_ctrl.txrst,\
    \ item.a_data));\n          bit rxrst_val = bit'(get_field_val(ral.fifo_ctrl.rxrst, item.a_data));\n\
    \          if (txrst_val) begin\n            if (tx_enabled && tx_q.size > 0 && tx_processing_item_q.size\
    \ == 0) begin\n              // keep the 1st item in the queue, as it's being sent\n             \
    \ tx_processing_item_q.push_back(tx_q.pop_front());\n            end\n            tx_q.delete();\n\
    \            void'(ral.fifo_ctrl.txrst.predict(.value(0), .kind(UVM_PREDICT_WRITE)));\n          \
    \  if (cfg.en_cov) begin\n              cov.tx_fifo_level_cg.sample(.lvl(ral.fifo_status.txlvl.get_mirrored_value()),\n\
    \                                          .rst(1));\n            end\n          end\n          if\
    \ (rxrst_val) begin\n            rx_q.delete();\n            void'(ral.fifo_ctrl.rxrst.predict(.value(0),\
    \ .kind(UVM_PREDICT_WRITE)));\n            if (cfg.en_cov) begin\n              cov.rx_fifo_level_cg.sample(.lvl(ral.fifo_status.rxlvl.get_mirrored_value()),\n\
    \                                          .rst(1));\n            end\n          end\n          //\
    \ recalculate watermark when RXILVL/TXILVL is updated\n          predict_rx_watermark_intr();\n  \
    \        fork begin\n            int loc_tx_q_size = tx_q.size();\n            if (txrst_val) cfg.clk_rst_vif.wait_n_clks(NUM_CLK_DLY_TO_UPDATE_TX_WATERMARK);\n\
    \            predict_tx_watermark_intr(loc_tx_q_size);\n          end join_none\n        end // write\
    \ && channel == AddrChannel\n      end\n      \"intr_test\": begin\n        if (write && channel ==\
    \ AddrChannel) begin\n          bit [TL_DW-1:0] intr_en = ral.intr_enable.get_mirrored_value();\n\
    \          // TxWatermark and RxWatermark are status type interrupts. When `intr_test` is set for\n\
    \          // these interrupts it acts as if the status for the interrupt is true. In turn when\n\
    \          // `intr_test` is cleared the interrupt will drop, but only if the underlying status isn't\n\
    \          // true. So record what's been written to `intr_test` for status type interrupts here and\n\
    \          // then call the prediction functions for those interrupts to determine the interrupt\n\
    \          // status.\n          status_intr_test[TxWatermark] = item.a_data[TxWatermark];\n     \
    \     status_intr_test[TxEmpty] = item.a_data[TxEmpty];\n          status_intr_test[RxWatermark] =\
    \ item.a_data[RxWatermark];\n\n          intr_exp |= item.a_data;\n\n          predict_tx_watermark_intr();\n\
    \          predict_rx_watermark_intr();\n\n          if (cfg.en_cov) begin\n            foreach (intr_exp[i])\
    \ begin\n              cov.intr_test_cg.sample(i, item.a_data[i], intr_en[i], intr_exp[i]);\n    \
    \        end\n          end\n        end\n      end"
