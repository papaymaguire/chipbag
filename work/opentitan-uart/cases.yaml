    \ kDtUartIrqRxWatermark), 0x2));\n  CHECK_DIF_OK(dif_rv_plic_irq_set_priority(\n      plic, dt_uart_irq_to_plic_id(uart_dt,\
    \ kDtUartIrqTxDone), 0x3));\n  CHECK_DIF_OK(dif_rv_plic_irq_set_priority(\n      plic, dt_uart_irq_to_plic_id(uart_dt,\
    \ kDtUartIrqRxOverflow), 0x1));\n  CHECK_DIF_OK(dif_rv_plic_irq_set_priority(\n      plic, dt_uart_irq_to_plic_id(uart_dt,\
    \ kDtUartIrqRxFrameErr), 0x2));\n  CHECK_DIF_OK(dif_rv_plic_irq_set_priority(\n      plic, dt_uart_irq_to_plic_id(uart_dt,\
    \ kDtUartIrqRxBreakErr), 0x3));\n  CHECK_DIF_OK(dif_rv_plic_irq_set_priority(\n      plic, dt_uart_irq_to_plic_id(uart_dt,\
    \ kDtUartIrqRxTimeout), 0x1));\n  CHECK_DIF_OK(dif_rv_plic_irq_set_priority(\n      plic, dt_uart_irq_to_plic_id(uart_dt,\
    \ kDtUartIrqRxParityErr), 0x2));\n\n  // Set the threshold for the Ibex to 0.\n  CHECK_DIF_OK(dif_rv_plic_target_set_threshold(plic,\
    \ kPlicTarget, 0x0));\n\n  // Enable all UART interrupts at the PLIC.\n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n\
    \      plic, dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqTxWatermark), kPlicTarget,\n      kDifToggleEnabled));\n\
    \n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic, dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqTxEmpty),\
    \ kPlicTarget,\n      kDifToggleEnabled));\n\n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic,\
    \ dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqRxWatermark), kPlicTarget,\n      kDifToggleEnabled));\n\
    \n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic, dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqTxDone),\
    \ kPlicTarget,\n      kDifToggleEnabled));\n\n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic,\
    \ dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqRxOverflow), kPlicTarget,\n      kDifToggleEnabled));\n\
    \n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic, dt_uart_irq_to_plic_id(uart_dt, kDtUartIrqRxFrameErr),\
    \ kPlicTarget,\n      kDifToggleEnabled));\n\n  CHECK_DIF_OK(dif_rv_plic_irq_set_enabled(\n      plic,\
