  - 14281
  text: "// Wait until the device is about to timeout (timeout_val-2 cycles) and then\n        // read\
    \ or drive uart RX items to reset timeout count. More FIFO reads than FIFO writes.\n        // Repeat\
    \ until FIFO is empty. Timeout should never occur.\n        // Delay relative to last timeout reset\
    \ so subsequent CSR reads do not affect total delay.\n        // Timeout value can increment in a\
    \ fraction of the expected one baud-clock cycle with\n        // unlucky FIFO read or RX start timing,\
    \ and both can happen between timeout resets\n        // (hence the need for timeout_val-2 rather\
    \ than timeout_val-1).\n        forever begin\n          bit rxempty;\n          bit rxfull;\n   \
    \       randcase\n            5: begin // read one or more RX items (fifo read)\n              csr_rd(.ptr(ral.status.rxempty),\
    \ .value(rxempty));\n              if (rxempty) break; // exit forever\n              // use -2 to\
    \ have higher tolerance to avoid timeout\n              wait_until_baud_clock_cycles_after(timeout_val\
    \ - 2, timeout_last_reset);\n              // Read more than one byte most of the time to reduce max\
    \ runtime\n              repeat ($urandom_range(RxFifoDepth >> 2, 1)) begin\n                timeout_last_reset\
    \ = $realtime;\n                csr_rd(.ptr(ral.rdata), .value(rdata));\n                csr_rd(.ptr(ral.status.rxempty),\
    \ .value(rxempty));\n                if (rxempty) break; // exit repeat\n              end\n     \
    \       end\n            1: begin // drive one RX item (fifo write)\n              // use -2 to have\
    \ higher tolerance to avoid timeout\n              int cycles = timeout_val - bit_num_per_trans -\
    \ 2;\n              wait_until_baud_clock_cycles_after(cycles > 0 ? cycles : 0, timeout_last_reset);\n\
    \              csr_rd(.ptr(ral.status.rxfull), .value(rxfull));\n              // it won't reset timeout\
    \ timer if receiving a rx item when fifo is full\n              if (rxfull) begin\n              \
    \  timeout_last_reset = $realtime; // timeout resets upon FIFO read request\n                csr_rd(.ptr(ral.rdata),\
    \ .value(rdata));\n              end else begin\n                drive_rx_bytes(.num_bytes(1));\n\
    \                timeout_last_reset = $realtime; // timeout resets upon finishing receiving RX byte\n\
    \              end\n            end\n          endcase\n          check_one_intr(.uart_intr(uart_intr),\
    \ .exp(0));\n        end\n\n        //"
