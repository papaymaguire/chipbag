  text: "// Line low(bit-times)  Frame Err?  Break?     Comment\n      //    <10                If STOP=0\
    \    No       Normal operation\n      //  10 (with parity)       No         No       Normal zero data\
    \ with STOP=1\n      //  10 (no parity)         Yes        No       Frame error since STOP=0\n   \
    \   //  11 - RXBLVL*char       Yes        No       Break less than detect level\n      //  >RXBLVL*char\
    \           Yes       Once      Frame signalled at every char-times,\n      //                   \
    \                          break at RXBLVL char-times\n      RxBreakErr: begin\n        bit [NumUartIntr-1:0]\
    \ exp_intr_state;\n        bit [NumUartIntr-1:0] exp_intr_state_mask = '1;\n        int level = ral.ctrl.rxblvl.get_mirrored_value();\n\
    \        int break_bytes = get_break_bytes_by_level(level);\n\n        // drive one good rx char to\
    \ reset DUT break cnt (allzero_cnt)\n        drive_rx_bytes(.num_bytes(1));\n        // clear rx fifo\
    \ and interrupts triggered by above driving\n        clear_fifos(.clear_tx_fifo(0), .clear_rx_fifo(1));\n\
    \        csr_wr(.ptr(ral.intr_state), .value((1 << NumUartIntr) - 1));\n\n        // Don't attempt\
    \ to predict Tx/Rx watermark when testing RxBreakErr so we don't need to\n        // predict TX/RX\
    \ FIFO levels for this test.\n        exp_intr_state_mask[TxWatermark] = 1'b0;\n        exp_intr_state_mask[TxEmpty]\
    \ = 1'b0;\n        exp_intr_state_mask[RxWatermark] = 1'b0;\n\n        fork\n          begin"
