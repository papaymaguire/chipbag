    \    repeat (num_bytes) begin\n      byte rx_byte;\n      `DV_CHECK_STD_RANDOMIZE_FATAL(rx_byte)\n\
    \      send_rx_byte(.data(rx_byte));\n    end\n  endtask : drive_rx_bytes\n\nendclass : uart_intr_vseq"
