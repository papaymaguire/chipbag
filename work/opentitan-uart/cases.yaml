  text: "// Enable these UART interrupts - RX watermark, TX empty and RX overflow.\n  // TX watermark\
    \ is enabled once the TX buffer has been written (otherwise it\n  // will fire immediately).\n  CHECK_DIF_OK(dif_uart_irq_set_enabled(uart,\
    \ kDifUartIrqRxWatermark,\n                                        kDifToggleEnabled));\n  CHECK_DIF_OK(\n\
    \      dif_uart_irq_set_enabled(uart, kDifUartIrqTxDone, kDifToggleEnabled));\n  CHECK_DIF_OK(\n \
    \     dif_uart_irq_set_enabled(uart, kDifUartIrqRxOverflow, kDifToggleEnabled));\n}\n\n/**\n * Initializes\
    \ PLIC and enables the relevant UART interrupts.\n */\nstatic void plic_init_with_irqs(dt_uart_t uart_dt,\
    \ dif_rv_plic_t *plic) {\n  LOG_INFO(\"Initializing the PLIC.\");\n\n  CHECK_DIF_OK(dif_rv_plic_init_from_dt(kDtRvPlic,\
